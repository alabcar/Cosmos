r."}, {"t": "Origen estelar de los elementos de la Tierra", "x": "La Tierra está hecha sobre todo de hierro, oxígeno, silicio y magnesio, y todos se formaron en estrellas que vivieron y murieron antes que el Sol. Lo mismo ocurre con nuestro cuerpo: el carbono, el nitrógeno, el oxígeno, el calcio de los huesos o el hierro de la sangre son de origen estelar.\nSolo el hidrógeno, que forma alrededor del 10 % de nuestra masa, procede directamente de los primeros minutos del universo.", "d": "tabla"}]}, {"n": 34, "titulo": "Agujeros negros", "intro": "Un agujero negro es el resultado extremo de la gravedad: tanta masa en tan poco espacio que nada puede escapar. Son objetos reales, observados de forma indirecta, que ponen a prueba nuestras mejores teorías.", "puntos": [{"t": "Qué es un agujero negro", "x": "Un agujero negro es una región del espacio donde la gravedad es tan intensa que nada puede salir, ni siquiera la luz. Según la relatividad general, una masa enorme muy concentrada curva tanto el espacio-tiempo que todos los caminos posibles se dirigen hacia dentro.\nNo es una aspiradora cósmica: a distancia atrae igual que cualquier otro objeto de la misma masa. Si el Sol se convirtiera en un agujero negro de su misma masa, la Tierra seguiría en la misma órbita.", "d": "espaciotiempo"}, {"t": "Colapso gravitatorio", "x": "Para formar un agujero negro hay que comprimir mucha masa en muy poco espacio. La naturaleza lo consigue cuando el núcleo de una estrella muy masiva se desploma tras agotar su combustible y ninguna presión puede frenarlo.\nEn principio, cualquier objeto se convertiría en agujero negro si se comprimiera lo suficiente: el Sol, en una esfera de unos 3 km de radio; la Tierra, en una de unos 9 milímetros, el tamaño de una canica."}, {"t": "Horizonte de sucesos", "x": "El horizonte de sucesos es la frontera de un agujero negro: lo que lo cruza ya no puede volver. No es una superficie material. Sin giro, su radio es r = 2·G·M / c², donde G es la constante de gravitación, M la masa y c la velocidad de la luz: unos 3 km por cada masa solar.\nVisto desde lejos, un reloj que cae hacia el horizonte parece ir cada vez más lento, y su luz, cada vez más roja."}, {"t": "Velocidad de escape", "x": "La velocidad de escape es la mínima necesaria para alejarse para siempre de un cuerpo: v = √(2·G·M / r), donde M es la masa y r la distancia al centro. En la Tierra es de 11,2 km/s y en la superficie del Sol, de unos 618 km/s.\nSi la misma masa se concentra en un radio cada vez menor, la velocidad de escape crece. En el horizonte de sucesos alcanza la velocidad de la luz, unos 300.000 km/s, y nada puede ir más rápido."}, {"t": "Singularidad como límite de la teoría", "x": "Las ecuaciones de la relatividad general predicen que, en el centro de un agujero negro, la materia se comprime hasta una densidad infinita: una singularidad. Pero un infinito en física suele indicar que la teoría deja de ser válida.\nA escalas tan pequeñas deberían importar los efectos cuánticos, que se vuelven decisivos hacia los 10⁻³⁵ metros, y aún no tenemos una teoría que una la gravedad con la mecánica cuántica. Qué hay realmente en el centro sigue siendo una pregunta abierta."}, {"t": "Agujeros negros estelares", "x": "Los agujeros negros estelares nacen del colapso de estrellas masivas y tienen desde unas 5 hasta varias decenas de masas solares. Se calcula que en la Vía Láctea podría haber unos 100 millones, aunque solo conocemos unas decenas.\nCygnus X-1 tiene unas 21 masas solares. En 2024, el satélite Gaia descubrió Gaia BH3, de unas 33 masas solares, a unos 1900 años luz, por el bamboleo que provoca en una estrella compañera."}, {"t": "Agujeros negros supermasivos", "x": "En el centro de casi todas las galaxias grandes hay un agujero negro supermasivo, con millones o miles de millones de masas solares. El de la Vía Láctea, Sagitario A*, tiene unos 4 millones y está a unos 26.000 años luz; su masa se midió siguiendo durante décadas las órbitas de las estrellas que lo rodean.\nEl de la galaxia M87 tiene unos 6500 millones de masas solares: en 2019 se publicó la primera imagen de su sombra."}, {"t": "Agujeros negros intermedios", "x": "Entre los estelares y los supermasivos debería haber agujeros negros intermedios, de cientos a cientos de miles de masas solares, pero son difíciles de encontrar. Podrían ser las semillas de los supermasivos.\nYa hay pruebas de algunos: en 2019 se detectaron ondas gravitacionales de la fusión de dos agujeros negros de unas 85 y 66 masas solares, que dejó uno de unas 140. En 2024, el movimiento de estrellas en el cúmulo Omega Centauri indicó otro de al menos 8000 masas solares."}, {"t": "Qué puede observarse y qué no", "x": "No podemos ver el interior de un agujero negro, porque ninguna señal sale del horizonte. Sí observamos sus efectos: estrellas que orbitan alrededor de algo invisible, gas que se calienta a millones de grados y emite rayos X antes de caer, ondas gravitacionales y la sombra que recortan sobre el gas brillante.\nStephen Hawking predijo que emiten una radiación débil, pero para uno de una masa solar su temperatura sería de unas 60 milmillonésimas de grado: indetectable."}]}, {"n": 35, "titulo": "Entornos extremos", "intro": "Alrededor de agujeros negros y estrellas de neutrones la materia alcanza temperaturas, velocidades y campos magnéticos imposibles en la Tierra. Estos entornos producen las señales más energéticas del universo y ponen a prueba la física en condiciones límite.", "puntos": [{"t": "Discos de acreción", "x": "Cuando un objeto compacto atrae gas, este no cae en línea recta: gira a su alrededor formando un disco, como en el nacimiento de las estrellas. El rozamiento entre capas que giran a distinta velocidad lo calienta hasta millones de grados cerca del centro, donde emite rayos X.\nEs una forma muy eficaz de liberar energía: el gas que cae hacia un agujero negro puede convertir en radiación alrededor del 10 % de su masa, frente al 0,7 % de la fusión del hidrógeno."}, {"t": "Chorros relativistas", "x": "Parte del material del disco sale disparada en dos chorros estrechos, perpendiculares a él, impulsados por campos magnéticos retorcidos por el giro. Se llaman relativistas porque se mueven a velocidades próximas a la de la luz.\nEl chorro de la galaxia M87, que nace de su agujero negro supermasivo, mide unos 5000 años luz. En nuestra galaxia, el sistema SS 433 lanza chorros a alrededor de una cuarta parte de la velocidad de la luz, unos 80.000 km/s."}, {"t": "Radiación de alta energía", "x": "Estos entornos emiten rayos X y rayos gamma, la radiación más energética. La atmósfera terrestre la absorbe, así que hay que observarla desde el espacio. La primera fuente de rayos X fuera del sistema solar, Scorpius X-1, se descubrió en 1962 con un cohete.\nHoy telescopios espaciales como Chandra, lanzado en 1999, o Fermi, de 2008, estudian discos de acreción, chorros y destellos de rayos gamma, las explosiones más luminosas que se conocen."}, {"t": "Estrellas de neutrones", "x": "Una estrella de neutrones es un laboratorio extremo. Tiene una corteza sólida y un interior de neutrones más denso que un núcleo atómico. Su gravedad en la superficie es cientos de miles de millones de veces la terrestre: sus «montañas» no superarían unos milímetros.\nNo pueden tener cualquier masa: la mayor medida con precisión, la del púlsar PSR J0740+6620, es de unas 2,1 masas solares. Por encima de un límite algo mayor colapsarían en agujeros negros."}, {"t": "Púlsares", "x": "Algunos púlsares giran centenares de veces por segundo. Son los púlsares de milisegundo: estrellas de neutrones viejas aceleradas al recibir materia de una compañera. El más rápido conocido, PSR J1748-2446ad, gira 716 veces por segundo.\nSus pulsos son tan regulares que funcionan como relojes de enorme precisión. En 1992 se descubrieron así los primeros planetas fuera del sistema solar, alrededor del púlsar PSR B1257+12, por las pequeñas variaciones en la llegada de sus pulsos."}, {"t": "Magnetars", "x": "Los magnetares son estrellas de neutrones con los campos magnéticos más intensos conocidos, unos mil billones de veces el de la Tierra. Ese campo tensa la corteza hasta que se resquebraja y libera estallidos de rayos X y gamma.\nEl 27 de diciembre de 2004, el magnetar SGR 1806-20, a decenas de miles de años luz, emitió en una décima de segundo más energía que el Sol en unos 100.000 años, y su radiación llegó a alterar la alta atmósfera terrestre."}, {"t": "Sistemas binarios", "x": "Muchas estrellas no están solas: alrededor de la mitad de las estrellas parecidas al Sol tienen al menos una compañera, y entre las estrellas masivas la proporción es aún mayor. Las dos estrellas orbitan alrededor de su centro de masas.\nCuando una de ellas muere y deja un objeto compacto, la pareja puede seguir unida. En Cygnus X-1, un agujero negro de unas 21 masas solares y una supergigante azul giran uno alrededor del otro cada 5,6 días.", "d": "orbita"}, {"t": "Transferencia de masa", "x": "Si dos estrellas están muy cerca, la gravedad de una puede arrancar gas de la otra cuando esta se hincha, por ejemplo al convertirse en gigante. El gas fluye hacia la compañera y suele formar un disco de acreción a su alrededor.\nEsto cambia la vida de ambas. En Algol, una estrella doble de Perseo que se eclipsa cada 2,87 días, la estrella menos masiva está más evolucionada: fue la más masiva y cedió gran parte de su materia a su compañera."}, {"t": "Fusiones de objetos compactos", "x": "Dos objetos compactos en órbita, como dos estrellas de neutrones o dos agujeros negros, pierden energía poco a poco emitiendo ondas gravitacionales, se acercan en espiral y acaban fusionándose. Lo predice la relatividad general y lo confirmó el púlsar binario descubierto en 1974 por Hulse y Taylor, cuya órbita se encoge al ritmo previsto.\nEl 17 de agosto de 2017 se observó la fusión de dos estrellas de neutrones con ondas gravitacionales y, poco después, con rayos gamma y luz visible."}, {"t": "Ondas gravitacionales", "x": "Las ondas gravitacionales son ondulaciones del propio espacio-tiempo que viajan a la velocidad de la luz. Al pasar, estiran y encogen las distancias en una cantidad minúscula.\nEl 14 de septiembre de 2015, los detectores LIGO registraron la primera: la fusión de dos agujeros negros de unas 36 y 29 masas solares, a unos 1300 millones de años luz. Sus brazos de 4 km cambiaron de longitud menos de una milésima del tamaño de un protón.", "d": "espaciotiempo"}]}, {"n": 36, "titulo": "La Tierra como planeta", "intro": "La Tierra es el único planeta que conocemos con vida, y también el que mejor podemos estudiar. Entender cómo funcionan su interior, su atmósfera y su superficie es la base para buscar mundos habitables en otros lugares.", "puntos": [{"t": "Estructura interna", "x": "La Tierra tiene capas. La corteza mide de 5 a 70 km de espesor; debajo está el manto, de roca caliente, hasta unos 2900 km de profundidad; luego el núcleo externo, de hierro y níquel líquidos, y en el centro un núcleo interno sólido de unos 1220 km de radio, a una temperatura parecida a la de la superficie del Sol.\nNadie ha perforado más de unos 12 km: todo esto se sabe por cómo viajan las ondas de los terremotos a través del planeta."}, {"t": "Atmósfera", "x": "La atmósfera es una capa de gas sujeta por la gravedad. En volumen tiene un 78 % de nitrógeno, un 21 % de oxígeno, casi un 1 % de argón y un 0,04 % de dióxido de carbono.\nSu composición actual se debe a la vida: el oxígeno lo produjeron organismos fotosintéticos, que empezaron a acumularlo hace unos 2400 millones de años. La capa de ozono, entre 15 y 35 km de altura, nos protege del ultravioleta."}, {"t": "Campo magnético", "x": "El hierro líquido del núcleo externo se mueve por convección y por la rotación terrestre, y esas corrientes de material conductor generan el campo magnético, como una dinamo. En la superficie es débil, entre 25 y 65 microteslas, pero se extiende miles de kilómetros en el espacio.\nDesvía la mayor parte del viento solar, y las partículas que se cuelan cerca de los polos producen las auroras. Su polaridad se invierte de vez en cuando: la última vez fue hace unos 780.000 años."}, {"t": "Ciclo del agua", "x": "El agua cubre el 71 % de la superficie terrestre, y el 97 % de ella está en los océanos. Circula sin cesar: la energía del Sol la evapora, el vapor sube, se enfría y se condensa en nubes, y vuelve a caer como lluvia o nieve, que alimenta ríos, glaciares y acuíferos.\nCada año se evaporan unos 500.000 km³ de agua. Una molécula pasa de media unos 9 días en la atmósfera antes de volver a caer."}, {"t": "Clima", "x": "El tiempo atmosférico es lo que ocurre un día concreto; el clima es su promedio durante décadas, normalmente 30 años. Depende de la energía que llega del Sol, unos 1361 vatios por metro cuadrado en lo alto de la atmósfera, y de cómo la reparten el aire y los océanos.\nLas estaciones no se deben a la distancia al Sol, sino a la inclinación del eje terrestre, de 23,4°. De hecho, la Tierra está más cerca del Sol a principios de enero."}, {"t": "Efecto invernadero", "x": "La superficie, calentada por el Sol, emite radiación infrarroja. Algunos gases, como el vapor de agua, el dióxido de carbono y el metano, absorben parte de ese infrarrojo y lo reemiten en todas direcciones, también hacia el suelo. Así la Tierra retiene más calor.\nSin este efecto, la temperatura media sería de unos −18 °C en lugar de unos 15 °C. Desde el siglo XIX, el dióxido de carbono del aire ha pasado de unas 280 a más de 420 partes por millón."}, {"t": "Tectónica de placas", "x": "La capa rígida exterior de la Tierra está rota en una docena de grandes placas que se desplazan sobre el manto, empujadas por el calor interno. Se mueven unos pocos centímetros al año, más o menos lo que crecen las uñas.\nDonde se separan nace corteza nueva; donde chocan se levantan montañas, como el Himalaya, fruto del choque de la India con Asia. El Atlántico se ensancha unos 2,5 cm al año. La Tierra es el único planeta conocido con tectónica de placas activa."}, {"t": "Evolución de la superficie", "x": "La Tierra tiene unos 4540 millones de años, pero su superficie se renueva constantemente: la tectónica, la erosión del agua y el viento y los volcanes borran el pasado. Los minerales más antiguos, cristales de circón hallados en Australia, tienen unos 4400 millones de años.\nPor eso conservamos pocos cráteres, unos 200 confirmados, mientras que la Luna está cubierta de ellos. Uno de los más conocidos, Chicxulub, en México, se formó hace 66 millones de años."}, {"t": "Condiciones que permiten la vida", "x": "La Tierra reúne varias condiciones favorables a la vida: está a la distancia adecuada del Sol, unos 150 millones de kilómetros, para tener agua líquida en su superficie; tiene una atmósfera que regula la temperatura, un campo magnético que la protege y una tectónica que recicla el carbono a lo largo de millones de años.\nLas pruebas más antiguas de vida tienen al menos 3500 millones de años: la vida apareció pronto y se ha mantenido desde entonces."}]}, {"n": 37, "titulo": "Habitabilidad", "intro": "Para que un mundo pueda albergar vida como la conocemos necesita varias condiciones a la vez. Entenderlas nos dice dónde buscar en el universo y por qué la Tierra es especial, aunque quizá no única.", "puntos": [{"t": "Agua líquida", "x": "Toda la vida conocida necesita agua líquida: disuelve sustancias y permite que las moléculas se encuentren y reaccionen dentro de las células.\nEl agua solo es líquida en un rango de temperatura y presión. A la presión del nivel del mar, entre 0 °C y 100 °C. En Marte, con una presión atmosférica más de cien veces menor que la terrestre, el agua de la superficie se evapora o se congela casi enseguida."}, {"t": "Temperatura", "x": "La temperatura controla la química de la vida. Si hace demasiado frío, las reacciones se vuelven lentísimas; si hace demasiado calor, las moléculas complejas como las proteínas se rompen.\nLa Tierra tiene una temperatura media de unos 15 °C. Venus, más cercano al Sol y con un efecto invernadero desbocado, alcanza unos 464 °C en su superficie: suficiente para fundir el plomo y destruir cualquier molécula orgánica conocida."}, {"t": "Atmósfera", "x": "Una atmósfera hace tres trabajos: mantiene la presión necesaria para el agua líquida, reparte el calor entre el día y la noche y frena parte de la radiación peligrosa.\nSin el efecto invernadero de su aire, la Tierra tendría una temperatura media de unos −18 °C, bajo cero. La Luna, sin atmósfera, pasa de unos 120 °C al mediodía a menos de −170 °C por la noche."}, {"t": "Fuente de energía", "x": "La vida necesita una fuente de energía para mantenerse y crecer. En la Tierra, casi toda procede de la luz del Sol que captan las plantas y las algas mediante la fotosíntesis.\nPero no es la única. En las fuentes hidrotermales del fondo oceánico, en total oscuridad, hay comunidades enteras que obtienen energía de reacciones químicas con sustancias como el sulfuro de hidrógeno que brota de la corteza."}, {"t": "Elementos químicos esenciales", "x": "La vida terrestre se construye sobre todo con seis elementos: carbono, hidrógeno, nitrógeno, oxígeno, fósforo y azufre, a veces resumidos con las siglas CHNOPS.\nEl carbono es la pieza clave porque puede formar cuatro enlaces y crear cadenas larguísimas y estables, como el ADN. Un cuerpo humano es, en masa, aproximadamente un 65 % oxígeno, un 18 % carbono y un 10 % hidrógeno, en gran parte en forma de agua."}, {"t": "Estabilidad ambiental", "x": "La vida necesita tiempo. En la Tierra pasaron cientos de millones de años entre la formación del planeta y los primeros microbios, y unos 3000 millones más hasta los animales.\nPor eso importa que las condiciones sean estables durante mucho tiempo: una estrella tranquila, una órbita casi circular y un clima regulado. El Sol ha aumentado su brillo de forma muy gradual durante 4600 millones de años, lo que ha dado margen para evolucionar."}, {"t": "Zona habitable", "x": "La zona habitable es la franja alrededor de una estrella donde un planeta parecido a la Tierra podría tener agua líquida en su superficie. Ni demasiado cerca, donde hierve, ni demasiado lejos, donde se congela.\nEn el sistema solar va, aproximadamente, de 0,95 a 1,7 veces la distancia Tierra-Sol (unos 150 millones de km). En estrellas más frías, como las enanas rojas, la zona está mucho más cerca de la estrella.", "d": "sistema"}, {"t": "Límites del concepto de habitabilidad", "x": "La zona habitable es una guía, no una garantía. La Luna está a la misma distancia del Sol que la Tierra y no tiene agua líquida porque no retiene atmósfera.\nAl revés, Europa, una luna de Júpiter, está muy lejos de esa zona y probablemente esconde un océano bajo su hielo, calentado por las mareas que provoca Júpiter. La habitabilidad depende también del tamaño, la atmósfera y el calor interno del cuerpo."}, {"t": "Diferencia entre habitabilidad y presencia de vida", "x": "Que un lugar sea habitable significa que reúne las condiciones para que la vida pueda existir allí, no que la haya. Es una posibilidad, no un hallazgo.\nUn buen ejemplo es Marte: el róver Curiosity demostró en 2013 que el cráter Gale albergó hace más de 3000 millones de años un lago de agua dulce, con los ingredientes necesarios para microbios. Era habitable. Si llegó a tener vida es otra pregunta, todavía sin respuesta."}]}, {"n": 38, "titulo": "Exoplanetas", "intro": "Los exoplanetas son planetas que giran alrededor de otras estrellas. Hasta los años noventa no sabíamos si existían; hoy conocemos miles, y su estudio nos permite comparar nuestro sistema solar con otros.", "puntos": [{"t": "Qué es un exoplaneta", "x": "Un exoplaneta es un planeta que orbita una estrella distinta del Sol. Los primeros se encontraron en 1992 alrededor de un púlsar, y en 1995 Michel Mayor y Didier Queloz descubrieron 51 Pegasi b, el primero junto a una estrella parecida al Sol, lo que les valió el Nobel de Física de 2019.\nEn 2025 el catálogo de la NASA superó los 6000 exoplanetas confirmados."}, {"t": "Método del tránsito", "x": "Cuando un planeta pasa por delante de su estrella, vista desde la Tierra, tapa una pequeña parte de su disco y la estrella se atenúa un poco. Es un tránsito, como un mini eclipse.\nLa caída de brillo es diminuta: Júpiter visto desde fuera atenuaría al Sol un 1 % y la Tierra solo un 0,008 %. El telescopio espacial Kepler, entre 2009 y 2018, descubrió así más de 2600 planetas.", "d": "transito"}, {"t": "Método de la velocidad radial", "x": "Un planeta y su estrella giran alrededor de su centro de masas común, así que la estrella también se bambolea un poco. Cuando se acerca a nosotros su luz se desplaza al azul, y cuando se aleja, al rojo: es el efecto Doppler.\nJúpiter hace que el Sol se mueva a unos 12,5 m/s; la Tierra, a solo 9 cm/s, más despacio que una persona caminando.", "d": "doppler"}, {"t": "Imagen directa", "x": "Fotografiar un exoplaneta es muy difícil: la estrella brilla miles de millones de veces más que él y está pegada a su lado. Para lograrlo se usan coronógrafos, que tapan la luz de la estrella, y se observa en infrarrojo, donde los planetas jóvenes y calientes brillan más.\nUn ejemplo famoso es HR 8799, una estrella con cuatro planetas gigantes fotografiados directamente entre 2008 y 2010."}, {"t": "Microlentes gravitacionales", "x": "Según la relatividad general, una masa curva el espacio y desvía la luz que pasa cerca. Si una estrella pasa justo delante de otra más lejana, actúa como una lupa y la estrella del fondo se ve más brillante durante unas semanas.\nSi la estrella que hace de lupa tiene un planeta, este añade un pico breve, de horas o días. Es un suceso único que no se repite, pero detecta planetas muy lejanos."}, {"t": "Tamaño y masa", "x": "El tránsito indica el tamaño: cuanto más luz tapa el planeta, mayor es su radio. La velocidad radial indica la masa: cuanto más tira de su estrella, más masivo es. Combinar ambos métodos da el retrato más completo.\nPor ejemplo, 51 Pegasi b tiene alrededor de la mitad de la masa de Júpiter y da una vuelta a su estrella en solo 4,2 días, mucho más cerca que Mercurio del Sol."}, {"t": "Densidad", "x": "Si conocemos el tamaño y la masa, podemos calcular la densidad: densidad = masa / volumen. Ese número revela de qué está hecho el planeta.\nLa Tierra, rocosa y con núcleo de hierro, tiene 5,5 g/cm³. Saturno, casi todo hidrógeno y helio, apenas 0,7 g/cm³, menos que el agua (1 g/cm³). Un exoplaneta con densidad cercana a 5 probablemente es rocoso; uno cercano a 1, probablemente gaseoso."}, {"t": "Atmósferas", "x": "Durante un tránsito, una pequeña parte de la luz de la estrella atraviesa la atmósfera del planeta. Cada gas absorbe ciertos colores, así que el espectro de esa luz revela su composición, como una huella dactilar.\nEn 2022 el telescopio espacial James Webb detectó de esta forma dióxido de carbono en la atmósfera de WASP-39 b, un planeta gigante y caliente situado a unos 700 años luz."}, {"t": "Sistemas planetarios", "x": "Muchas estrellas tienen varios planetas, y no siempre se parecen al nuestro. TRAPPIST-1, una enana roja a unos 40 años luz, tiene siete planetas del tamaño de la Tierra, todos más cerca de su estrella que Mercurio del Sol.\nTambién existen los «júpiteres calientes», gigantes gaseosos que dan una vuelta en pocos días. Su existencia demostró que los planetas pueden migrar lejos del lugar donde se formaron."}, {"t": "Sesgos de detección", "x": "Cada método encuentra con más facilidad ciertos planetas, y eso distorsiona la muestra. Tránsito y velocidad radial favorecen los planetas grandes y cercanos a su estrella, porque producen señales mayores y más frecuentes.\nAdemás, para ver un tránsito la órbita debe estar casi de canto respecto a nosotros. Un observador lejano solo tendría una probabilidad de un 0,5 % de ver a la Tierra pasar por delante del Sol."}]}, {"n": 39, "titulo": "Astrobiología", "intro": "La astrobiología estudia el origen, la evolución y la posible existencia de vida en el universo. Une biología, química, geología y astronomía para responder una pregunta antigua: ¿estamos solos?", "puntos": [{"t": "Definición de vida", "x": "No hay una definición de vida aceptada por todos. La NASA usa una de trabajo: «un sistema químico autosostenido capaz de evolución darwiniana». Es decir, algo que se mantiene, se reproduce y cambia con las generaciones.\nLos casos dudosos muestran la dificultad: un virus tiene genes y evoluciona, pero no puede reproducirse fuera de una célula. Una llama crece y consume energía, pero no evoluciona."}, {"t": "Origen de la vida", "x": "La Tierra se formó hace unos 4540 millones de años y hay indicios de microbios de hace al menos 3500 millones de años, en rocas fósiles llamadas estromatolitos. La vida apareció, por tanto, relativamente pronto.\nCómo surgió aún no se sabe. En 1953 el experimento de Miller y Urey demostró que, con gases sencillos, agua y descargas eléctricas, se forman aminoácidos, piezas básicas de las proteínas."}, {"t": "Extremófilos", "x": "Los extremófilos son organismos que prosperan en condiciones que matarían a casi cualquier otro ser vivo. El microbio Methanopyrus kandleri puede crecer a 122 °C en fuentes hidrotermales.\nLa bacteria Deinococcus radiodurans soporta dosis de radiación miles de veces superiores a las que matarían a una persona. Estos seres amplían la lista de lugares donde la vida podría existir fuera de la Tierra."}, {"t": "Vida en el sistema solar", "x": "En el sistema solar, los mejores candidatos para buscar vida son lugares que tienen o tuvieron agua líquida y energía: Marte, la luna Europa de Júpiter y la luna Encélado de Saturno. Titán, otra luna de Saturno, interesa por su química orgánica.\nNo buscamos animales ni plantas, sino microbios o sus restos, que son la forma de vida más resistente y la más antigua de la Tierra.", "d": "sistema"}, {"t": "Marte", "x": "Hoy Marte es frío, seco y con una atmósfera muy fina, pero hace más de 3000 millones de años tuvo ríos y lagos. Sus valles y deltas secos lo demuestran.\nEl róver Perseverance aterrizó en 2021 en el cráter Jezero, un antiguo lago con delta, y recoge muestras de roca en tubos sellados. El objetivo es traerlas a la Tierra para analizarlas con instrumentos que no caben en un róver."}, {"t": "Europa", "x": "Europa, una luna de Júpiter algo menor que nuestra Luna, está cubierta por una corteza de hielo de varios kilómetros de espesor. Debajo hay, muy probablemente, un océano de agua salada con más agua que todos los océanos de la Tierra juntos.\nLo mantienen líquido las mareas de Júpiter, que estiran y comprimen la luna. La sonda Europa Clipper, lanzada en 2024, llegará en 2030 para estudiarlo."}, {"t": "Encélado", "x": "Encélado es una luna de Saturno de solo unos 500 km de diámetro. En 2005 la sonda Cassini descubrió chorros de vapor y hielo que salen de grietas cerca de su polo sur, alimentados por un océano interior.\nCassini atravesó esos chorros y encontró agua salada, moléculas orgánicas e hidrógeno, que en la Tierra sirve de alimento a microbios de las fuentes hidrotermales. Es uno de los lugares más prometedores."}, {"t": "Titán", "x": "Titán, la mayor luna de Saturno, tiene una atmósfera densa de nitrógeno, con una presión en superficie 1,5 veces la terrestre. Hace unos −179 °C, así que allí llueve metano y hay lagos de metano y etano líquidos.\nLa sonda Huygens se posó en Titán en 2005. Si existe vida allí, tendría que usar una química muy distinta a la nuestra. La misión Dragonfly, un dron, debería llegar en 2034."}, {"t": "Biosignaturas", "x": "Una biosignatura es una señal que podría deberse a seres vivos: una sustancia, una estructura o una mezcla de gases difícil de explicar sin vida.\nEl mejor ejemplo es la atmósfera terrestre: tiene un 21 % de oxígeno y también metano, dos gases que reaccionan entre sí y desaparecerían si la vida no los repusiera continuamente. Detectar esa combinación en un exoplaneta sería una pista muy importante, aunque no definitiva.", "d": "espectro"}, {"t": "Tecnofirmas", "x": "Una tecnofirma es una señal producida por tecnología, no solo por vida. Por ejemplo, emisiones de radio artificiales, destellos de láser o gases industriales que la naturaleza no fabrica, como algunos compuestos con cloro y flúor usados en refrigeración.\nLa propia Tierra emite tecnofirmas: desde hace aproximadamente un siglo nuestras emisiones de radio y televisión se alejan por el espacio a la velocidad de la luz."}, {"t": "Diferencia entre indicio y prueba", "x": "Un indicio es algo compatible con la vida; una prueba es algo que solo la vida puede explicar, comprobado de forma independiente. Confundirlos ha causado más de un error.\nEn 1996 se anunciaron posibles microfósiles en el meteorito marciano ALH84001. Después se vio que esas estructuras podían formarse sin vida, y hoy la mayoría de los científicos no las considera una prueba. La cautela es parte esencial del método."}]}, {"n": 40, "titulo": "Vida extraterrestre", "intro": "¿Hay otras civilizaciones en la galaxia? Este tema explica cómo se busca vida inteligente, qué razonamientos usamos para estimar si existe y por qué hay que ser muy prudentes al interpretar cualquier señal.", "puntos": [{"t": "Búsqueda de señales", "x": "La forma más directa de buscar civilizaciones es escuchar señales artificiales con radiotelescopios. Una señal natural suele repartirse en muchas frecuencias; una emisora, en cambio, concentra su energía en una frecuencia muy estrecha.\nEl caso más conocido es la señal «Wow!», captada el 15 de agosto de 1977 por el radiotelescopio Big Ear, en Estados Unidos. Duró 72 segundos y nunca volvió a detectarse, así que no se sabe qué fue.", "d": "onda"}, {"t": "SETI", "x": "SETI son las siglas en inglés de «búsqueda de inteligencia extraterrestre». Empezó en 1960, cuando Frank Drake apuntó un radiotelescopio a dos estrellas cercanas, Tau Ceti y Épsilon Eridani, durante el llamado Proyecto Ozma.\nEscuchó cerca de 1420 MHz, la frecuencia que emite el hidrógeno, el elemento más abundante, que una civilización curiosa también conocería. Desde 2016 el proyecto Breakthrough Listen ha ampliado mucho esa búsqueda."}, {"t": "Paradoja de Fermi", "x": "En 1950 el físico Enrico Fermi preguntó a sus colegas: «¿Dónde está todo el mundo?». La galaxia tiene más de 10 000 millones de años y cientos de miles de millones de estrellas. Incluso viajando despacio, una civilización podría haberla recorrido entera en unas decenas de millones de años.\nSi la vida inteligente fuera común, deberíamos ver alguna huella. No la vemos: esa contradicción es la paradoja de Fermi."}, {"t": "Ecuación de Drake", "x": "En 1961 Frank Drake propuso una ecuación para ordenar lo que no sabemos: N = R · fp · ne · fl · fi · fc · L. N es el número de civilizaciones detectables en la galaxia; R, las estrellas que nacen al año; los factores f y ne, las fracciones con planetas, habitables, con vida, con inteligencia y con tecnología; L, cuánto dura una civilización.\nSolo conocemos bien los primeros factores; los demás son conjeturas."}, {"t": "Civilizaciones tecnológicas", "x": "Una civilización tecnológica es aquella capaz de producir efectos detectables a distancia, como señales de radio. Con esa definición, la humanidad lo es desde hace poco más de un siglo, frente a unos 300 000 años de nuestra especie.\nEn 1964 el astrónomo Nikolái Kardashev propuso clasificarlas por la energía que usan: la de su planeta, la de su estrella o la de una galaxia entera. Nosotros aún no alcanzamos el primer nivel."}, {"t": "Comunicación interestelar", "x": "La humanidad ha enviado algunos mensajes deliberados. En 1974 el radiotelescopio de Arecibo emitió un mensaje de 1679 bits hacia el cúmulo de estrellas M13, situado a unos 25 000 años luz: no llegará hasta dentro de unos 25 000 años.\nLas sondas Voyager, lanzadas en 1977, llevan un disco dorado con sonidos e imágenes de la Tierra. Cualquier conversación interestelar sería lentísima por la distancia."}, {"t": "Distancias y tiempos de viaje", "x": "Las distancias entre estrellas son enormes. Próxima Centauri, la más cercana, está a 4,24 años luz, unos 40 billones de kilómetros. Un mensaje de radio tarda 4,24 años en llegar, y la respuesta otros tantos.\nLa sonda Voyager 1 viaja a unos 17 km/s, una de las naves más rápidas que se alejan del sistema solar. A esa velocidad tardaría unos 75 000 años en recorrer la distancia hasta Próxima Centauri."}, {"t": "Falsos positivos", "x": "Muchas señales que parecían artificiales resultaron tener otro origen. En 1967 Jocelyn Bell detectó pulsos de radio tan regulares que se apodaron en broma LGM-1, «hombrecillos verdes 1». Eran púlsares, estrellas de neutrones que giran rápidamente.\nEn 2015 se descubrió que unas señales misteriosas captadas en un radiotelescopio australiano procedían de un horno microondas abierto antes de tiempo en el propio observatorio."}, {"t": "Evidencia científica", "x": "Para aceptar un descubrimiento así hacen falta pruebas muy sólidas. Como dijo Carl Sagan, «las afirmaciones extraordinarias requieren pruebas extraordinarias».\nEn la práctica, una señal debe repetirse, verse con instrumentos distintos y por equipos independientes, venir de un punto fijo del cielo que se mueva con las estrellas y descartar cualquier interferencia terrestre, como satélites o teléfonos. Hasta hoy, ninguna señal ha superado todas estas pruebas."}, {"t": "Límites de lo que podemos afirmar", "x": "No haber encontrado señales no demuestra que no existan civilizaciones. Hemos explorado una parte minúscula de las estrellas, de las frecuencias posibles y del tiempo.\nUn estudio de 2018 comparó lo explorado con buscar en una bañera de agua sacada de todos los océanos de la Tierra. Lo honesto es decir que no sabemos si hay otras civilizaciones, y que de momento no tenemos ninguna prueba de que existan."}]}, {"n": 41, "titulo": "La Vía Láctea", "intro": "La Vía Láctea es la galaxia en la que vivimos: un enorme sistema de estrellas, gas, polvo y materia invisible unidos por la gravedad. Conocerla es conocer nuestro barrio cósmico y el modelo para entender las demás galaxias.", "puntos": [{"t": "Estructura de la galaxia", "x": "La Vía Láctea es una galaxia espiral barrada: un disco plano con brazos en espiral, una barra de estrellas en el centro, un bulbo abultado y un halo esférico que lo envuelve todo.\nContiene entre 100 000 y 400 000 millones de estrellas. Vista desde fuera se parecería a un gran remolino luminoso. Desde dentro la vemos como una franja blanquecina que cruza el cielo nocturno en lugares sin contaminación lumínica.", "d": "galaxia"}, {"t": "Disco galáctico", "x": "El disco es la parte principal de la galaxia. Mide unos 100 000 años luz de diámetro (un año luz es la distancia que recorre la luz en un año, unos 9,5 billones de km), pero solo unos 1000 años luz de grosor: en proporción, es tan fino como un CD.\nEn el disco está la mayor parte del gas y del polvo, y por eso es donde siguen naciendo estrellas."}, {"t": "Bulbo central", "x": "En el centro del disco hay un bulbo, una región abultada y densa de unos 10 000 años luz de diámetro, atravesada por una barra alargada de estrellas.\nEl bulbo está formado sobre todo por estrellas viejas de tonos amarillos y rojizos, muy apiñadas. Desde la Tierra se encuentra en dirección a la constelación de Sagitario, donde la Vía Láctea se ve más ancha y brillante en las noches de verano."}, {"t": "Halo", "x": "El halo es una enorme región aproximadamente esférica que rodea el disco. Contiene pocas estrellas, casi todas muy antiguas, y unos 150 cúmulos globulares: bolas compactas de cientos de miles de estrellas que se formaron hace más de 10 000 millones de años.\nEl halo también contiene la mayor parte de la masa de la galaxia en forma de materia invisible, llamada materia oscura, que se estudiará más adelante."}, {"t": "Brazos espirales", "x": "Los brazos espirales no son estructuras fijas de estrellas, sino ondas de densidad: zonas donde el gas se comprime al pasar, como un atasco en una autopista por el que los coches entran y salen.\nEse gas comprimido forma muchas estrellas nuevas, entre ellas algunas azules y muy brillantes que viven poco. Por eso los brazos destacan. Los principales son el de Perseo, el de Escudo-Centauro y el de Sagitario."}, {"t": "Sistema solar en la Vía Láctea", "x": "El sistema solar no está en el centro de la galaxia, sino en el disco, a unos 26 000 años luz del centro, más o menos a medio camino hacia el borde.\nSe encuentra en el brazo de Orión, una estructura menor situada entre los brazos de Sagitario y de Perseo. Como vemos la galaxia desde dentro y el polvo tapa gran parte de la luz, cartografiarla es tan difícil como dibujar un bosque desde su interior."}, {"t": "Poblaciones estelares", "x": "Las estrellas de la galaxia se agrupan en poblaciones según su edad y composición. Las de población I son relativamente jóvenes, ricas en elementos pesados y viven en el disco; el Sol es una de ellas.\nLas de población II son viejas, pobres en elementos pesados y abundan en el halo y en los cúmulos globulares. Se formaron cuando aún había pocas generaciones de estrellas que hubieran fabricado esos elementos."}, {"t": "Centro galáctico", "x": "El centro galáctico está a unos 26 000 años luz, en dirección a Sagitario. Allí las estrellas están muchísimo más juntas que cerca del Sol.\nEn luz visible no podemos verlo: el polvo del disco absorbe casi toda esa luz, y de cada billón de fotones visibles apenas nos llega uno. Por eso se observa en infrarrojo, en ondas de radio y en rayos X, que atraviesan el polvo mucho mejor."}, {"t": "Agujero negro supermasivo", "x": "En el centro mismo de la galaxia hay un agujero negro supermasivo, Sagitario A*, con unos 4 millones de veces la masa del Sol. Se descubrió siguiendo durante décadas las órbitas de estrellas cercanas: la estrella S2 lo rodea cada 16 años.\nEse trabajo valió el Nobel de Física de 2020 a Reinhard Genzel y Andrea Ghez. En 2022 el Event Horizon Telescope publicó la primera imagen de su entorno."}, {"t": "Movimiento del Sol alrededor de la galaxia", "x": "El Sol no está quieto: gira alrededor del centro galáctico a unos 230 km/s, arrastrando consigo a toda la Tierra. A esa velocidad recorremos más de 800 000 km cada hora.\nAun así, tarda unos 230 millones de años en dar una vuelta completa, lo que a veces se llama un año galáctico. En toda su vida, unos 4600 millones de años, el Sol habrá dado unas 20 vueltas a la galaxia.", "d": "orbita"}]}, {"n": 42, "titulo": "Tipos de galaxias", "intro": "No todas las galaxias son como la nuestra. Las hay espirales, redondeadas, deformes, diminutas o con un núcleo deslumbrante. Clasificarlas ayuda a entender cómo se forman y cómo cambian con el tiempo.", "puntos": [{"t": "Galaxias espirales", "x": "Las galaxias espirales tienen un disco plano con brazos, un bulbo central y mucho gas y polvo, por lo que forman estrellas activamente. Muchas, como la Vía Láctea, tienen una barra central.\nLa espiral grande más cercana es Andrómeda, a unos 2,5 millones de años luz. Es visible a simple vista desde un lugar oscuro como una mancha alargada en el cielo de otoño, y tiene alrededor de un billón de estrellas.", "d": "galaxia"}, {"t": "Galaxias elípticas", "x": "Las galaxias elípticas tienen forma redondeada u ovalada, sin disco ni brazos. Contienen sobre todo estrellas viejas y rojizas y muy poco gas frío, así que apenas forman estrellas nuevas.\nLas mayores galaxias conocidas son elípticas gigantes. Un ejemplo es M87, a unos 53 millones de años luz, en el centro del cúmulo de Virgo. Su agujero negro central, de unos 6500 millones de masas solares, fue el primero fotografiado, en 2019."}, {"t": "Galaxias lenticulares", "x": "Las galaxias lenticulares son un tipo intermedio entre las espirales y las elípticas. Tienen un disco y un bulbo, como las espirales, pero casi no tienen brazos ni gas para formar estrellas.\nVistas de canto parecen una lente, de ahí su nombre. Abundan en los cúmulos de galaxias densos, donde muchas pudieron perder su gas al chocar con el gas caliente del cúmulo o con otras galaxias."}, {"t": "Galaxias irregulares", "x": "Las galaxias irregulares no tienen una forma definida: ni disco ordenado ni figura redondeada. Suelen ser ricas en gas y formar muchas estrellas.\nLas más conocidas son la Gran y la Pequeña Nube de Magallanes, satélites de la Vía Láctea situados a unos 160 000 y 200 000 años luz. Se ven a simple vista desde el hemisferio sur como dos manchas luminosas, y la gravedad de nuestra galaxia las deforma."}, {"t": "Galaxias enanas", "x": "Las galaxias enanas son pequeñas y poco luminosas: pueden tener solo unos millones o miles de millones de estrellas, frente a los cientos de miles de millones de la Vía Láctea. Son el tipo de galaxia más abundante.\nNuestra galaxia tiene decenas de satélites enanos. La galaxia enana de Sagitario está siendo desgarrada y absorbida poco a poco por la Vía Láctea, que se queda con sus estrellas."}, {"t": "Galaxias activas", "x": "Una galaxia activa tiene un núcleo que emite muchísima más energía que todas sus estrellas juntas. La causa es un agujero negro supermasivo que está engullendo materia.\nAntes de caer, el gas forma un disco de acreción que gira y se calienta a millones de grados, emitiendo en todo el espectro, de las ondas de radio a los rayos X. La Vía Láctea no es activa ahora: su agujero negro apenas se alimenta."}, {"t": "Cuásares", "x": "Los cuásares son los núcleos activos más luminosos. Parecen estrellas en las fotos, pero están a miles de millones de años luz y brillan como billones de soles.\nEl primero identificado fue 3C 273, en 1963, cuando Maarten Schmidt midió que su luz estaba muy desplazada al rojo: se alejaba a gran velocidad y por tanto estaba lejísimos, a unos 2400 millones de años luz. Brilla unos 4 billones de veces más que el Sol."}, {"t": "Formación estelar galáctica", "x": "El ritmo al que una galaxia fabrica estrellas depende de cuánto gas frío tenga. La Vía Láctea forma, de media, el equivalente a una o dos masas solares de estrellas al año.\nLas galaxias con brotes estelares forman estrellas decenas de veces más deprisa, a menudo tras un encuentro con otra galaxia que comprime su gas. Un ejemplo es M82, a unos 12 millones de años luz, perturbada por su vecina M81."}, {"t": "Evolución de las galaxias", "x": "Las galaxias cambian con el tiempo: crecen absorbiendo gas y galaxias menores, gastan su gas formando estrellas y pueden cambiar de forma al chocar. Dos espirales que se fusionan pueden acabar formando una elíptica.\nComo mirar lejos es ver luz antigua, los telescopios como el James Webb observan galaxias de cuando el universo tenía unos 300 millones de años. Eran más pequeñas e irregulares que las actuales."}]}, {"n": 43, "titulo": "Cúmulos y estructuras cósmicas", "intro": "Las galaxias no están repartidas al azar: se agrupan en grupos, cúmulos y supercúmulos, unidos en una gigantesca red de filamentos y vacíos. Es la estructura más grande del universo y la gravedad la ha ido tejiendo.", "puntos": [{"t": "Grupos de galaxias", "x": "Un grupo de galaxias reúne desde unas pocas hasta unas cincuenta galaxias unidas por la gravedad. El nuestro es el Grupo Local, de unos 10 millones de años luz de diámetro.\nLo dominan dos grandes espirales, la Vía Láctea y Andrómeda, seguidas por la galaxia del Triángulo. El resto son decenas de galaxias enanas, muchas descubiertas en las últimas décadas porque son muy débiles."}, {"t": "Cúmulos de galaxias", "x": "Un cúmulo de galaxias contiene cientos o miles de galaxias en una región de unos pocos millones de años luz. Son las mayores estructuras unidas firmemente por su propia gravedad.\nEl cúmulo de Virgo, a unos 54 millones de años luz, tiene más de mil galaxias. Entre ellas hay gas a decenas de millones de grados, tan caliente que emite rayos X, y que contiene más masa que todas las estrellas del cúmulo."}, {"t": "Supercúmulos", "x": "Los supercúmulos son agrupaciones de grupos y cúmulos de galaxias. No están en equilibrio: son tan grandes que la expansión del universo acabará separando sus partes.\nEn 2014 se definió nuestro supercúmulo, Laniakea, que significa «cielo inmenso» en hawaiano. Mide unos 500 millones de años luz e incluye alrededor de 100 000 galaxias, entre ellas la Vía Láctea y el cúmulo de Virgo."}, {"t": "Filamentos", "x": "Los filamentos son largos hilos de galaxias, gas y materia oscura que unen los cúmulos entre sí. Pueden medir cientos de millones de años luz de longitud.\nPor ellos fluyen gas y galaxias hacia los cúmulos, que están en los nudos donde se cruzan varios filamentos. La Gran Muralla Sloan, descubierta en 2003, es una de estas estructuras alargadas, con unos 1400 millones de años luz de largo."}, {"t": "Vacíos cósmicos", "x": "Entre los filamentos hay enormes regiones casi vacías de galaxias, llamadas vacíos cósmicos. No están totalmente vacíos, pero su densidad es muy inferior a la media.\nOcupan la mayor parte del volumen del universo. Uno de los más conocidos es el vacío de Boötes, de unos 300 millones de años luz de diámetro, donde se conocen solo unas sesenta galaxias, cuando en un volumen así cabría esperar miles."}, {"t": "Red cósmica", "x": "Si juntamos todo, el universo a gran escala parece una esponja o una espuma: filamentos y láminas de galaxias que rodean grandes vacíos, con cúmulos en las intersecciones. A esto se le llama red cósmica.\nLos grandes mapas de galaxias, que miden la posición de millones de ellas, la muestran con claridad, y las simulaciones por ordenador reproducen una red casi idéntica a partir de la gravedad."}, {"t": "Gravedad a gran escala", "x": "A distancias tan enormes solo importa una fuerza: la gravedad. Las fuerzas eléctricas se anulan porque la materia tiene tantas cargas positivas como negativas, y las nucleares solo actúan dentro del núcleo atómico.\nEn el universo joven la materia estaba repartida de forma casi uniforme, con diferencias de densidad de una parte en cien mil. La gravedad amplificó esas diferencias durante miles de millones de años hasta formar la red cósmica."}, {"t": "Colisiones galácticas", "x": "Las galaxias chocan con frecuencia, sobre todo en grupos y cúmulos. Sin embargo, las estrellas casi nunca colisionan, porque la distancia entre ellas es enorme comparada con su tamaño: como dos enjambres de mosquitos que se cruzan.\nLo que sí choca es el gas, que se comprime y forma muchas estrellas nuevas. Las galaxias Antenas, en la constelación del Cuervo, están en plena colisión y lucen largas colas de estrellas."}, {"t": "Fusiones de galaxias", "x": "Cuando dos galaxias chocan despacio, la gravedad puede unirlas en una sola: es una fusión. Si las dos son grandes espirales, el resultado suele ser una galaxia elíptica, y sus agujeros negros centrales acaban también fusionándose.\nAndrómeda se acerca a nosotros a unos 110 km/s. Podría fusionarse con la Vía Láctea dentro de varios miles de millones de años, aunque estudios recientes indican que no es seguro."}, {"t": "Escalas del universo observable", "x": "El universo observable es la región desde la que la luz ha tenido tiempo de llegarnos. Su diámetro es de unos 93 000 millones de años luz y contiene cientos de miles de millones de galaxias.\nPara hacerse una idea: si la Vía Láctea fuera una moneda de 2 cm, Andrómeda estaría a unos 50 cm, el cúmulo de Virgo a unos 10 m y el borde del universo observable a unos 9 km."}]}, {"n": 44, "titulo": "Materia oscura", "intro": "La mayor parte de la materia del universo no emite luz: solo la notamos por su gravedad. Este tema explica qué indicios la revelan, qué podría ser y qué preguntas quedan abiertas sobre ella.", "puntos": [{"t": "Evidencias gravitatorias", "x": "La materia oscura no se ve: se deduce. Al medir cómo se mueven estrellas, gas y galaxias, o cómo se desvía la luz, calculamos cuánta masa debe haber para producir esa gravedad.\nUna y otra vez el resultado es el mismo: hay mucha más masa de la que vemos en estrellas y gas. Según las mediciones actuales, por cada kilogramo de materia normal hay unos cinco de materia oscura."}, {"t": "Curvas de rotación", "x": "En el sistema solar, los planetas lejanos giran más despacio: la Tierra va a 30 km/s y Neptuno a solo 5,4 km/s, porque casi toda la masa está en el Sol. Lo mismo se esperaba en las galaxias.\nEn los años setenta, Vera Rubin midió que las estrellas y el gas de los bordes de las galaxias giran casi tan rápido como los de dentro. La gráfica queda plana: ahí fuera hay masa invisible.", "d": "grafica"}, {"t": "Lentes gravitacionales", "x": "La relatividad general dice que una masa curva el espacio-tiempo y desvía la luz que pasa cerca. Cuanta más masa, mayor es la desviación.\nAl observar galaxias lejanas detrás de un cúmulo, sus imágenes aparecen estiradas en arcos o duplicadas. Midiendo esas deformaciones se puede calcular la masa total del cúmulo, y resulta muchas veces mayor que la de su materia visible. Así se hacen mapas de la materia oscura.", "d": "espaciotiempo"}, {"t": "Movimiento de galaxias", "x": "En 1933 el astrónomo Fritz Zwicky estudió el cúmulo de Coma y vio que sus galaxias se movían a velocidades de unos 1000 km/s. Con la masa visible, la gravedad no bastaba para retenerlas: el cúmulo debería haberse dispersado.\nZwicky dedujo que debía haber mucha materia invisible. Hoy los movimientos de las galaxias en grupos y cúmulos confirman esa conclusión con datos mucho más precisos."}, {"t": "Cúmulos galácticos", "x": "Los cúmulos de galaxias son un laboratorio excelente porque permiten medir su masa de tres formas: por la velocidad de sus galaxias, por la temperatura del gas que emite rayos X y por las lentes gravitacionales. Las tres coinciden en que falta masa.\nEl cúmulo Bala, a unos 3700 millones de años luz, resulta de un choque entre dos cúmulos. El gas quedó frenado en el centro, pero las lentes gravitacionales muestran que la mayor parte de la masa siguió de largo."}, {"t": "Qué significa “oscura”", "x": "«Oscura» no significa negra ni opaca, sino que no emite, absorbe ni refleja luz de ningún tipo: ni visible, ni infrarroja, ni de radio, ni rayos X. Sería más exacto llamarla invisible.\nTampoco tapa nada: la luz de las galaxias lejanas la atraviesa sin problemas. Solo interactúa, que sepamos, mediante la gravedad, y por eso solo la detectamos por cómo atrae a la materia normal y desvía la luz."}, {"t": "Candidatos hipotéticos", "x": "Se proponen varios candidatos, ninguno confirmado. Los más estudiados son partículas aún no descubiertas: los WIMP, partículas masivas que interactuarían muy débilmente, y los axiones, partículas mucho más ligeras.\nPara buscarlas hay grandes detectores bajo tierra con toneladas de xenón líquido, a la espera de un choque raro con un núcleo. Hasta ahora no han detectado nada, lo que descarta muchas versiones de esas hipótesis."}, {"t": "Diferencia entre evidencia y explicación", "x": "Es importante distinguir dos cosas. La evidencia es lo que se observa: estrellas que giran demasiado rápido, galaxias que se mueven demasiado deprisa y luz que se desvía más de lo esperado. Eso está muy bien medido.\nLa explicación es lo que proponemos para entenderlo: la existencia de una materia invisible. Es la explicación más aceptada porque encaja con muchas observaciones distintas, pero mientras no se identifique sigue siendo una explicación, no un hecho directo."}, {"t": "Hipótesis alternativas", "x": "Otra posibilidad es que no falte masa, sino que la gravedad funcione de otra manera a escalas enormes. En 1983 Mordehai Milgrom propuso MOND, una modificación de las leyes de Newton para aceleraciones muy pequeñas.\nMOND explica bien las curvas de rotación de muchas galaxias, pero tiene dificultades con los cúmulos y con la radiación más antigua del universo. Por eso la mayoría de los cosmólogos prefiere la materia oscura, aunque el debate continúa."}, {"t": "Preguntas abiertas", "x": "Sigue sin saberse de qué está hecha la materia oscura, si es una sola partícula o varias, y si interactúa de algún modo además de por la gravedad.\nTambién hay detalles que los modelos no terminan de explicar, como el número de galaxias enanas o cómo se reparte la materia oscura en sus centros. El telescopio espacial Euclid, lanzado en 2023, está cartografiando miles de millones de galaxias para estudiarla mejor."}]}, {"n": 45, "titulo": "El espacio y el tiempo cósmicos", "intro": "El universo es tan grande que necesitamos unidades especiales para medirlo, y tan antiguo que su luz nos llega desde el pasado. Este tema da las herramientas para manejar esas distancias y esos tiempos.", "puntos": [{"t": "Distancias astronómicas", "x": "Las distancias astronómicas abarcan muchísimos órdenes de magnitud. La Luna está a unos 384 400 km; el Sol, a unos 150 millones de km; la estrella más cercana, a unos 40 billones de km.\nCon kilómetros los números se vuelven inmanejables, así que los astrónomos usan unidades más grandes según la escala: la unidad astronómica dentro del sistema solar, y el año luz y el pársec para estrellas y galaxias.", "d": "potencias"}, {"t": "Unidad astronómica", "x": "La unidad astronómica (UA) es la distancia media entre la Tierra y el Sol. Desde 2012 se define como exactamente 149 597 870,7 km, unos 150 millones de km.\nEs la medida natural del sistema solar: Mercurio está a 0,39 UA del Sol, Júpiter a 5,2 UA y Neptuno a unas 30 UA. La sonda Voyager 1, el objeto humano más lejano, se encuentra ya a más de 165 UA."}, {"t": "Año luz", "x": "Un año luz es la distancia que recorre la luz en un año, viajando a casi 300 000 km/s. Equivale a unos 9,46 billones de kilómetros, o a unas 63 000 UA.\nAunque su nombre contenga «año», es una distancia, no un tiempo. Próxima Centauri, la estrella más cercana después del Sol, está a 4,24 años luz, y el centro de la Vía Láctea, a unos 26 000."}, {"t": "Pársec", "x": "El pársec es la unidad preferida por los astrónomos profesionales y equivale a unos 3,26 años luz. Su nombre viene de «paralaje de un segundo de arco».\nAl moverse la Tierra en su órbita, una estrella cercana parece desplazarse un poco sobre el fondo, como un dedo al mirarlo alternando cada ojo. Una estrella está a un pársec si ese desplazamiento, visto con una separación de 1 UA, es de un segundo de arco. Próxima Centauri está a 1,30 pársecs."}, {"t": "Tiempo de viaje de la luz", "x": "La luz es lo más rápido que existe, pero no es instantánea. Tiempo = distancia / velocidad: la luz de la Luna tarda 1,3 segundos en llegarnos; la del Sol, unos 8 minutos y 20 segundos; y la de Neptuno, unas 4 horas.\nLa de Próxima Centauri tarda 4,24 años, y la de la galaxia de Andrómeda, unos 2,5 millones de años. Por eso las sondas lejanas no pueden manejarse en tiempo real."}, {"t": "Mirar lejos es mirar al pasado", "x": "Como la luz tarda en llegar, siempre vemos los objetos tal como eran cuando la emitieron. El Sol que vemos es el de hace 8 minutos, y Andrómeda aparece como era hace 2,5 millones de años, mucho antes de que existiera nuestra especie.\nCuanto más lejos miramos, más antiguo es lo que vemos. Los telescopios son, en cierto modo, máquinas del tiempo que observan el pasado del universo."}, {"t": "Horizonte observable", "x": "El universo tiene una edad de unos 13 800 millones de años, así que la luz solo ha tenido ese tiempo para viajar. Eso marca un límite: el horizonte observable, más allá del cual ninguna luz ha podido alcanzarnos aún.\nSu radio no es de 13 800 millones de años luz, sino de unos 46 000 millones, porque el espacio se ha estirado mientras la luz viajaba, como veremos en el tema siguiente."}, {"t": "Edad de los objetos astronómicos", "x": "Las edades se miden con varios relojes. Los elementos radiactivos de los meteoritos, que se desintegran a un ritmo conocido, indican que el sistema solar se formó hace unos 4567 millones de años.\nLa edad de las estrellas se estima comparando su luminosidad y temperatura con los modelos de evolución estelar. Así, las estrellas de los cúmulos globulares más antiguos tienen entre 12 000 y 13 000 millones de años.", "d": "hr"}, {"t": "Escalas temporales del universo", "x": "Si comprimimos la historia del universo en un solo año, cada día equivale a unos 38 millones de años. El universo comienza el 1 de enero y el Sol no se forma hasta principios de septiembre.\nLos dinosaurios desaparecen el 30 de diciembre. Nuestra especie aparece unos 11 minutos antes de la medianoche del 31 de diciembre, y toda la historia escrita cabe en los últimos 11 segundos."}]}, {"n": 46, "titulo": "Expansión del universo", "intro": "La luz de las galaxias lejanas llega estirada, y eso revela que el universo entero está creciendo. Entender la expansión es la clave para medir distancias cósmicas y reconstruir la historia del universo.", "puntos": [{"t": "Corrimiento al rojo cosmológico", "x": "Cuando la luz de una galaxia lejana llega más estirada, con sus líneas espectrales desplazadas hacia el rojo, decimos que tiene corrimiento al rojo, z. Se calcula como z = (λobs − λem) / λem, donde λ es la longitud de onda observada y la emitida.\nEl cuásar 3C 273 tiene z = 0,158: la línea roja del hidrógeno, emitida a 656 nanómetros, nos llega a unos 760. Casi todas las galaxias muestran este desplazamiento.", "d": "lineas"}, {"t": "Galaxias que se alejan", "x": "Entre 1912 y 1917, Vesto Slipher midió los espectros de unas veinticinco «nebulosas espirales», que hoy sabemos que son galaxias. Casi todas mostraban corrimiento al rojo: se alejaban de nosotros, algunas a más de 1.000 km/s.\nHay excepciones cercanas. Andrómeda, a 2,5 millones de años luz, se acerca al Sol a unos 300 km/s, porque la gravedad de nuestro grupo de galaxias domina sobre la expansión a esa escala."}, {"t": "Espacio que se expande", "x": "La interpretación moderna no es que las galaxias vuelen por un espacio fijo, sino que el propio espacio entre ellas crece. Mientras la luz viaja, su onda se estira junto con el espacio que atraviesa.\nPor eso z mide cuánto ha crecido el universo: 1 + z indica cuántas veces son mayores hoy las distancias. Una galaxia con z = 1 emitió su luz cuando las distancias cósmicas eran la mitad de las actuales.", "d": "expansion"}, {"t": "Ley de Hubble-Lemaître", "x": "En 1927 Georges Lemaître propuso que la velocidad de alejamiento de una galaxia es proporcional a su distancia, y en 1929 Edwin Hubble lo confirmó con datos. Se escribe v = H·d: v es la velocidad, d la distancia y H la constante de Hubble.\nHoy H vale unos 70 kilómetros por segundo por cada megapársec, es decir, por cada 3,26 millones de años luz. Desde 2018 se recomienda llamarla ley de Hubble-Lemaître."}, {"t": "Distancia y velocidad de recesión", "x": "La ley permite convertir velocidades en distancias. El cúmulo de galaxias de Coma se aleja a unos 7.000 km/s; dividiendo por H = 70 obtenemos unos 100 megapársecs, unos 330 millones de años luz.\nA unos 14.000 millones de años luz, la velocidad calculada supera la de la luz. No contradice la relatividad: nada adelanta a la luz en su entorno, simplemente el espacio intermedio crece muy deprisa."}, {"t": "Diferencia entre expansión y movimiento local", "x": "La expansión solo se nota entre objetos que no están unidos por la gravedad. Átomos, personas, la Tierra, el sistema solar y la Vía Láctea no se expanden: sus propias fuerzas los mantienen unidos.\nAdemás, cada galaxia tiene su movimiento local, de cientos de km/s, causado por la atracción de sus vecinas. En galaxias cercanas ese movimiento domina; en las lejanas, el alejamiento por expansión es mucho mayor y lo oculta."}, {"t": "Universo observable", "x": "El universo observable es la región de la que nos ha podido llegar luz desde el comienzo de la expansión, hace unos 13.800 millones de años. Su borde no es un límite físico, sino un horizonte: cada observador tiene el suyo.\nComo el espacio se ha estirado mientras la luz viajaba, los objetos más lejanos que vemos están hoy a unos 46.000 millones de años luz de nosotros."}, {"t": "Limitaciones de la analogía del globo", "x": "Se suele comparar el universo con la superficie de un globo que se infla: los puntos dibujados se separan y ninguno es el centro. La analogía ayuda, pero tiene trampas.\nSolo cuenta la superficie, no el interior ni el aire exterior: el universo no se expande dentro de nada. Además, los puntos pintados crecen con el globo, mientras que las galaxias no; serían más bien monedas pegadas. Y el globo tiene un tamaño finito que el universo quizá no tenga."}]}, {"n": 47, "titulo": "El Big Bang", "intro": "El modelo del Big Bang describe cómo el universo ha evolucionado desde un estado muy caliente y denso hasta el actual. Es el marco en el que encaja casi todo lo que sabemos sobre el origen de la materia, las estrellas y las galaxias.", "puntos": [{"t": "Qué afirma el modelo", "x": "El modelo afirma que el universo observable fue en el pasado mucho más caliente y denso, y que se ha expandido y enfriado desde entonces. Según las mejores medidas, eso ocurrió hace unos 13.800 millones de años.\nDescribe con detalle lo que pasó desde una pequeña fracción de segundo después del inicio en adelante, y sus predicciones se pueden comparar con observaciones actuales."}, {"t": "Qué no afirma el modelo", "x": "El Big Bang no fue una explosión en un punto de un espacio vacío previo: ocurrió en todas partes a la vez, porque era el propio espacio el que empezaba a expandirse. No hay un centro ni un lugar del que salgan las galaxias.\nTampoco explica qué causó el inicio ni si hubo un «antes». El nombre, de hecho, lo acuñó Fred Hoyle en 1949, crítico del modelo, en una emisión de radio."}, {"t": "Estado inicial caliente y denso", "x": "Al principio, la materia y la radiación estaban extraordinariamente apretadas y calientes. Un segundo después del inicio, la temperatura rondaba los 10.000 millones de grados, más de seiscientas veces la del centro del Sol.\nA esas temperaturas no podían existir átomos ni núcleos estables: todo era una sopa de partículas y luz chocando sin parar. La física de laboratorio de altas energías nos permite describir esa sopa con bastante confianza."}, {"t": "Expansión y enfriamiento", "x": "Al expandirse, el universo se enfría, igual que se enfría el gas que sale de un espray. La temperatura de la radiación es inversamente proporcional al tamaño: si las distancias se duplican, la temperatura se reduce a la mitad.\nCuando el universo era unas 1.100 veces más pequeño que hoy, su temperatura era de unos 3.000 grados; hoy esa misma radiación está a solo 2,7 kelvin, cerca del cero absoluto.", "d": "grafica"}, {"t": "Formación de partículas", "x": "En la primera millonésima de segundo existía una sopa de quarks, las partículas que forman protones y neutrones. Hacia las diez millonésimas de segundo, al enfriarse, los quarks se agruparon de tres en tres y formaron protones y neutrones.\nMateria y antimateria se aniquilaron casi por completo, convirtiéndose en luz. Sobró aproximadamente una partícula de materia por cada mil millones de pares: de ese pequeño exceso estamos hechos."}, {"t": "Nucleosíntesis primordial", "x": "Durante los primeros minutos, el universo fue un reactor de fusión. Protones y neutrones se unieron para formar núcleos ligeros, hasta que la expansión enfrió y diluyó demasiado la materia.\nEl resultado fue, en masa, un 75 % de hidrógeno y un 25 % de helio, con trazas de deuterio y litio. Las nubes de gas más antiguas que observamos tienen justo esas proporciones, una gran confirmación del modelo."}, {"t": "Formación de átomos", "x": "Durante unos 380.000 años los electrones siguieron libres, porque el calor impedía que se quedaran unidos a los núcleos. Cuando la temperatura bajó a unos 3.000 grados, los electrones fueron capturados y se formaron los primeros átomos de hidrógeno y helio.\nSin electrones libres que la desviaran, la luz pudo viajar en línea recta: el universo se volvió transparente. Esa luz liberada todavía nos llega hoy.", "d": "atomo"}, {"t": "Primeras estrellas", "x": "Tras formarse los átomos llegó una larga «edad oscura», sin estrellas. La gravedad fue reuniendo el gas en las zonas algo más densas hasta que, entre unos 100 y 200 millones de años después del inicio, se encendieron las primeras estrellas.\nEstaban hechas solo de hidrógeno y helio, y se cree que eran muy masivas y de vida corta. Todavía no se ha observado ninguna de forma directa."}, {"t": "Formación de galaxias", "x": "Las galaxias crecieron de abajo arriba: primero se formaron objetos pequeños, que después se fusionaron en otros cada vez mayores. Nuestra Vía Láctea es el resultado de muchas de esas uniones.\nEl telescopio espacial James Webb ha observado galaxias como JADES-GS-z14-0, cuya luz salió cuando el universo tenía menos de 300 millones de años, y que ya eran más brillantes de lo que muchos modelos esperaban."}, {"t": "Evidencias del modelo", "x": "El modelo se apoya en varias pruebas independientes. La primera es la expansión: las galaxias se alejan según la ley de Hubble-Lemaître. La segunda, el fondo cósmico de microondas, la luz liberada al formarse los átomos, descubierta en 1965.\nLa tercera, las proporciones de hidrógeno, helio y litio, que coinciden con lo calculado. Además, las galaxias lejanas, vistas en el pasado, son más jóvenes y distintas que las cercanas."}]}, {"n": 48, "titulo": "Radiación cósmica de fondo", "intro": "El fondo cósmico de microondas es la luz más antigua que podemos ver, emitida cuando el universo tenía unos 380.000 años. Es una fotografía del universo recién nacido y una de las pruebas más sólidas del Big Bang.", "puntos": [{"t": "Origen de la radiación", "x": "En el universo primitivo, la materia era un gas tan caliente que los electrones iban sueltos, separados de los núcleos. La luz chocaba con ellos continuamente y cambiaba de dirección a cada paso, como los faros de un coche dentro de una niebla espesa.\nEse continuo intercambio de energía hizo que luz y materia tuvieran la misma temperatura, y que la luz adoptara el espectro típico de un cuerpo caliente."}, {"t": "Desacoplamiento de la luz", "x": "Unos 380.000 años después del inicio, con la temperatura en torno a 3.000 grados, los electrones se unieron a los núcleos y formaron átomos neutros. La luz dejó de chocar con ellos: se desacopló de la materia y empezó a viajar libre.\nEs como si la niebla se levantara de repente. La región desde donde nos llegan esos fotones se llama superficie de última dispersión."}, {"t": "Fondo cósmico de microondas", "x": "Aquella luz salió con un brillo de color anaranjado e infrarrojo. Desde entonces, la expansión ha estirado su longitud de onda unas 1.100 veces, hasta llevarla a las microondas, con su máximo en torno a un milímetro.\nArno Penzias y Robert Wilson la descubrieron por casualidad en 1965, como un ruido de antena que llegaba de todas direcciones. Cada centímetro cúbico del espacio contiene hoy unos 400 de esos fotones."}, {"t": "Temperatura actual", "x": "La temperatura actual del fondo de microondas es de 2,725 kelvin, unos 270 grados bajo cero. En 1990, el satélite COBE midió su espectro y comprobó que coincide casi a la perfección con el de un cuerpo negro, el emisor térmico ideal.\nEs el espectro térmico más perfecto que se ha medido en la naturaleza, justo lo que el modelo del Big Bang esperaba de un universo que fue caliente y uniforme.", "d": "grafica"}, {"t": "Pequeñas variaciones de temperatura", "x": "El fondo de microondas es casi idéntico en todas direcciones, pero no del todo. Hay manchas ligeramente más calientes y más frías, con diferencias de una parte en cien mil: unas decenas de millonésimas de grado.\nCOBE las detectó en 1992. Corresponden a zonas del universo primitivo un poco más densas o menos densas que la media, y su tamaño y distribución contienen muchísima información."}, {"t": "Semillas de las estructuras cósmicas", "x": "Las zonas algo más densas atraían más materia por gravedad, y con el tiempo crecieron hasta formar galaxias y cúmulos de galaxias. Las diminutas manchas del fondo son, por tanto, las semillas de toda la estructura actual.\nSe cree que su origen son fluctuaciones cuánticas microscópicas estiradas por la inflación, una expansión muy rápida que habría ocurrido en la primera fracción de segundo. Es una hipótesis bien apoyada, pero no confirmada."}, {"t": "Observación y medición", "x": "El vapor de agua de la atmósfera absorbe parte de las microondas, así que se observa desde el espacio o desde lugares altos y secos, como el desierto de Atacama o el polo sur.\nTres satélites marcaron la historia: COBE, de la NASA, lanzado en 1989; WMAP, en 2001; y Planck, de la Agencia Espacial Europea, que entre 2009 y 2013 cartografió todo el cielo con enorme detalle."}, {"t": "Importancia cosmológica", "x": "Comparando el patrón de manchas con los modelos, los cosmólogos deducen la edad del universo, unos 13.800 millones de años, y su composición. Solo un 5 % es materia ordinaria; un 27 % es materia oscura, y un 68 %, energía oscura, de la que hablaremos en el próximo tema.\nTambién indica que el espacio, a gran escala, es prácticamente plano. Pocas observaciones dan tanta información a la vez."}]}, {"n": 49, "titulo": "Energía oscura", "intro": "Desde 1998 sabemos que la expansión del universo se está acelerando. A la causa desconocida la llamamos energía oscura, y entenderla es uno de los grandes retos de la física actual.", "puntos": [{"t": "Expansión acelerada", "x": "Se esperaba que la gravedad de toda la materia frenara poco a poco la expansión, igual que la gravedad frena una piedra lanzada hacia arriba. En 1998 se descubrió lo contrario: la expansión se está acelerando.\nDurante los primeros miles de millones de años sí se frenaba, pero desde hace unos 5.000 millones de años las galaxias lejanas se separan cada vez más deprisa.", "d": "expansion"}, {"t": "Supernovas lejanas", "x": "La clave fueron las supernovas de tipo Ia: explosiones de enanas blancas que alcanzan casi 1,4 masas solares. Como estallan en condiciones muy parecidas, todas tienen un brillo máximo similar, y pueden brillar más que una galaxia entera.\nAl conocer su brillo real y medir el que nos llega, se calcula su distancia. Dos equipos independientes las estudiaron, y sus líderes recibieron el Nobel de Física en 2011."}, {"t": "Qué se observa", "x": "Los dos equipos midieron el corrimiento al rojo y el brillo de decenas de supernovas lejanas, cuya luz salió hace varios miles de millones de años. Se veían más débiles de lo que esperaban en un universo que se frenara: estaban más lejos de lo previsto.\nDespués, el fondo de microondas y la distribución de las galaxias confirmaron el mismo resultado por caminos independientes."}, {"t": "Qué se infiere", "x": "Si las supernovas están más lejos de lo esperado, la expansión ha tenido que acelerarse. De ahí se infiere que existe algo que actúa como una gravedad repulsiva a gran escala y que supone cerca del 68 % del contenido de energía del universo.\nSu densidad es diminuta: equivale a la masa de unos cuatro átomos de hidrógeno por metro cúbico. Solo se nota porque llena todo el espacio."}, {"t": "Energía oscura como nombre descriptivo", "x": "«Energía oscura» es una etiqueta para un efecto observado cuya causa desconocemos. «Oscura» no significa negra ni peligrosa, sino que no emite ni absorbe luz y que no sabemos qué es.\nConviene recordar la diferencia: la aceleración es una medida; la energía oscura es solo el nombre que damos a lo que la produce. El término lo propuso el cosmólogo Michael Turner en 1998."}, {"t": "Constante cosmológica", "x": "En 1917 Einstein añadió a sus ecuaciones un término, la constante cosmológica Λ (lambda), para conseguir un universo estático. Al descubrirse la expansión lo abandonó, pero hoy ha vuelto como la explicación más sencilla de la aceleración.\nRepresenta una energía propia del espacio vacío, con la misma densidad en todas partes: al crecer el espacio, hay más. El problema es que la teoría cuántica predice un valor enormemente mayor que el observado."}, {"t": "Modelos alternativos", "x": "Otras propuestas suponen que la energía oscura es un campo que cambia con el tiempo, llamado quintaesencia, o que la relatividad general deja de funcionar a escalas cósmicas y hay que modificarla.\nEn 2024 y 2025, el cartografiado de millones de galaxias del proyecto DESI dio indicios de que la energía oscura podría estar debilitándose. No son concluyentes: hacen falta más datos para confirmarlo o descartarlo."}, {"t": "Destino posible del universo", "x": "Si la energía oscura es una constante, la aceleración continuará para siempre. Dentro de unos cien mil millones de años, las galaxias que no estén unidas a la nuestra por la gravedad se habrán alejado tanto que su luz ya no podrá alcanzarnos.\nSi su intensidad creciera, podría llegar a desgarrar la materia; si se debilitara, la expansión podría incluso frenarse. Lo veremos en el próximo tema."}, {"t": "Incertidumbres actuales", "x": "Aún desconocemos qué es la energía oscura. Además, la expansión actual medida con estrellas cercanas da unos 73 km/s por megapársec, mientras que la deducida del fondo de microondas da unos 67. Esta discrepancia, la «tensión de Hubble», sigue sin explicación.\nEl telescopio espacial Euclid, lanzado en 2023, y el observatorio Vera Rubin, en Chile, están recogiendo datos para intentar resolver estas dudas."}]}, {"n": 50, "titulo": "Destino del universo", "intro": "¿Se expandirá el universo para siempre, volverá a contraerse o acabará desgarrado? Este tema muestra qué futuros permiten las leyes conocidas y qué grado de confianza merece cada uno.", "puntos": [{"t": "Expansión eterna", "x": "Con los datos actuales, el escenario más probable es que el universo se expanda para siempre. Las galaxias lejanas se alejarán cada vez más deprisa y desaparecerán de nuestra vista.\nLos miembros del Grupo Local, como la Vía Láctea y Andrómeda, seguirán unidos por la gravedad y probablemente acabarán fusionados en una sola gran galaxia. Un observador futuro allí vería un universo aparentemente vacío a su alrededor."}, {"t": "Muerte térmica", "x": "Toda máquina, estrella o ser vivo funciona gracias a diferencias de temperatura o de energía. La entropía, que mide el desorden, tiende a aumentar, y esas diferencias se van igualando.\nEn un universo que se expande eternamente, la materia acabará dispersa y fría, casi a la misma temperatura en todas partes. Sin diferencias de energía no puede ocurrir ningún proceso: es la muerte térmica, o «gran congelación»."}, {"t": "Big Crunch", "x": "Si la gravedad de la materia fuera suficiente para vencer a la expansión, esta se detendría y el universo empezaría a contraerse. Las galaxias se acercarían, la radiación se calentaría y todo acabaría en un estado caliente y denso, como un Big Bang al revés: el Big Crunch, o «gran implosión».\nFue una posibilidad seria durante décadas, pero la expansión acelerada la hace hoy muy improbable."}, {"t": "Big Rip", "x": "Si la densidad de energía oscura aumentara con el tiempo, la aceleración se haría cada vez más violenta. Primero separaría los cúmulos de galaxias, luego las galaxias, las estrellas, los planetas y finalmente los átomos: el Big Rip, o «gran desgarro».\nEn algunos modelos ocurriría dentro de unas decenas de miles de millones de años. Las observaciones actuales no lo exigen, pero tampoco lo descartan del todo."}, {"t": "Evolución de estrellas y galaxias", "x": "El gas con el que se forman estrellas se está agotando. Hoy nacen en el universo unas diez veces menos estrellas que hace 10.000 millones de años, en su época más activa.\nLas enanas rojas más pequeñas consumen su combustible tan despacio que vivirán unos diez billones de años. Cuando se apaguen las últimas, quedarán solo restos fríos: enanas blancas apagadas, estrellas de neutrones y agujeros negros."}, {"t": "Evaporación de agujeros negros", "x": "En 1974 Stephen Hawking calculó que, por efectos cuánticos, los agujeros negros emiten una débil radiación y pierden masa muy lentamente, hasta evaporarse.\nUn agujero negro de una masa solar está a unas 60 milmillonésimas de grado, más frío que el fondo de microondas, así que hoy absorbe más de lo que emite. Tardaría unos 10^67 años en evaporarse; uno supermasivo, alrededor de 10^100 años."}, {"t": "Escalas temporales extremas", "x": "Para hablar del futuro lejano hacen falta potencias de diez. El universo tiene hoy unos 10^10 años, diez mil millones. Las últimas estrellas se apagarían hacia los 10^14 años, y los agujeros negros más grandes se evaporarían hacia los 10^100.\nCada potencia multiplica por diez la anterior: comparada con 10^100 años, toda la historia del universo hasta hoy es un instante insignificante.", "d": "potencias"}, {"t": "Diferencia entre posibilidad matemática y predicción científica", "x": "Las ecuaciones de la cosmología admiten muchos futuros distintos según los valores que se les den. Que un escenario sea matemáticamente posible no significa que la ciencia lo prediga.\nUna predicción exige suponer que la energía oscura seguirá comportándose como hoy durante billones de años, algo que no podemos comprobar. Por eso hablamos del escenario más probable con los datos actuales, no de un destino seguro."}, {"t": "Preguntas todavía abiertas", "x": "Seguimos sin saber qué es la energía oscura ni si cambia con el tiempo, y de eso depende el final del universo. Tampoco sabemos si el protón es eterno: algunas teorías predicen que se desintegra, pero los experimentos indican que, si lo hace, su vida media supera los 10^34 años.\nLas respuestas vendrán de nuevas observaciones, no de especulaciones, y conviene aceptar que algunas quizá nunca lleguen."}]}, {"n": 51, "titulo": "Observar y medir", "intro": "Todo lo que sabemos del universo procede de observaciones y medidas. Saber cómo se obtienen, y qué limita su calidad, permite valorar cuánto podemos fiarnos de cada dato astronómico.", "puntos": [{"t": "Observación", "x": "Observar en ciencia es mirar de forma sistemática: con un objetivo, registrando lo que se ve y anotando cuándo y cómo. En astronomía es casi la única opción, porque no podemos experimentar con estrellas.\nA finales del siglo XVI, Tycho Brahe midió las posiciones de los planetas durante unos veinte años con una precisión de alrededor de un minuto de arco. Gracias a esos registros, Kepler descubrió que las órbitas son elipses."}, {"t": "Instrumentos", "x": "Los instrumentos amplían nuestros sentidos. Un telescopio funciona como un cubo que recoge luz: cuanto mayor es su espejo, más luz reúne.\nLa pupila humana mide unos 7 milímetros de diámetro; el espejo de un telescopio de 10 metros tiene una superficie unos dos millones de veces mayor. Otros instrumentos separan la luz en colores, cuentan fotones o detectan ondas de radio que el ojo no percibe."}, {"t": "Datos", "x": "Un dato es el resultado registrado de una medida: un número con su unidad, su incertidumbre y la información de cómo se obtuvo. Sin ese contexto, el número sirve de poco.\nLa astronomía actual produce cantidades enormes. El satélite Gaia, de la Agencia Espacial Europea, ha medido posiciones y movimientos de unos 1.800 millones de estrellas, y el observatorio Vera Rubin generará unos 20 terabytes de datos cada noche."}, {"t": "Variables", "x": "Una variable es una magnitud que puede tomar distintos valores, como el brillo de una estrella o su periodo. Al estudiar una relación, se mira cómo cambia una variable cuando cambia otra.\nEn 1912 Henrietta Leavitt descubrió que las estrellas cefeidas, que laten con regularidad, son más luminosas cuanto más largo es su periodo. La estrella Delta Cephei, por ejemplo, completa un ciclo cada 5,4 días.", "d": "grafica"}, {"t": "Medidas directas e indirectas", "x": "Una medida directa compara la magnitud con un patrón, como medir una mesa con una cinta
