métrica. Una indirecta la calcula a partir de otras magnitudes medidas.\nLa distancia a la Luna se obtiene así: se envía un pulso láser a los reflectores que dejaron las misiones Apolo y se mide cuánto tarda en volver, unos 2,5 segundos. Con d = c·t/2, siendo c la velocidad de la luz, resultan unos 384.000 km."}, {"t": "Resolución", "x": "La resolución es el detalle más pequeño que un instrumento puede distinguir; en astronomía, la menor separación angular entre dos puntos. Mejora cuanto mayor es la abertura y menor la longitud de onda.\nEl ojo humano separa detalles de un minuto de arco; el telescopio espacial Hubble, de 2,4 metros, unas mil veces más finos. En 2019, una red de radiotelescopios del tamaño de la Tierra fotografió la sombra del agujero negro de la galaxia M87."}, {"t": "Sensibilidad", "x": "La sensibilidad es la señal más débil que un instrumento puede detectar. Depende de cuánta luz recoge, de la eficiencia de su detector y del tiempo de exposición.\nEn las imágenes más profundas del Hubble aparecen galaxias unos 4.000 millones de veces más débiles que las estrellas más tenues visibles a simple vista. El telescopio James Webb, con un espejo de 6,5 metros, llega todavía más lejos en el infrarrojo."}, {"t": "Precisión y exactitud", "x": "Precisión y exactitud no son lo mismo. Una medida es precisa si al repetirla sale casi igual; es exacta si se acerca al valor verdadero.\nPiensa en unos dardos: si todos caen juntos pero lejos del centro, el lanzador es preciso pero no exacto. Una báscula que marca 70,1, 70,1 y 70,2 kg para alguien que pesa 72 kg es precisa, pero inexacta: tiene un error que hay que corregir."}, {"t": "Calibración", "x": "Calibrar es comparar un instrumento con una referencia conocida para corregir sus desviaciones. Los astrónomos observan estrellas patrón de brillo bien conocido para calibrar sus cámaras.\nUn caso famoso: en 1990, el espejo del Hubble resultó estar pulido con gran precisión, pero con una forma errónea, 2,2 micrómetros demasiado plano en el borde. El instrumento usado para comprobarlo estaba mal montado. Se corrigió con unas ópticas añadidas en 1993."}, {"t": "Ruido experimental", "x": "El ruido son variaciones al azar que se suman a la señal y la enmascaran, como el chisporroteo de una radio mal sintonizada. Lo que importa es la relación entre señal y ruido.\nAl sumar muchas exposiciones, la señal crece más deprisa que el ruido: con 100 imágenes, la relación mejora unas diez veces. El Campo Ultraprofundo del Hubble combinó unas 800 exposiciones, equivalentes a más de once días de observación."}]}, {"n": 52, "titulo": "Modelos científicos", "intro": "La ciencia no solo acumula datos: construye modelos que los explican y predicen lo que aún no se ha visto. Saber qué es un modelo y cuáles son sus límites ayuda a entender por qué la ciencia cambia y por qué, aun así, es fiable.", "puntos": [{"t": "Hipótesis", "x": "Una hipótesis es una explicación provisional que se puede poner a prueba. No es una ocurrencia: debe apoyarse en lo que ya se sabe y permitir deducir consecuencias comprobables.\nLa órbita de Urano se desviaba de lo calculado. Urbain Le Verrier supuso que la causaba un planeta desconocido, calculó dónde debía estar y, el 23 de septiembre de 1846, Johann Galle encontró Neptuno a apenas un grado del lugar predicho."}, {"t": "Modelo", "x": "Un modelo es una representación simplificada de la realidad que conserva lo esencial para un propósito. Puede ser una maqueta, un dibujo o un conjunto de ecuaciones.\nEl modelo estándar del Sol lo trata como una esfera de gas en equilibrio entre la gravedad y la presión, con fusión nuclear en el centro. Con él se calcula que su núcleo está a unos 15 millones de grados, un lugar que nadie puede visitar."}, {"t": "Ley científica", "x": "Una ley científica describe una regularidad de la naturaleza que se cumple siempre en ciertas condiciones, a menudo con una relación matemática. Dice qué ocurre, no necesariamente por qué.\nLa tercera ley de Kepler dice que T² = a³ para los planetas, si T se mide en años y a, el tamaño de la órbita, en unidades astronómicas. Marte, con a = 1,52, tarda 1,88 años en dar la vuelta al Sol.", "d": "orbita"}, {"t": "Teoría científica", "x": "Una teoría científica es un marco amplio que explica muchos hechos y leyes con unos pocos principios, y que ha superado numerosas pruebas. No es una simple suposición, como en el lenguaje cotidiano.\nLa relatividad general de Einstein explica la gravedad como curvatura del espacio-tiempo. Explicó por qué el punto más cercano de la órbita de Mercurio avanza 43 segundos de arco por siglo, algo que Newton no podía explicar."}, {"t": "Predicción", "x": "Una predicción es una consecuencia que el modelo anticipa antes de observarla. Es la prueba más exigente, porque puede salir mal.\nEinstein predijo que la luz de una estrella que roza el Sol se desvía 1,75 segundos de arco, el doble de lo esperado con la física de Newton. Durante el eclipse total del 29 de mayo de 1919, la expedición de Arthur Eddington midió una desviación compatible con esa predicción."}, {"t": "Simulación", "x": "Una simulación es un modelo resuelto por ordenador paso a paso, cuando las ecuaciones son demasiado complicadas para resolverlas a mano. Así funcionan las previsiones meteorológicas.\nEn 2005, la simulación Millennium siguió unos 10.000 millones de partículas de materia oscura desde el universo joven hasta hoy. El resultado fue una red de filamentos y cúmulos muy parecida a la que observan los catálogos de galaxias reales."}, {"t": "Aproximación", "x": "Aproximar es despreciar efectos pequeños para que un problema sea manejable. Para calcular la órbita de la Luna se puede tratar la Tierra como un punto con toda su masa, y para navegar por el sistema solar basta casi siempre con la gravedad de Newton.\nPero hay que saber cuándo deja de valer: los relojes de los satélites GPS adelantan unos 38 microsegundos al día por efectos relativistas, y si no se corrigiera, el GPS fallaría."}, {"t": "Límites de un modelo", "x": "Todo modelo tiene un dominio de validez: funciona bien en unas condiciones y falla fuera de ellas. Usarlo fuera de ese dominio lleva a conclusiones erróneas.\nLa mecánica de Newton es excelente para lanzar sondas a Marte, pero falla a velocidades cercanas a la de la luz o cerca de objetos muy compactos, como los agujeros negros. Allí hacen falta la relatividad especial y la general."}, {"t": "Comparación entre modelos", "x": "Cuando dos modelos compiten, se comparan sus predicciones con las observaciones. Durante siglos, el modelo de Ptolomeo, con la Tierra en el centro, y el de Copérnico, con el Sol, predecían posiciones de los planetas con precisión parecida.\nEn 1610 Galileo observó que Venus presenta fases completas, como la Luna, algo imposible en el modelo de Ptolomeo y natural en el de Copérnico. La observación decidió.", "d": "sistema"}, {"t": "Cambio de modelos científicos", "x": "Los modelos cambian cuando aparecen datos que no pueden explicar. Un nuevo modelo debe explicar todo lo que explicaba el anterior y además lo que este no lograba.\nEn los años cincuenta competían el Big Bang y el modelo del estado estacionario, que proponía un universo sin principio. El descubrimiento del fondo cósmico de microondas en 1965, previsto solo por el primero, inclinó la balanza de forma decisiva."}]}, {"n": 53, "titulo": "Incertidumbre y errores", "intro": "Ninguna medida es perfecta. Saber estimar cuánto puede equivocarse un resultado es lo que permite decidir si dos medidas coinciden o si un descubrimiento es real.", "puntos": [{"t": "Error aleatorio", "x": "El error aleatorio hace que medidas repetidas salgan unas veces algo por encima y otras algo por debajo del valor verdadero, sin un patrón previsible.\nSi cronometras a mano la caída de una pelota, tu tiempo de reacción, de unas dos décimas de segundo, varía de un intento a otro. Los astrónomos lo sufren con la turbulencia del aire, que hace temblar las imágenes de las estrellas."}, {"t": "Error sistemático", "x": "El error sistemático desplaza todas las medidas en el mismo sentido, por un fallo del instrumento o del método. Repetir no lo revela, y por eso es más peligroso.\nUn reloj que adelanta cinco minutos se equivoca siempre igual. En 1929, Hubble obtuvo para su constante unos 500 km/s por megapársec, unas siete veces el valor actual, porque la calibración de distancias que usaba tenía errores sistemáticos."}, {"t": "Incertidumbre", "x": "La incertidumbre es el margen dentro del cual es razonable que esté el valor verdadero. Se escribe con el signo ±: el resultado y, a continuación, su margen.\nLa edad del universo deducida de los datos del satélite Planck es de 13.787 ± 20 millones de años, es decir, casi con seguridad entre 13.767 y 13.807 millones. Un número sin incertidumbre no dice cuánto podemos fiarnos de él."}, {"t": "Cifras significativas", "x": "Las cifras significativas son las que aportan información real sobre una medida. Escribir 1,50 metros indica que se ha medido hasta el centímetro; 1,5 metros, solo hasta el decímetro.\nNo tiene sentido dar más cifras de las que permite la medida: la distancia media a la Luna es de unos 384.400 km, no de 384.399,7. En cambio, la velocidad de la luz vale exactamente 299.792.458 m/s, porque desde 1983 se usa para definir el metro."}, {"t": "Barras de error", "x": "En las gráficas, la incertidumbre se dibuja con barras de error: líneas que salen de cada punto y muestran el intervalo probable del valor verdadero.\nSi las barras de dos medidas se solapan, pueden coincidir; si quedan muy separadas, algo no cuadra. La constante de Hubble medida con estrellas cercanas, 73,0 ± 1,0, y la deducida del fondo de microondas, 67,4 ± 0,5, tienen barras claramente separadas.", "d": "grafica"}, {"t": "Repetición de medidas", "x": "Repetir una medida sirve para ver cuánto varía y estimar así el error aleatorio. Si diez cronometrajes de la oscilación de un péndulo dan entre 1,98 y 2,04 segundos, ya sabemos que cada medida suelta tiene una incertidumbre de unas centésimas.\nTambién conviene repetir con otro instrumento u otro método: si el resultado cambia, quizá haya un error sistemático escondido."}, {"t": "Promedios", "x": "El promedio de muchas medidas es más fiable que cualquiera de ellas, porque los errores aleatorios por exceso y por defecto tienden a compensarse.\nLa incertidumbre del promedio disminuye con la raíz cuadrada del número de medidas: con 100 medidas es unas diez veces menor que la de una sola. Pero promediar no elimina un error sistemático: cien medidas con un reloj que adelanta siguen adelantando."}, {"t": "Resultados compatibles", "x": "Dos resultados son compatibles cuando su diferencia es menor que sus incertidumbres combinadas. No hace falta que coincidan exactamente.\nSi un grupo mide la aceleración de la gravedad y obtiene 9,79 ± 0,02 m/s², y otro obtiene 9,81 ± 0,01 m/s², la diferencia, 0,02, cabe dentro de los márgenes: los resultados son compatibles. Si la diferencia fuera de 0,20, alguno estaría equivocado."}, {"t": "Significación estadística", "x": "La significación estadística indica lo improbable que sería un resultado si solo fuera fruto del azar. Se expresa en «sigmas»: cuantas más, más difícil es que sea casualidad.\nEn física de partículas y en astrofísica se exige normalmente cinco sigmas para anunciar un descubrimiento, lo que equivale a menos de una posibilidad entre tres millones de que sea una fluctuación casual. Así se anunciaron el bosón de Higgs y las ondas gravitacionales."}, {"t": "Interpretación prudente de los datos", "x": "Incluso un resultado estadísticamente significativo puede estar equivocado si hay un efecto que no se ha tenido en cuenta.\nEn 2014, el experimento BICEP2, en el polo sur, anunció haber detectado en el fondo de microondas la huella de la inflación del universo primitivo. Al año siguiente, el análisis conjunto con los datos de Planck mostró que la señal podía explicarse por el polvo de nuestra propia galaxia."}]}, {"n": 54, "titulo": "Evidencia y razonamiento", "intro": "La ciencia se distingue por cómo razona a partir de las pruebas. Este tema explica las herramientas para separar lo que sabemos de lo que suponemos, algo esencial ante cualquier noticia sobre el universo.", "puntos": [{"t": "Correlación y causalidad", "x": "Que dos cosas varíen juntas no implica que una cause la otra. Las ventas de helados y los ahogamientos aumentan a la vez, pero los helados no provocan ahogamientos: ambos crecen en verano, cuando hace calor y más gente se baña.\nPara afirmar una causa hace falta un mecanismo que la explique y descartar otros factores comunes. Una correlación es una pista, no una conclusión."}, {"t": "Inferencia", "x": "Inferir es llegar a una conclusión a partir de pruebas y de leyes conocidas, sin observar el hecho directamente.\nEn 1995, Michel Mayor y Didier Queloz vieron que la estrella 51 Pegasi se acercaba y alejaba de nosotros con un ciclo de 4,2 días. No vieron ningún planeta, pero dedujeron que un compañero con una masa mínima de casi la mitad de la de Júpiter tiraba de ella: fue el primer exoplaneta hallado junto a una estrella como el Sol."}, {"t": "Evidencia directa e indirecta", "x": "La evidencia directa procede de observar o tocar el objeto de estudio; la indirecta, de sus efectos sobre otras cosas. Las dos son válidas si el razonamiento que las une es sólido.\nLas misiones Apolo trajeron 382 kg de rocas lunares que se analizan en laboratorio: evidencia directa. La composición de una estrella lejana se deduce de las líneas de su espectro: evidencia indirecta, pero igual de fiable."}, {"t": "Explicaciones alternativas", "x": "Antes de aceptar una explicación hay que considerar todas las alternativas que también encajen con los datos, y buscar pruebas que las distingan.\nEn 1967, Jocelyn Bell detectó una señal de radio que se repetía cada 1,34 segundos con regularidad de reloj. Medio en broma, la apodaron LGM-1, «hombrecillos verdes». Al aparecer otras fuentes parecidas, se impuso una explicación natural: una estrella de neutrones en rápida rotación, un púlsar."}, {"t": "Falsabilidad", "x": "Una afirmación científica debe ser falsable: tiene que ser posible imaginar una observación que la refute. Lo propuso el filósofo Karl Popper.\nEl modelo del Big Bang predecía que el fondo de microondas debía tener el espectro de un cuerpo negro; si COBE hubiera medido otro espectro, el modelo habría quedado en serios apuros. En cambio, «un ser invisible e indetectable mueve los planetas» no puede refutarse, y por eso no es ciencia."}, {"t": "Reproducibilidad", "x": "Un resultado es reproducible si otros grupos, con sus propios instrumentos, obtienen lo mismo. Así se descartan errores y casualidades.\nEn 1989, dos químicos anunciaron la «fusión fría»: fusión nuclear a temperatura ambiente en un tubo de laboratorio. Laboratorios de todo el mundo intentaron repetirlo y no lo lograron. En cambio, la expansión acelerada fue hallada en 1998 por dos equipos independientes que competían entre sí."}, {"t": "Consenso científico", "x": "El consenso científico no es una votación ni una cuestión de autoridad: surge cuando muchas pruebas independientes apuntan a la misma conclusión.\nLa edad del universo deducida del fondo de microondas, unos 13.800 millones de años, encaja con la de las estrellas más viejas de la Vía Láctea, de unos 12.000 a 13.000 millones. Métodos distintos, con errores distintos, cuentan la misma historia; por eso confiamos en ella."}, {"t": "Anomalías", "x": "Una anomalía es un dato que no encaja con el modelo aceptado. Puede ser un error o el anuncio de una física nueva, y hay que investigar cuál.\nEl exceso de 43 segundos de arco por siglo en la órbita de Mercurio condujo a la relatividad general. En cambio, en 2011 el experimento OPERA midió neutrinos aparentemente más rápidos que la luz; la causa resultó ser un cable de fibra óptica mal conectado."}, {"t": "Sesgos de confirmación", "x": "El sesgo de confirmación es la tendencia a fijarse en lo que apoya nuestras ideas y pasar por alto lo que las contradice. Afecta a todos, también a los científicos.\nA finales del siglo XIX, Percival Lowell dibujó una red de canales en Marte que atribuyó a una civilización; las sondas mostraron que no existían. Hoy se usan análisis «a ciegas», en los que los investigadores no saben qué resultado favorece su hipótesis."}, {"t": "Diferencia entre hecho, hipótesis y especulación", "x": "Un hecho es algo comprobado muchas veces de forma independiente, como que la Tierra gira alrededor del Sol. Una hipótesis es una explicación que aún se está poniendo a prueba.\nQue el océano bajo el hielo de Europa, luna de Júpiter, pueda albergar vida es una hipótesis: la sonda Europa Clipper llegará en 2030 para estudiarlo. Una especulación, como la existencia de otros universos, es una idea que hoy no se puede comprobar."}]}, {"n": 55, "titulo": "Resolver un problema científico", "intro": "Este tema reúne todo lo aprendido en un método práctico, siguiendo un ejemplo real: medir la masa de Júpiter observando una de sus lunas. Es la forma en que la astrofísica convierte preguntas en conocimiento.", "puntos": [{"t": "Formular una pregunta", "x": "Todo empieza con una pregunta concreta que se pueda responder con observaciones. «¿Cómo es Júpiter?» es demasiado vaga; «¿cuál es la masa de Júpiter?» es precisa y medible.\nUna buena pregunta indica qué hay que medir y cuándo sabremos que tenemos la respuesta. Nadie puede pesar un planeta en una báscula, pero sus lunas giran a su alrededor, y su movimiento depende de esa masa."}, {"t": "Identificar las variables", "x": "Hay que decidir qué magnitudes intervienen y cuáles se van a medir. En una órbita, las variables clave son el periodo, T, el tiempo que tarda la luna en dar una vuelta, y el radio de la órbita, a, su distancia media al planeta.\nTambién conviene identificar lo que puede estorbar: la luna puede quedar oculta tras Júpiter o en su sombra, y la turbulencia del aire hace temblar la imagen.", "d": "orbita"}, {"t": "Proponer hipótesis", "x": "La hipótesis propone una relación comprobable. Aquí: las lunas de Júpiter obedecen la gravitación de Newton, igual que los planetas alrededor del Sol.\nSi es así, la masa del planeta se obtiene con M = 4·π²·a³ / (G·T²), donde G es la constante de la gravitación universal. Además, la hipótesis hace una predicción: todas las lunas, grandes o pequeñas, deben dar el mismo valor de M."}, {"t": "Diseñar una prueba", "x": "Diseñar la prueba es planear cómo obtener datos fiables. Con un telescopio pequeño se puede fotografiar Júpiter cada noche despejada durante varias semanas y medir la separación entre el planeta e Ío, su luna más cercana de las cuatro grandes.\nLa separación aparente se convierte en kilómetros conociendo la distancia a Júpiter. Conviene observar a distintas horas y comparar con otras lunas para descubrir errores sistemáticos."}, {"t": "Recoger datos", "x": "Los datos se registran con su fecha, hora, instrumento y condiciones. Midiendo la máxima separación de Ío y el tiempo entre dos máximos, se obtienen sus valores: Ío tarda 1,77 días en completar una órbita, a unos 422.000 km de Júpiter.\nNo basta una sola noche: cuantas más observaciones, menor es el error aleatorio y mejor se detectan las medidas defectuosas."}, {"t": "Comparar resultados", "x": "Al introducir los datos de Ío en la fórmula se obtienen unos 1,9 × 10^27 kg, alrededor de 318 veces la masa de la Tierra. Con Europa, Ganímedes y Calisto, cuyas órbitas son mayores y más lentas, el resultado coincide dentro de las incertidumbres.\nLa predicción se cumple. Además, el valor concuerda con el que obtuvieron las sondas que pasaron cerca de Júpiter, medido por un método independiente."}, {"t": "Revisar el modelo", "x": "Si los resultados no hubieran coincidido, habría que revisar el modelo o el método: quizá una medida mal calibrada, o un efecto olvidado. Revisar no es fracasar; es la forma en que la ciencia avanza.\nPor ejemplo, el modelo simple supone órbitas perfectamente circulares y desprecia la masa de las lunas. Para Ío esa aproximación es excelente, pero para trabajos de alta precisión hay que incluir esos detalles."}, {"t": "Comunicar conclusiones", "x": "Un resultado solo forma parte de la ciencia cuando se comunica de forma que otros puedan comprobarlo: qué se midió, cómo, con qué incertidumbre y qué se concluye.\nLo correcto sería escribir algo así: «La masa de Júpiter es de (1,90 ± 0,05) × 10^27 kg», y explicar el método. Las revistas científicas someten los trabajos a la revisión de otros expertos antes de publicarlos."}, {"t": "Reconocer los límites de la conclusión", "x": "Toda conclusión tiene límites. Nuestra medida da la masa total de Júpiter, pero no dice nada de cómo se reparte en su interior, ni de qué está hecho.\nAdemás, depende de suponer que la gravitación de Newton es válida, algo bien comprobado a estas escalas. Reconocer qué no responde un resultado es tan importante como lo que sí responde, y suele abrir la siguiente pregunta."}, {"t": "Aplicar conocimientos de varios campos", "x": "Los problemas reales mezclan disciplinas. La masa de Júpiter combinada con su tamaño da su densidad, unas 1,3 veces la del agua, lo que indica que está formado sobre todo por hidrógeno y helio: física y química juntas.\nDel mismo modo, la edad del sistema solar, 4.567 millones de años, se obtiene combinando física nuclear y geología, al medir la radiactividad de los meteoritos más antiguos."}]}];

class Pix {
    constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
    set(x, y, c) { x |= 0; y |= 0; if (c && x >= 0 && y >= 0 && x < this.w && y < this.h)
        this.d[y * this.w + x] = c; return this; }
    get(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h ? this.d[y * this.w + x] : null; }
    rect(x, y, w, h, c) { for (let j = 0; j < h; j++)
        for (let i = 0; i < w; i++)
            this.set(x + i, y + j, typeof c === 'function' ? c(x + i, y + j, i, j) : c); return this; }
    ell(cx, cy, rx, ry, c) {
        for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
            for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
                const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
                if (dx * dx + dy * dy <= 1)
                    this.set(x, y, typeof c === 'function' ? c(x, y, dx, dy) : c);
            }
        return this;
    }
    line(x0, y0, x1, y1, c) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); for (let i = 0; i <= n; i++)
        this.set(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), c); return this; }
    put(x, y, rows, flip) {
        rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) {
            const ch = r[i];
            if (ch !== '.' && ch !== ' ')
                this.set(flip ? x + r.length - 1 - i : x + i, y + j, ch);
        } });
        return this;
    }
    blit(x, y, p, flip) { for (let j = 0; j < p.h; j++)
        for (let i = 0; i < p.w; i++) {
            const c = p.d[j * p.w + i];
            if (c)
                this.set(flip ? x + p.w - 1 - i : x + i, y + j, c);
        } return this; }
    outline(c = 'k', diag) {
        const src = this.d.slice(), W = this.w, H = this.h, at = (x, y) => (x >= 0 && y >= 0 && x < W && y < H ? src[y * W + x] : null);
        for (let y = 0; y < H; y++)
            for (let x = 0; x < W; x++) {
                if (at(x, y))
                    continue;
                if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1) || (diag && (at(x - 1, y - 1) || at(x + 1, y - 1) || at(x - 1, y + 1) || at(x + 1, y + 1))))
                    this.d[y * W + x] = c;
            }
        return this;
    }
    flip() { const p = new Pix(this.w, this.h); return p.blit(0, 0, this, true); }
}
const spr = (rows, ol = 'k') => { const w = Math.max(...rows.map(r => r.length)); const p = new Pix(w + 2, rows.length + 2).put(1, 1, rows); return ol ? p.outline(ol) : p; };

async function cortarManzana() {
    if (G.pantalla !== 'abdera') { await di('alberto', 'Aquí no es el momento de cortar nada.'); return; }
    const n = G.flags.cortes || 0;
    if (n >= 6) { await di('alberto', 'Ya no se puede cortar más.'); return; }
    sonido('click');
    G.flags.cortes = n + 1;
    await di('alberto', TAMANOS[n]);
    if (n + 1 === 6) { G.flags.atomo = true; guardar(); await di('democrito', '¿Lo ves? Llega un punto en que ya no se puede partir. Ven, cuéntamelo.'); }
    else if (n === 0) await di('alberto', 'Puedo seguir cortando.');
    guardar();
}

}
async function dialogo(quien, opciones) {
    for (;;) {
        const vis = opciones.filter(o => !o.si || o.si());
        const i = await elegir(vis.map(o => o.t));
        const o = vis[i];
        await di('alberto', o.t);
        if (o.f) { const r = await o.f(); if (r === 'fin') return; }
        if (o.fin) return;
    }
}

const ELEMENTOS = [['C', 'Carbono'], ['H', 'Hidrógeno'], ['O', 'Oxígeno'], ['N', 'Nitrógeno'], ['Au', 'Oro'], ['He', 'Helio']];
async function alacena() {
    if (!G.flags.vistaTarta) { await di('alberto', 'Antes quiero saber de qué está hecha la tarta. De cerca.'); return; }
    if (G.notas.includes('elementos')) { await di('alberto', 'La tarta ya está hecha desde cero. Más o menos.'); return; }
    G.flags.molde = G.flags.molde || [];
    for (;;) {
        const libres = ELEMENTOS.filter(e => !G.flags.molde.includes(e[0]));
        const i = await elegir(libres.map(e => `${e[1]} (${e[0]})`).concat(['Ya está']));
        if (i === libres.length) break;
        const [s] = libres[i];
        if (s === 'Au') await di('alberto', '¿Oro en la tarta? Ojalá, pero no.');
        else if (s === 'He') await di('alberto', 'El helio no se une a nada: es un gas noble. En la tarta no hay.');
        else { G.flags.molde.push(s); sonido('coger'); guardar(); await di('alberto', 'Al molde.'); }
    }
    const ok = ['C', 'H', 'O', 'N'].every(s => G.flags.molde.includes(s));
    if (!ok) {
        const falta = !G.flags.molde.includes('N') ? 'Las proteínas del huevo llevaban un elemento más: el azul.' : 'Aún falta alguno de los que vi con la lupa.';
        await di('sagan', falta);
        return;
    }
    sonido('bien');
    await di('sagan', ['Carbono, hidrógeno, oxígeno y nitrógeno.', 'Con solo cuatro elementos se hace casi toda la tarta… y casi todo tu cuerpo.']);
    apuntar('elementos');

function contorno(L, c = '#1f1726') {

}

}
function icoCuaderno() {
    return dib(16, 14, L => { L.rect(2, 1, 11, 12, '#7a5132'); L.rect(3, 2, 9, 10, '#e9dcc0'); for (let y = 4; y < 11; y += 2) L.rect(5, y, 6, 1, '#9a8a70'); L.rect(2, 1, 1, 12, '#4a3020'); });
}

function icoInstituto() {
    return dib(16, 14, L => { L.poly([[8, 1], [15, 5], [8, 9], [1, 5]], '#2a2733'); L.poly([[8, 2], [13, 5], [8, 8], [3, 5]], '#3a3644'); L.rect(4, 7, 8, 4, '#2a2733'); L.rect(13, 5, 1, 6, '#f4e48a'); L.rect(12, 11, 3, 2, '#f4e48a'); });
}function icoMusica(on) {
    return dib(16, 14, L => {
        const c = on ? '#f4e7a0' : '#6a6088';
        L.rect(4, 9, 4, 3, c); L.rect(11, 8, 4, 3, c);
        L.rect(7, 2, 1, 8, c); L.rect(14, 1, 1, 8, c);
        L.rect(7, 1, 8, 2, c);
        if (!on) L.line(1, 13, 15, 0, '#e0502c');
    }, false);
}
function icoClave() {
    return dib(16, 14, L => {
        L.ell(4.5, 7, 3.5, 3.5, '#f4e7a0'); L.ell(4.5, 7, 1.4, 1.4, '#1b1530');
        L.rect(7, 6, 8, 2, '#f4e7a0'); L.rect(12, 8, 1, 3, '#f4e7a0'); L.rect(14, 8, 1, 2, '#f4e7a0');
    }, false);
}
function albertoJoven() {
    const p = new Pix(22, 42);
    const head = A_HEAD_FRONT.map(r => r.replace(/[gG]/g, c => c === 'g' ? 'P' : 'p').replace(/n/g, 'p'));
    const body = sub(A_BODY_FRONT, { q: 'α', Q: 'β', I: 'γ' });
    p.put(2, 17, body);
    p.put(8, 20, ['L....L', 'LL..LL', 'LzzzzL', 'LXzzXL', 'LzwwzL', '.LLLL.']);
    p.put(3, 0, head);
    return spriteCanvas(p.outline('k'), CM, false);
}
function fotoFondo(src) {
    const c = document.createElement('canvas'); c.width = W; c.height = SH;
    const im = new Image(); im.onload = () => c.getContext('2d').drawImage(im, 0, 0, W, SH); im.src = src;
    return c;
}
function cargarArte() {
    SPR.alberto = personaje(ALBERTO);
    for (const id in FIGURAS) SPR[id] = personaje(FIGURAS[id]);
    SPR.albSentado = albertoSentado(false);
    SPR.albDormido = albertoSentado(true);
    SPR.poang = poang();
    SPR.libroAbierto = libroAbierto();
    SPR.lampara = lampara(true); SPR.lamparaOff = lampara(false);
    SPR.naveVentana = nave(9, '#d8dcf0', '#ffffff');
    SPR.nave = nave(15, '#d8dcf0', '#ffffff');
    SPR.tarta = tarta(); SPR.molde = molde(); SPR.frasco = frasco();
    SPR.velaPeq = vela(true); SPR.velaApagada = vela(false);
    SPR.tubo = tubo(); SPR.imanPeq = imanPeq(false); SPR.imanPeqG = imanPeq(true);
    SPR.pantallaZn = pantallaZn();
    SPR.icoCuaderno = icoCuaderno();
    SPR.icoInstituto = icoInstituto();
    SPR.icoMusica = icoMusica(true); SPR.icoMusicaOff = icoMusica(false); SPR.icoClave = icoClave();
    SPR.albertoJoven = albertoJoven();
    SPR.pizarra = pizarraFondo();
    for (const id in ICONOS) SPR['ico_' + id] = icono(ICONOS[id]);
    FONDOS = { despacho: pintarDespacho(), casa: pintarCasa(), abdera: pintarAbdera(), cocina: pintarCocina(), lavoisier: pintarLavoisier(), thomson: pintarThomson(), rutherford: pintarRutherford(), aula: pintarInstituto(), instituto: fotoFondo(IMG_INSTITUTO) };
}

let TITULO = true, guardada = null;
const BOTONES = { empezar: [26, SH + 4, 140, 23], continuar: [26, SH + 30, 140, 23], clave: [26, SH + 56, 140, 23], instituto: [26, SH + 82, 140, 23], musica: [W - 23, 3, 20, 18] };
function contar() { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: 'jugar/cosmos', title: 'Jugar Alberto y el Cosmos', event: true }); } catch (e) { } }
function dibujarTitulo() {
    CX.imageSmoothingEnabled = false;
    CX.fillStyle = '#05040a'; CX.fillRect(0, 0, W, H);
    CX.drawImage(FONDOS.casa, 0, 0);
    CX.drawImage(SPR.nave, 146, 66);
    CX.fillStyle = '#05040a'; CX.fillRect(0, SH, W, H - SH);
    TG.clearRect(0, 0, TX.width, TX.height);
    textoGrande('Alberto', W / 2, 14, '#f2c98a', { al: 'center', t: 20, negrita: true });
    textoGrande('y el Cosmos', W / 2, 36, '#f2c98a', { al: 'center', t: 16, negrita: true });
    const bot = (r, txt) => { caja(r, '#2e2640', '#05040a', '#4a3f66'); textoGrande(txt, r[0] + r[2] / 2, r[1] + 6, '#f4e7a0', { al: 'center', t: 11, negrita: true, borde: false }); };
    const lista = guardada ? [[BOTONES.continuar, 'Continuar'], [BOTONES.empezar, 'Empezar de nuevo']] : [[BOTONES.empezar, 'Empezar']];
    lista.forEach(([r, t], i) => { r[1] = SH + 4 + i * 26; bot(r, t); });
    BOTONES.clave[1] = SH + 4 + lista.length * 26; bot(BOTONES.clave, 'Tengo una clave');
    BOTONES.instituto[1] = SH + 4 + (lista.length + 1) * 26; bot(BOTONES.instituto, 'Ir al instituto');
    caja(BOTONES.musica, '#1b1530', '#05040a', '#3d3360'); CX.drawImage(musicaOn ? SPR.icoMusica : SPR.icoMusicaOff, BOTONES.musica[0] + 2, BOTONES.musica[1] + 2);
    textoGrande('Un viaje de lo más pequeño a lo más grande', W / 2, 58, '#cfd6f0', { al: 'center', t: 8 });
}
async function empezar(seguir) {
    TITULO = false; G.desdeTitulo = false;
    contar();
    if (seguir && guardada) {
        G.inv = guardada.inv || []; G.flags = guardada.flags || {}; G.notas = guardada.notas || [];
        await ir(guardada.pantalla, seguir === 'clave' ? ['Clave aceptada', '«' + CLAVES[guardada.pantalla] + '»'] : null);
        return;
    }
    G.inv = []; G.flags = {}; G.notas = [];
    await ir('despacho', ['Alberto y el Cosmos', 'Una noche cualquiera']);
}
function pedirClave() {
    const f = document.getElementById('cl'), i = document.getElementById('cli'), e = document.getElementById('cle');
    e.textContent = ''; i.value = ''; f.hidden = false; i.focus();
    f.onsubmit = ev => {
        ev.preventDefault();
        const est = estadoDeClave(i.value);
        if (!est) { e.textContent = 'Esa clave no existe. Revísala.'; sonido('mal'); return; }
        f.hidden = true; i.blur();
        guardada = est; G.desdeTitulo = false;
        G.inv = est.inv; G.flags = est.flags; G.notas = est.notas; G.pantalla = est.pantalla;
        guardar();
        empezar('clave');
    };
    document.getElementById('clx').onclick = () => { f.hidden = true; i.blur(); };
}
function tocarTitulo(x, y) {
    sonido('click');
    if (!document.getElementById('cl').hidden) return;
    if (dentro(x, y, holgura(BOTONES.musica, 3))) { alternarMusica(); return; }
    if (dentro(x, y, BOTONES.clave)) { pedirClave(); return; }
    if (dentro(x, y, BOTONES.empezar)) empezar(false);
    else if (guardada && dentro(x, y, BOTONES.continuar)) empezar(true);
    else if (dentro(x, y, BOTONES.instituto)) { TITULO = false; contar(); G.inv = []; G.flags = {}; G.notas = []; G.desdeTitulo = true; ir('instituto', ["Institut d'Educació Secundària La Garrigosa"]); }
}

function arrancar() {
    CV = document.getElementById('c'); TX = document.getElementById('tx');
    CV.width = W; CV.height = H;
    CX = CV.getContext('2d'); TG = TX.getContext('2d');
    cargarArte();
    guardada = cargar();
    ajustar();
    addEventListener('resize', ajustar);
    TX.addEventListener('pointerdown', e => { e.preventDefault(); musica(); const [x, y] = aLogico(e); if (TITULO) tocarTitulo(x, y); else pulsar(x, y); });
    TX.addEventListener('pointermove', e => { if (TITULO) return; const [x, y] = aLogico(e); mover(x, y); });
    let t0 = performance.now();
    const bucle = t => {
        const dt = Math.min(0.05, (t - t0) / 1000); t0 = t;
        if (TITULO) dibujarTitulo(); else { actualizar(dt); dibujar(); }
        requestAnimationFrame(bucle);
    };
    requestAnimationFrame(bucle);
}
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('500 12px "Pixelify Sans"'), document.fonts.load('700 12px "Pixelify Sans"')]).catch(() => { }).then(arrancar);
else arrancar();


</script>
