const TEMARIO=[{"n": 1, "titulo": "Medir y comparar", "intro": "Para estudiar el universo primero hay que medirlo. Aquí aprenderás a expresar cantidades con unidades, a manejar números enormes y diminutos y a comparar lo que medimos.", "puntos": [{"t": "Qué es una magnitud física", "x": "Una magnitud física es cualquier propiedad que se puede medir y expresar con un número y una unidad: la longitud, el tiempo, la masa o la temperatura. La belleza o el sabor no son magnitudes, porque ningún instrumento los mide igual para todos.\nDecir «la mesa mide 2» no basta; hay que decir «2 metros». Del mismo modo, el diámetro de la Luna no es «3.474», sino 3.474 kilómetros."}, {"t": "Unidades de medida", "x": "Una unidad es una cantidad de referencia acordada para comparar. Casi todo el mundo usa el Sistema Internacional (SI): el metro para la longitud, el segundo para el tiempo, el kilogramo para la masa y el kelvin para la temperatura.\nSus definiciones se basan en la naturaleza: el segundo, en las oscilaciones del átomo de cesio; el metro, en la distancia que recorre la luz en el vacío en 1/299.792.458 de segundo."}, {"t": "Distancia, tiempo, masa, temperatura y velocidad", "x": "Estas cinco magnitudes aparecen en casi todos los temas. La distancia dice cuánto separa dos puntos; el tiempo, cuánto dura algo; la masa, cuánta materia tiene un cuerpo; la temperatura, lo caliente que está; y la velocidad, cuánta distancia recorre en cada unidad de tiempo.\nPor ejemplo, la Tierra está a unos 150 millones de kilómetros del Sol, tarda un año en rodearlo y avanza a unos 30 kilómetros por segundo."}, {"t": "Conversiones entre unidades", "x": "Convertir es expresar la misma cantidad con otra unidad, multiplicando o dividiendo por un factor de equivalencia. Como 1 hora tiene 3.600 segundos y 1 kilómetro tiene 1.000 metros, 1 m/s equivale a 3,6 km/h.\nAsí, un coche a 108 km/h va a 30 m/s. La temperatura es un caso especial: para pasar de grados Celsius a kelvin se suma 273,15, de modo que 0 °C son 273,15 K."}, {"t": "Escalas y modelos", "x": "Un modelo a escala reproduce un objeto con todas sus medidas reducidas en la misma proporción. Sirve para imaginar lo que es demasiado grande o pequeño para verlo entero.\nSi el Sol fuera una pelota de 1 metro de diámetro, la Tierra sería una canica de unos 9 milímetros situada a 107 metros. Las distancias son tan grandes comparadas con los tamaños que casi ningún dibujo del sistema solar está realmente a escala."}, {"t": "Números muy grandes y muy pequeños", "x": "En astronomía los números se disparan. Un año luz, la distancia que recorre la luz en un año, son unos 9,46 billones de kilómetros, y la galaxia de Andrómeda está a unos 2,5 millones de años luz. En el otro extremo, un átomo de hidrógeno mide alrededor de 0,0000000001 metros.\nEscribir tantos ceros es incómodo y facilita los errores. Ojo: en español, un billón es un millón de millones."}, {"t": "Potencias de diez", "x": "Una potencia de diez indica cuántas veces se multiplica 10 por sí mismo: 10³ = 10 · 10 · 10 = 1.000. El exponente, el número pequeño de arriba, cuenta los ceros. Con exponente negativo se divide: 10⁻³ = 0,001.\nCada paso de exponente multiplica o divide por diez. El diámetro de la Tierra, unos 12.700 km, es del orden de 10⁷ metros; una célula humana típica mide del orden de 10⁻⁵ metros.", "d": "potencias"}, {"t": "Notación científica", "x": "La notación científica escribe cualquier número como un valor entre 1 y 10 multiplicado por una potencia de diez. Así, 300.000.000 se escribe 3 × 10⁸.\nLa velocidad de la luz es de unos 3 × 10⁸ m/s, y la masa del Sol, de unos 2 × 10³⁰ kg: un 2 seguido de treinta ceros. La masa de un electrón, una partícula del átomo, es de 9,1 × 10⁻³¹ kg. Comparar exponentes permite comparar números enormes de un vistazo."}, {"t": "Órdenes de magnitud", "x": "El orden de magnitud de una cantidad es la potencia de diez a la que más se aproxima. Sirve para comparar a grandes rasgos: dos cantidades difieren en un orden de magnitud cuando una es unas diez veces mayor que la otra.\nEl diámetro del Sol es unas 109 veces el de la Tierra, es decir, dos órdenes de magnitud mayor. Y una persona, de unos 70 kg, tiene unos 21 órdenes de magnitud menos masa que la Luna."}, {"t": "Estimaciones y aproximaciones", "x": "Estimar es calcular un valor aproximado con datos redondeados, para saber si un resultado es razonable antes de hacer cuentas exactas. Los físicos lo hacen constantemente.\nEjemplo: la luz viaja a unos 300.000 km/s y el Sol está a unos 150 millones de km. Dividiendo, 150.000.000 / 300.000 = 500 segundos, algo más de 8 minutos. El valor exacto es de unos 8 minutos y 19 segundos: la estimación acierta."}, {"t": "Lectura de tablas y gráficas", "x": "Una tabla ordena datos en filas y columnas; una gráfica los dibuja para ver de un vistazo cómo cambia una magnitud con otra. Lo primero es leer los ejes: qué magnitud representa cada uno y en qué unidades.\nSi representamos la distancia de cada planeta al Sol frente al tiempo que tarda en dar una vuelta, vemos que el tiempo crece cada vez más deprisa: Mercurio tarda 88 días; Neptuno, unos 165 años.", "d": "grafica"}]}, {"n": 2, "titulo": "Proporciones y relaciones", "intro": "Muchas leyes de la naturaleza dicen cómo cambia una cantidad cuando cambia otra. Dominar las proporciones y las fórmulas sencillas permite leer esas leyes sin miedo.", "puntos": [{"t": "Razones y proporciones", "x": "Una razón es el cociente entre dos cantidades e indica cuántas veces cabe una en la otra. Una proporción es la igualdad entre dos razones.\nEl radio de Júpiter, unos 69.900 km, y el de la Tierra, unos 6.371 km, están en razón de casi 11 a 1. Una maqueta con una Tierra de 1 cm y un Júpiter de 11 cm mantiene esa misma razón: es una proporción."}, {"t": "Regla de tres", "x": "La regla de tres resuelve problemas en los que conocemos tres valores de una proporción y buscamos el cuarto: si A corresponde a B, ¿a qué corresponde C? Se multiplica en cruz y se divide.\nLa luz recorre unos 300.000 km en 1 segundo. ¿Cuánto tarda desde la Luna, a 384.400 km? 384.400 × 1 / 300.000 ≈ 1,3 segundos. Siempre vemos la Luna con ese pequeño retraso."}, {"t": "Porcentajes", "x": "Un porcentaje es una proporción expresada sobre cien: el 25 % significa 25 de cada 100. Para calcularlo se divide la parte entre el total y se multiplica por 100.\nEl aire seco contiene alrededor de un 78 % de nitrógeno y un 21 % de oxígeno. El Sol reúne más del 99,8 % de toda la masa del sistema solar: los planetas, lunas y asteroides juntos son apenas un pequeño resto."}, {"t": "Escalas lineales", "x": "Una escala lineal relaciona las medidas de un mapa o una maqueta con las reales mediante un único factor. La escala 1:1.000.000 significa que 1 cm en el mapa son 1.000.000 cm reales, es decir, 10 km.\nEn una gráfica, un eje lineal reparte los valores a intervalos iguales: cada centímetro suma la misma cantidad. Cuando los datos abarcan muchos órdenes de magnitud se usan ejes logarítmicos, en los que cada marca multiplica por diez."}, {"t": "Relaciones directamente proporcionales", "x": "Dos magnitudes son directamente proporcionales si, al multiplicar una por un número, la otra queda multiplicada por el mismo número. Su cociente es constante y su gráfica es una recta que pasa por el origen.\nA velocidad constante, la distancia recorrida es proporcional al tiempo. La Estación Espacial Internacional avanza unos 7,7 km cada segundo: en 10 segundos recorre unos 77 km, y en 100 segundos, unos 770 km."}, {"t": "Relaciones inversamente proporcionales", "x": "Dos magnitudes son inversamente proporcionales si, al multiplicar una por un número, la otra queda dividida por ese mismo número. Su producto se mantiene constante.\nPara recorrer una distancia fija, la velocidad y el tiempo son inversamente proporcionales. Hasta la Luna, a 384.400 km, un avión a 1.000 km/h tardaría unas 384 horas; al doble de velocidad, la mitad. Las naves Apolo, mucho más rápidas, tardaban unos tres días."}, {"t": "Interpretación de fórmulas sencillas", "x": "Una fórmula es una frase abreviada que relaciona magnitudes. En v = d / t, v es la velocidad, d la distancia y t el tiempo. Leerla es entender qué ocurre si cambia cada letra: más distancia en el mismo tiempo significa más velocidad.\nLa Tierra recorre unos 940 millones de km en un año, que son unos 31,6 millones de segundos. Dividiendo, su velocidad media es de unos 30 km/s."}, {"t": "Despejar una variable en una fórmula básica", "x": "Despejar es reorganizar una fórmula para dejar sola la magnitud que buscamos. Lo que multiplica en un lado pasa dividiendo al otro, y lo que divide pasa multiplicando. De v = d / t se obtiene d = v · t y también t = d / v.\nSi una nave viaja a 20 km/s y debe recorrer 60.000 km, usamos t = d / v: 60.000 / 20 = 3.000 segundos, que son 50 minutos."}]}, {"n": 3, "titulo": "Describir el movimiento", "intro": "Todo en el universo se mueve: planetas, estrellas y galaxias. Para describir esos movimientos con precisión necesitamos conceptos como velocidad y aceleración.", "puntos": [{"t": "Posición y sistema de referencia", "x": "La posición de un objeto solo tiene sentido respecto a algo: un punto de referencia y unas direcciones desde las que medir. Ese conjunto se llama sistema de referencia.\nUn pasajero sentado en un tren está quieto respecto al vagón, pero se mueve respecto a las vías. Y tú, ahora mismo, giras con la Tierra: en el ecuador, el suelo se desplaza a unos 1.670 km/h alrededor del eje terrestre."}, {"t": "Distancia y desplazamiento", "x": "La distancia recorrida es la longitud total del camino seguido. El desplazamiento es el cambio de posición entre el punto de partida y el de llegada, medido en línea recta y con una dirección.\nSi das una vuelta completa a una pista de atletismo de 400 metros, has recorrido 400 m, pero tu desplazamiento es cero. Igualmente, en un año la Tierra recorre unos 940 millones de km y vuelve casi al mismo punto de su órbita."}, {"t": "Tiempo", "x": "El tiempo mide la duración de los sucesos y su orden. Lo medimos contando fenómenos que se repiten con regularidad: los días, las fases de la Luna, las oscilaciones de un péndulo o, hoy, las vibraciones de los átomos en los relojes atómicos.\nEl día solar dura 24 horas, pero la Tierra da un giro completo respecto a las estrellas lejanas en unas 23 horas y 56 minutos, porque a la vez avanza en su órbita."}, {"t": "Rapidez y velocidad", "x": "La rapidez indica cuánta distancia se recorre por unidad de tiempo, sin importar hacia dónde. La velocidad añade la dirección y el sentido del movimiento. La rapidez media es v = d / t, donde d es la distancia y t el tiempo.\nLa Luna rodea la Tierra con una rapidez casi constante, de aproximadamente 1 km/s, pero su velocidad cambia sin parar, porque su dirección cambia a lo largo de la órbita."}, {"t": "Movimiento uniforme", "x": "Un movimiento es uniforme cuando el objeto recorre distancias iguales en tiempos iguales, en línea recta y sin cambiar de velocidad. Entonces d = v · t: la distancia es la velocidad multiplicada por el tiempo.\nLa sonda Voyager 1, lejos ya de los planetas, avanza casi en línea recta a unos 17 km/s. En un día recorre unos 1,5 millones de km, casi cuatro veces la distancia entre la Tierra y la Luna."}, {"t": "Movimiento acelerado", "x": "Un movimiento es acelerado cuando la velocidad cambia: aumenta, disminuye o cambia de dirección. Frenar también es acelerar, aunque en sentido contrario al movimiento, y tomar una curva sin cambiar de rapidez también lo es.\nUn cohete al despegar es un buen ejemplo: parte del reposo y, en unos nueve minutos, alcanza unos 28.000 km/h, la velocidad necesaria para mantenerse en órbita baja alrededor de la Tierra."}, {"t": "Aceleración", "x": "La aceleración mide lo rápido que cambia la velocidad: a = Δv / t, donde Δv (se lee «delta v») es el cambio de velocidad y t el tiempo que tarda en producirse. Se mide en metros por segundo cada segundo (m/s²).\nUn coche que pasa de 0 a 100 km/h, unos 28 m/s, en 10 segundos acelera unos 2,8 m/s². Un objeto que cae cerca del suelo acelera 9,8 m/s², bastante más."}, {"t": "Gráficas de posición, velocidad y tiempo", "x": "Las gráficas cuentan un movimiento de un vistazo. En la de posición frente al tiempo, la inclinación de la línea indica la velocidad: cuanto más empinada, más rápido. En la de velocidad frente al tiempo, la inclinación indica la aceleración, y el área bajo la línea es la distancia recorrida.\nUna recta horizontal en la gráfica de velocidad significa movimiento uniforme, como el de la Voyager 1.", "d": "grafica"}, {"t": "Caída libre", "x": "Un cuerpo está en caída libre cuando solo actúa sobre él la gravedad. Sin aire que lo frene, cualquier objeto cae con la misma aceleración, unos 9,8 m/s² en la Tierra, sea cual sea su masa.\nEn 1971 el astronauta David Scott soltó a la vez un martillo y una pluma en la Luna, donde no hay aire: llegaron juntos al suelo. Allí la aceleración de caída es de unos 1,6 m/s², seis veces menor."}, {"t": "Movimiento orbital como movimiento continuo", "x": "Un satélite en órbita está cayendo continuamente hacia la Tierra, pero avanza tan deprisa de lado que la superficie curva se aleja bajo él y nunca llega al suelo. Su dirección cambia sin descanso: es un movimiento acelerado aunque su rapidez no varíe.\nLa Estación Espacial Internacional, a unos 400 km de altura, cae así a unos 7,7 km/s y da una vuelta a la Tierra cada 92 minutos aproximadamente.", "d": "orbita"}]}, {"n": 4, "titulo": "Fuerzas", "intro": "Las fuerzas explican por qué cambian los movimientos. Las tres leyes de Newton son la base para entender desde una piedra que cae hasta una galaxia que gira.", "puntos": [{"t": "Qué es una fuerza", "x": "Una fuerza es una interacción entre dos cuerpos capaz de cambiar su movimiento o de deformarlos. Tiene un valor, una dirección y un sentido, y se mide en newtons (N).\nUn newton es, aproximadamente, lo que pesa en la Tierra una manzana pequeña de 100 gramos. El empujón a un carro, la atracción de un imán o la que mantiene a la Luna girando alrededor de la Tierra son fuerzas."}, {"t": "Fuerza neta", "x": "Cuando sobre un cuerpo actúan varias fuerzas, lo que decide su movimiento es la fuerza neta: la suma de todas teniendo en cuenta sus direcciones. Las fuerzas en el mismo sentido se suman; las de sentidos opuestos se restan.\nSi dos personas tiran de una cuerda con 300 N cada una, en sentidos contrarios, la fuerza neta es cero y la cuerda no se mueve. Si una tira con 350 N, quedan 50 N hacia su lado.", "d": "fuerzas"}, {"t": "Masa y peso", "x": "La masa es la cantidad de materia de un cuerpo, se mide en kilogramos y no cambia de un lugar a otro. El peso es la fuerza con que la gravedad atrae esa masa y se mide en newtons: P = m · g, donde m es la masa y g la aceleración de la gravedad del lugar.\nUna persona de 70 kg pesa unos 690 N en la Tierra y unos 113 N en la Luna, pero su masa sigue siendo 70 kg."}, {"t": "Inercia", "x": "La inercia es la tendencia de los cuerpos a mantener su estado de movimiento: si están quietos, a seguir quietos; si se mueven, a seguir en línea recta a la misma velocidad. Cuanta más masa tiene un cuerpo, más inercia tiene y más cuesta cambiar su movimiento.\nPor eso, cuando un autobús frena de golpe, los pasajeros se van hacia delante: sus cuerpos tienden a seguir avanzando."}, {"t": "Primera ley de Newton", "x": "Isaac Newton la publicó en 1687: todo cuerpo permanece en reposo o en movimiento rectilíneo uniforme mientras la fuerza neta sobre él sea cero. No hace falta una fuerza para mantener un movimiento, solo para cambiarlo.\nEn la Tierra el rozamiento acaba frenándolo todo, y por eso la idea parece extraña. En el espacio se ve con claridad: la Voyager 1 lleva décadas alejándose del Sol sin motores que la empujen."}, {"t": "Segunda ley de Newton", "x": "La segunda ley relaciona fuerza, masa y aceleración: F = m · a, donde F es la fuerza neta, m la masa y a la aceleración. Una misma fuerza acelera menos a un cuerpo con más masa.\nPara acelerar 1 kg a razón de 1 m/s² hace falta 1 newton. El cohete Saturno V, de unas 2.900 toneladas al despegar, necesitaba un empuje de unos 35 millones de newtons para vencer su peso y elevarse."}, {"t": "Tercera ley de Newton", "x": "Si un cuerpo A ejerce una fuerza sobre otro B, B ejerce sobre A una fuerza igual y de sentido contrario. Son la acción y la reacción, y actúan sobre cuerpos distintos.\nAsí funcionan los cohetes: expulsan gases hacia abajo a gran velocidad y los gases empujan al cohete hacia arriba. No necesitan aire en el que apoyarse, por eso funcionan en el vacío. La Tierra atrae a la Luna con la misma fuerza con que la Luna atrae a la Tierra."}, {"t": "Rozamiento", "x": "El rozamiento es una fuerza que aparece cuando dos superficies se deslizan, o intentan deslizarse, una sobre otra, y siempre se opone al movimiento. Depende de los materiales y de lo fuerte que se aprieten.\nGracias a él podemos andar y frenar. Los fluidos también frenan: es la resistencia del aire. Las cápsulas Apolo volvían de la Luna a unos 11 km/s y, frenadas por el aire y los paracaídas, llegaban al mar a menos de 40 km/h."}, {"t": "Equilibrio", "x": "Un cuerpo está en equilibrio cuando la fuerza neta sobre él es cero. Puede estar en reposo, como un libro sobre la mesa, cuyo peso compensa el empuje de la mesa, o moverse a velocidad constante.\nUn paracaidista con el paracaídas cerrado alcanza el equilibrio cuando la resistencia del aire iguala su peso: deja de acelerar y cae a velocidad constante, unos 200 km/h. Más adelante veremos que una estrella es también un equilibrio de fuerzas."}, {"t": "Fuerzas a distancia y fuerzas de contacto", "x": "Las fuerzas de contacto requieren que los cuerpos se toquen: un empujón, el rozamiento o la tensión de una cuerda. Las fuerzas a distancia actúan sin contacto, incluso a través del vacío: la gravitatoria, la eléctrica y la magnética.\nLa gravedad del Sol sujeta a la Tierra a 150 millones de km. Y, en el fondo, el contacto también es eléctrico: los átomos de tu mano y los de la mesa se repelen sin llegar a tocarse."}]}, {"n": 5, "titulo": "Energía", "intro": "La energía es lo que permite que ocurran cambios: mover, calentar, iluminar. Seguirle la pista explica por qué brillan las estrellas y cómo funciona el cosmos.", "puntos": [{"t": "Qué es la energía", "x": "La energía es la capacidad de un sistema para producir cambios: mover objetos, calentarlos o emitir luz. No es una sustancia, sino una cantidad que se puede calcular y que pasa de unas formas a otras. Se mide en julios (J).\nUn julio es la energía necesaria para levantar un metro una manzana de 100 gramos. Una galleta de unas 50 kilocalorías aporta unos 200.000 julios a nuestro cuerpo."}, {"t": "Energía cinética", "x": "La energía cinética es la que tiene un cuerpo por estar en movimiento: Ec = ½ · m · v², donde m es la masa y v la velocidad. Como la velocidad va al cuadrado, ir al doble de rápido supone cuatro veces más energía.\nUn coche de 1.000 kg a 20 m/s (72 km/h) tiene 200.000 julios. Un meteoroide de solo 1 kg a 20 km/s tiene 200 millones: por eso los impactos espaciales son tan destructivos."}, {"t": "Energía potencial", "x": "La energía potencial es energía almacenada por la posición o la forma de un cuerpo, lista para convertirse en movimiento. La tienen un muelle comprimido, un arco tensado o un objeto en lo alto.\nEl agua de un embalse guarda energía potencial por estar elevada; al bajar por las tuberías de una central, mueve las turbinas. La energía química de los alimentos y de la gasolina también es potencial: está guardada en los enlaces entre átomos."}, {"t": "Energía gravitatoria", "x": "La energía potencial gravitatoria es la que tiene un cuerpo por estar a cierta altura bajo la acción de la gravedad. Cerca del suelo, Ep = m · g · h, donde m es la masa, g = 9,8 m/s² y h la altura.\nSubir 1 kg a 10 metros almacena unos 98 julios. A escala cósmica es enorme: cuando una nube de gas se contrae por su propia gravedad, esa energía se libera como calor, y así empiezan a calentarse las estrellas."}, {"t": "Energía térmica", "x": "La energía térmica es la energía de movimiento de las partículas diminutas que forman la materia, que se agitan sin parar. Cuanto más rápido se mueven, más caliente está el cuerpo.\nCalentar un litro de agua de 20 °C a 100 °C requiere unos 335.000 julios. En el centro del Sol, a unos 15 millones de grados, las partículas del gas se mueven a cientos de kilómetros por segundo."}, {"t": "Trabajo y transferencia de energía", "x": "En física se realiza trabajo cuando una fuerza desplaza un objeto en su dirección: W = F · d, donde F es la fuerza y d la distancia recorrida. El trabajo es una forma de transferir energía de un cuerpo a otro; la otra gran forma es el calor.\nSi empujas un carro con 50 N a lo largo de 10 metros, le transfieres 500 julios. Sostener una maleta quieta cansa, pero no realiza trabajo sobre ella."}, {"t": "Conservación de la energía", "x": "La energía no se crea ni se destruye: solo se transforma o pasa de un cuerpo a otro. En un sistema aislado, la cantidad total se mantiene constante. Es uno de los principios más sólidos de toda la física.\nUn péndulo convierte energía gravitatoria en cinética y al revés. Si acaba parándose no es porque la energía desaparezca: el rozamiento la transforma poco a poco en energía térmica del aire y del soporte."}, {"t": "Transformaciones de energía", "x": "Casi todos los procesos son cadenas de transformaciones. La energía nuclear del Sol se convierte en luz; la luz, en energía química dentro de las plantas; y los alimentos, en movimiento y calor de nuestro cuerpo.\nEn cada paso, parte de la energía acaba como calor difícil de aprovechar. Una bombilla incandescente convierte en luz menos del 5 % de la electricidad que recibe; una LED aprovecha bastante más."}, {"t": "Potencia", "x": "La potencia indica lo rápido que se transfiere o transforma la energía: P = E / t, donde E es la energía y t el tiempo. Se mide en vatios (W): 1 vatio es 1 julio por segundo.\nUna bombilla LED típica consume unos 10 W; un microondas, unos 1.000 W. El Sol emite unos 3,8 × 10²⁶ W: cada segundo libera tanta energía como la humanidad consume en cientos de miles de años."}, {"t": "Relación entre masa y energía", "x": "En 1905 Albert Einstein demostró que la masa es una forma de energía: E = m · c², donde E es la energía, m la masa y c la velocidad de la luz, unos 300.000 km/s. Como c es enorme, una masa diminuta equivale a muchísima energía.\nUn solo gramo de materia equivale a unos 90 billones de julios. El Sol convierte en energía unos 4 millones de toneladas de su masa cada segundo."}]}, {"n": 6, "titulo": "Materia, densidad y presión", "intro": "Estrellas, planetas y nubes interestelares están hechos de materia en distintos estados. La densidad y la presión son claves para entender cómo se sostienen y cómo cambian.", "puntos": [{"t": "Qué es la materia", "x": "Materia es todo lo que tiene masa y ocupa un espacio. Está formada por partículas diminutas, los átomos, que pueden unirse entre sí. El aire, el agua, las rocas y tu cuerpo son materia; la luz, en cambio, no lo es.\nEn el universo, la materia ordinaria es sobre todo hidrógeno y helio, los dos átomos más sencillos: juntos suponen alrededor del 98 % de su masa."}, {"t": "Masa y volumen", "x": "La masa mide la cantidad de materia; el volumen, el espacio que ocupa. Son cosas distintas: un kilo de plumas y un kilo de plomo tienen la misma masa, pero las plumas ocupan muchísimo más volumen.\nEl volumen se mide en metros cúbicos o en litros; 1 litro es un cubo de 10 cm de lado. Saturno tiene un volumen unas 760 veces mayor que el de la Tierra, pero solo unas 95 veces su masa."}, {"t": "Densidad", "x": "La densidad indica cuánta masa hay en cada unidad de volumen: ρ = m / V, donde ρ (la letra griega «ro») es la densidad, m la masa y V el volumen. Se suele medir en gramos por centímetro cúbico.\nEl agua tiene 1 g/cm³ y el hierro, unos 7,9. La Tierra es el planeta más denso del sistema solar, con 5,5 g/cm³, mientras que Saturno, con 0,69 g/cm³, es menos denso que el agua."}, {"t": "Estados de la materia", "x": "La materia aparece en estados distintos según cómo se mueven y se unen sus partículas. En un sólido están fijas en su sitio; en un líquido se deslizan unas sobre otras; en un gas se mueven libres y muy separadas.\nExiste un cuarto estado, el plasma: un gas tan caliente que sus átomos han perdido electrones, partículas con carga eléctrica. Las estrellas son de plasma, así que es el estado más abundante de la materia visible."}, {"t": "Cambios de estado", "x": "Al calentar o enfriar una sustancia, puede pasar de un estado a otro: fusión (de sólido a líquido), vaporización (de líquido a gas), condensación, solidificación y sublimación, el paso directo de sólido a gas.\nA la presión del nivel del mar, el agua se funde a 0 °C y hierve a 100 °C. Los cometas, al acercarse al Sol, subliman su hielo: se convierte directamente en gas y forma la cabellera y la cola."}, {"t": "Temperatura y movimiento de las partículas", "x": "La temperatura mide la agitación media de las partículas de un cuerpo: cuanto más rápido se mueven, mayor es. Por eso existe un mínimo, el cero absoluto, en el que esa agitación sería la menor posible: 0 K, es decir, −273,15 °C.\nEn el aire a 20 °C, las moléculas de nitrógeno, parejas de átomos unidos, se mueven a unos 500 m/s. La radiación que llena el universo está a unos 2,7 K."}, {"t": "Presión", "x": "La presión es una fuerza repartida sobre una superficie: p = F / S, donde F es la fuerza y S el área. Se mide en pascales (Pa): 1 pascal es 1 newton sobre 1 metro cuadrado.\nUn mismo peso presiona más sobre menos superficie: por eso un tacón fino se hunde en el barro y una raqueta de nieve no. La atmósfera presiona a nivel del mar con unos 101.325 Pa, como 10 toneladas por metro cuadrado."}, {"t": "Presión en gases y líquidos", "x": "En un fluido, la presión aumenta con la profundidad, porque hay más peso encima, y empuja en todas direcciones. En el agua, cada 10 metros de profundidad la presión sube una atmósfera, que es la presión del aire a nivel del mar.\nAl subir por el aire ocurre lo contrario: en la cima del Everest la presión es aproximadamente un tercio de la del nivel del mar. En la superficie de Venus es unas 92 veces la terrestre."}, {"t": "Compresión y expansión", "x": "Un gas se comprime cuando reducimos su volumen y se expande cuando lo dejamos ocupar más espacio. Al comprimirlo, su presión aumenta y suele calentarse; al expandirse con rapidez, se enfría.\nLo notas al inflar una rueda de bicicleta: la bomba se calienta. Una nube de gas interestelar que se contrae por su propia gravedad se comprime y calienta en su centro: es el primer paso para que nazca una estrella."}]}, {"n": 7, "titulo": "Átomos y elementos", "intro": "Todo lo que vemos, desde una piedra hasta una estrella, está hecho de átomos. Saber cómo son permite averiguar de qué están hechos los astros.", "puntos": [{"t": "Qué es un átomo", "x": "Un átomo es la parte más pequeña de un elemento químico que conserva sus propiedades. Es diminuto: mide alrededor de una décima de nanómetro, así que en el grosor de un cabello caben alineados cientos de miles.\nCasi todo el átomo es espacio vacío: un núcleo central muy pequeño rodeado de electrones. Si un átomo de hidrógeno fuera del tamaño de un estadio de fútbol, su núcleo sería como la cabeza de un alfiler en el centro.", "d": "atomo"}, {"t": "Protones, neutrones y electrones", "x": "Los átomos están formados por tres tipos de partículas. Los protones tienen carga eléctrica positiva y los neutrones no tienen carga; ambos forman el núcleo. Los electrones, con carga negativa, se mueven alrededor del núcleo. Las cargas opuestas se atraen, y eso mantiene unido el átomo.\nProtones y neutrones tienen casi la misma masa, unas 1.836 veces la de un electrón. Por eso casi toda la masa del átomo está en el núcleo."}, {"t": "Núcleo atómico", "x": "El núcleo es la región central del átomo, donde se concentran protones y neutrones. Es entre diez mil y cien mil veces más pequeño que el átomo entero, pero contiene más del 99,9 % de su masa.\nPor eso es densísimo: una cucharadita de materia nuclear tendría una masa de unos mil millones de toneladas. En las estrellas de neutrones, que estudiaremos más adelante, toda una estrella alcanza densidades parecidas."}, {"t": "Número atómico", "x": "El número atómico, representado con la letra Z, es el número de protones que hay en el núcleo. Es la seña de identidad de cada elemento: todo átomo con un protón es hidrógeno; con dos, helio; con seis, carbono; con 26, hierro.\nSi un núcleo gana o pierde protones, se convierte en otro elemento. Eso es justo lo que ocurre en el interior de las estrellas, donde unos núcleos se unen con otros."}, {"t": "Masa atómica", "x": "La masa atómica es la masa de un átomo, expresada en unidades de masa atómica (u). Una unidad es la doceava parte de la masa de un átomo de carbono con 6 protones y 6 neutrones, y equivale casi a la masa de un protón.\nComo los electrones apenas cuentan, la masa atómica es aproximadamente el número de protones más el de neutrones. El hidrógeno tiene alrededor de 1 u; el carbono, 12 u; el hierro, unas 56 u."}, {"t": "Elementos químicos", "x": "Un elemento químico es una sustancia formada por átomos con el mismo número de protones. Hoy se conocen 118: unos 90 aparecen en la naturaleza y el resto se han fabricado en laboratorios.\nEn el cuerpo humano, el oxígeno, el carbono, el hidrógeno y el nitrógeno suman alrededor del 96 % de la masa. En la corteza terrestre dominan el oxígeno y el silicio, y en el Sol, el hidrógeno y el helio."}, {"t": "Tabla periódica", "x": "La tabla periódica ordena los elementos por su número atómico, en filas llamadas periodos y columnas llamadas grupos. Los elementos de una misma columna tienen propiedades químicas parecidas.\nLa propuso Dmitri Mendeléiev en 1869, dejando huecos para elementos aún desconocidos cuyas propiedades predijo. Uno de ellos, el galio, se descubrió en 1875 y encajó con lo previsto. El helio se detectó en la luz del Sol en 1868, antes que en la Tierra.", "d": "tabla"}, {"t": "Isótopos", "x": "Los isótopos son átomos de un mismo elemento, con igual número de protones pero distinto número de neutrones. Se comportan casi igual químicamente, pero tienen distinta masa. Se nombran por su total de protones y neutrones: carbono-12, carbono-14.\nEl hidrógeno común no tiene neutrones; el deuterio, uno. Algunos isótopos son inestables y se transforman lentamente, como el carbono-14, que permite fechar restos de hasta unos 50.000 años de antigüedad."}, {"t": "Iones", "x": "Un ion es un átomo, o un grupo de átomos, que ha ganado o perdido electrones y por eso tiene carga eléctrica. Si pierde electrones, queda con carga positiva; si los gana, con carga negativa.\nLa sal común está formada por iones de sodio positivos y de cloro negativos. En el gas muy caliente de las estrellas, los choques arrancan electrones a los átomos: esa mezcla de iones y electrones libres es el plasma."}, {"t": "Moléculas y compuestos", "x": "Una molécula es un grupo de átomos unidos por enlaces químicos. Un compuesto es una sustancia formada por átomos de distintos elementos en proporciones fijas.\nLa molécula de agua, H₂O, tiene dos átomos de hidrógeno y uno de oxígeno. También hay moléculas en el espacio: en las nubes interestelares se han identificado más de 200 tipos, desde el hidrógeno molecular (H₂) hasta el alcohol etílico."}]}, {"n": 8, "titulo": "Electricidad y magnetismo", "intro": "La electricidad y el magnetismo son dos caras de una misma fuerza: mantiene unidos los átomos, produce la luz y actúa en el Sol, en los planetas y en los telescopios.", "puntos": [{"t": "Carga eléctrica", "x": "La carga eléctrica es una propiedad de algunas partículas que las hace atraerse o repelerse. Hay dos tipos, positiva y negativa: el protón tiene carga positiva y el electrón una negativa del mismo valor. Se mide en culombios (C).\nUn átomo con tantos protones como electrones es neutro. Al frotar un globo contra el pelo, pasan electrones del pelo al globo, y ambos quedan cargados: por eso el pelo se levanta hacia él."}, {"t": "Atracción y repulsión", "x": "Las cargas del mismo signo se repelen y las de signo contrario se atraen. La fuerza crece con el valor de las cargas y disminuye rápidamente con la distancia: al doble de distancia, se reduce a la cuarta parte.\nEs una fuerza enormemente más intensa que la gravedad: entre un protón y un electrón, la atracción eléctrica es unas 10³⁹ veces mayor que la gravitatoria. Es lo que mantiene a los electrones unidos al núcleo."}, {"t": "Corriente eléctrica", "x": "La corriente eléctrica es un flujo de cargas en movimiento, normalmente electrones que avanzan por un cable metálico. Su intensidad indica cuánta carga pasa cada segundo y se mide en amperios (A).\nUn cargador de móvil suministra uno o dos amperios. Los rayos son corrientes gigantescas: un rayo típico transporta unos 30.000 amperios durante una fracción de segundo, y en la atmósfera de Júpiter también se han observado rayos."}, {"t": "Voltaje y resistencia", "x": "El voltaje es la energía que recibe cada unidad de carga entre dos puntos, el «empuje» que impulsa la corriente; se mide en voltios (V). La resistencia es la dificultad que opone un material al paso de la corriente; se mide en ohmios (Ω).\nSe relacionan por la ley de Ohm: I = V / R, donde I es la intensidad. Una pila común da 1,5 V; los enchufes domésticos europeos, 230 V."}, {"t": "Circuitos sencillos", "x": "Un circuito es un camino cerrado por el que circula la corriente: una fuente de energía, como una pila, unos cables y uno o más aparatos. Si el camino se abre, por ejemplo con un interruptor, la corriente se detiene.\nCon una pila de 1,5 V y una bombilla de 3 ohmios circulan I = V / R = 1,5 / 3 = 0,5 amperios. En serie, los elementos van uno tras otro; en paralelo, cada uno tiene su propio camino."}, {"t": "Campos eléctricos", "x": "Un campo eléctrico es la zona alrededor de una carga en la que otra carga notaría una fuerza. Se dibuja con líneas que salen de las cargas positivas y entran en las negativas: cuanto más juntas están, más intenso es el campo.\nLa idea de campo, impulsada por Michael Faraday en el siglo XIX, explica cómo actúa una fuerza a distancia. En una tormenta, el campo entre la nube y el suelo crece hasta que salta el rayo.", "d": "lineas"}, {"t": "Imanes y campos magnéticos", "x": "Un imán tiene dos polos, norte y sur: los polos iguales se repelen y los distintos se atraen. A su alrededor crea un campo magnético, que se hace visible esparciendo limaduras de hierro sobre un papel.\nLa Tierra se comporta como un gran imán, y por eso la brújula señala el norte. Su campo, generado por el movimiento del hierro fundido de su núcleo, nos protege de las partículas con carga que llegan del Sol."}, {"t": "Relación entre electricidad y magnetismo", "x": "En 1820, Hans Christian Ørsted observó que una corriente eléctrica desviaba la aguja de una brújula: las cargas en movimiento crean campos magnéticos. En 1831, Michael Faraday descubrió lo inverso: un imán que se mueve cerca de un cable genera en él una corriente.\nEn eso se basan los motores eléctricos, que convierten corriente en movimiento, y los generadores de las centrales, que convierten movimiento en corriente."}, {"t": "Electromagnetismo", "x": "Hacia 1865, James Clerk Maxwell unificó electricidad y magnetismo en una sola teoría. Predijo que un campo eléctrico y otro magnético que cambian pueden sostenerse mutuamente y viajar por el espacio como una onda, una perturbación que se propaga, a unos 300.000 km/s.\nEsa velocidad coincidía con la de la luz: la luz es una onda electromagnética. También lo son las ondas de radio, las microondas y los rayos X."}, {"t": "Aplicaciones en instrumentos astronómicos", "x": "Los telescopios modernos dependen del electromagnetismo. Sus cámaras usan sensores en los que la luz libera electrones, que se cuentan como una corriente diminuta para formar la imagen. Los radiotelescopios captan ondas de radio con antenas en las que esas ondas inducen corrientes.\nEl radiotelescopio FAST, en China, tiene una antena de 500 metros de diámetro. Con imanes muy potentes, además, se dirigen las partículas en los detectores."}]}, {"n": 9, "titulo": "Calor y radiación", "intro": "La energía viaja siempre de lo caliente a lo frío, y en el espacio vacío solo puede hacerlo como radiación. Por eso la luz de los astros nos revela lo calientes que están.", "puntos": [{"t": "Diferencia entre temperatura y calor", "x": "La temperatura mide lo agitadas que están, de media, las partículas de un cuerpo. El calor es la energía que pasa de un cuerpo a otro porque tienen distinta temperatura. Un cuerpo tiene temperatura, pero no «tiene» calor: lo cede o lo recibe.\nLas chispas de una bengala superan los 1.000 °C, pero apenas queman la piel, porque su masa es tan pequeña que transfieren muy poca energía."}, {"t": "Transferencia de calor", "x": "El calor fluye de forma espontánea del cuerpo más caliente al más frío, nunca al revés. Lo hace de tres maneras: por conducción, por convección y por radiación.\nEn una cocina se ven las tres: el mango metálico de una sartén se calienta por conducción, el agua de una olla circula por convección y notas el calor del fuego a distancia por radiación. El Sol nos calienta solo por radiación, porque entre él y nosotros casi todo es vacío."}, {"t": "Conducción", "x": "En la conducción, el calor pasa de partícula a partícula por contacto, sin que la materia se desplace: las partículas más agitadas golpean a sus vecinas y les transmiten energía. Los metales conducen muy bien; el aire, la madera o la lana, muy mal, y por eso abrigan.\nLas losetas aislantes de los transbordadores espaciales conducían tan mal el calor que podían sujetarse por los bordes recién sacadas de un horno a más de 1.000 °C."}, {"t": "Convección", "x": "La convección transporta calor con el movimiento de un fluido, líquido o gas. La parte calentada se expande, se vuelve menos densa y sube; la más fría y densa baja. Así se forman corrientes circulares.\nOcurre en una olla al fuego y en la atmósfera, donde forma nubes de tormenta. En el Sol, la energía recorre por convección los últimos 200.000 km hasta la superficie, cubierta de gránulos como burbujas de agua hirviendo."}, {"t": "Radiación", "x": "La radiación transmite energía mediante ondas electromagnéticas, como la luz o el infrarrojo, y no necesita materia: puede atravesar el vacío. Todo cuerpo por encima del cero absoluto emite radiación.\nLa luz del Sol recorre 150 millones de km en algo más de 8 minutos y deposita en lo alto de la atmósfera unos 1.361 vatios por metro cuadrado. Tu cuerpo también radia, en infrarrojo: por eso una cámara térmica te ve a oscuras."}, {"t": "Equilibrio térmico", "x": "Dos cuerpos que intercambian calor acaban a la misma temperatura; entonces el flujo neto se detiene y están en equilibrio térmico. Un café caliente se enfría hasta igualar la temperatura de la habitación.\nUn planeta también alcanza un equilibrio: su temperatura se estabiliza cuando la energía que recibe del Sol iguala la que emite al espacio. Si la atmósfera de la Tierra no retuviera parte del calor, ese equilibrio la dejaría a unos −18 °C de media."}, {"t": "Cuerpos calientes y cuerpos fríos", "x": "Todo cuerpo emite radiación, y su temperatura decide cuánta y de qué color. Al doble de temperatura absoluta, cada metro cuadrado emite 16 veces más energía, y con colores más azulados. Un hierro calentado pasa del rojo al amarillo y luego al blanco.\nLos cuerpos fríos, como nosotros o los planetas, emiten sobre todo infrarrojo, invisible a los ojos. Una estrella de 3.000 K se ve rojiza; una de 10.000 K, blanco azulada.", "d": "espectro"}, {"t": "Emisión y absorción de radiación", "x": "Los cuerpos no solo emiten radiación: también la absorben, y la que absorben los calienta. Una superficie oscura absorbe casi toda la luz que recibe; una clara refleja buena parte. Un buen absorbente es también un buen emisor.\nLa nieve fresca refleja entre el 80 y el 90 % de la luz solar, mientras que el asfalto absorbe más del 90 %, y por eso quema en verano. La Luna, de roca oscura, refleja solo un 12 %."}, {"t": "Temperatura de los objetos astronómicos", "x": "Como no podemos acercar un termómetro a una estrella, medimos su temperatura por la luz que emite: su color y el reparto de su radiación revelan lo caliente que está su superficie.\nLa superficie del Sol está a unos 5.800 K, unos 5.500 °C; la de Betelgeuse, rojiza, a unos 3.600 K; la de Rigel, blanco azulada, a más de 11.000 K. Los planetas, mucho más fríos, se estudian sobre todo en infrarrojo."}]}, {"n": 10, "titulo": "Física nuclear", "intro": "Una mirada al corazón del átomo: qué mantiene unido el núcleo y cómo puede liberar enormes cantidades de energía. Es la clave para entender por qué brillan las estrellas y de dónde salen los elementos químicos.", "puntos": [{"t": "El núcleo atómico", "x": "El núcleo es la parte central del átomo y contiene protones y neutrones, que en conjunto se llaman nucleones. Es diminuto: mide alrededor de 10⁻¹⁵ metros, unas cien mil veces menos que el átomo completo. Si un átomo tuviera el tamaño de un estadio de fútbol, su núcleo sería como un guisante en el centro del campo.\nAun así, el núcleo reúne más del 99,9 % de la masa del átomo."}, {"t": "Fuerza nuclear", "x": "Los protones tienen carga positiva y se repelen entre sí. Si el núcleo no se deshace es gracias a la fuerza nuclear fuerte, que atrae a protones y neutrones entre sí. A esas distancias es unas cien veces más intensa que la repulsión eléctrica, pero tiene un alcance muy corto: apenas el tamaño de un núcleo, unos 10⁻¹⁵ metros.\nExiste también una fuerza nuclear débil, responsable de que en algunos núcleos un neutrón se transforme en un protón, o al revés."}, {"t": "Radiactividad", "x": "Algunos núcleos son inestables y, tarde o temprano, se transforman por sí solos emitiendo partículas o energía. Es la radiactividad. Hay tres tipos principales: alfa (un grupo de dos protones y dos neutrones), beta (un electrón o su versión positiva) y gamma (radiación muy energética de la misma familia que la luz).\nLa descubrió Henri Becquerel en 1896 con sales de uranio, y Marie Curie le dio nombre al estudiarla junto a Pierre Curie."}, {"t": "Vida media", "x": "No se puede saber cuándo se desintegrará un núcleo concreto, pero sí cuánto tarda en desintegrarse la mitad de una muestra: el periodo de semidesintegración, que a menudo se llama «vida media» (en sentido estricto, la vida media es el tiempo medio que vive un núcleo, 1,44 veces mayor).\nEl carbono-14 tiene un periodo de 5730 años, útil para fechar restos antiguos. El del uranio-238 es de 4470 millones de años, casi la edad de la Tierra."}, {"t": "Fisión nuclear", "x": "La fisión es la ruptura de un núcleo pesado en dos más ligeros. Cuando un núcleo de uranio-235 absorbe un neutrón, se parte en dos fragmentos y libera energía y dos o tres neutrones nuevos, que pueden romper otros núcleos: es la reacción en cadena.\nLa descubrieron Otto Hahn y Fritz Strassmann en 1938, y la explicaron Lise Meitner y Otto Frisch. Un kilo de uranio-235 fisionado libera tanta energía como quemar unas 2700 toneladas de carbón."}, {"t": "Fusión nuclear", "x": "La fusión es la unión de núcleos ligeros para formar uno más pesado. Como los núcleos se repelen, solo se fusionan si chocan a enorme velocidad, es decir, a temperaturas altísimas.\nEn el núcleo del Sol, a unos 15 millones de grados, el hidrógeno se fusiona en helio. Cada segundo transforma unos 600 millones de toneladas de hidrógeno, y unos 4 millones de toneladas de esa materia se convierten en la energía que nos llega como luz y calor.", "d": "sol"}, {"t": "Energía de enlace", "x": "La energía de enlace es la que habría que aportar para separar un núcleo en todos sus protones y neutrones. Cuanto mayor es por cada nucleón, más estable es el núcleo.\nEsa energía por nucleón crece desde el hidrógeno hasta alcanzar su máximo en torno al hierro, y después disminuye poco a poco en los núcleos más pesados. Por eso fusionar núcleos ligeros o romper núcleos muy pesados libera energía: en ambos casos se acercan al hierro.", "d": "grafica"}, {"t": "Defecto de masa", "x": "Un núcleo pesa algo menos que la suma de sus piezas por separado. Esa diferencia es el defecto de masa, y es la energía de enlace convertida en masa según E = m·c², donde E es la energía, m la masa y c la velocidad de la luz.\nAl fusionar un kilo de hidrógeno en helio desaparecen unos 7 gramos. Con E = 0,007 · (300 000 000)² salen unos 6·10¹⁴ julios, tanta energía como quemar más de 20 000 toneladas de carbón."}, {"t": "Formación de elementos químicos", "x": "Casi todo el hidrógeno y el helio del universo se formó en sus primeros minutos. Los demás elementos se han fabricado después mediante reacciones nucleares en las estrellas: el carbono, el oxígeno y el resto hasta el hierro se forman por fusión en su interior.\nLos más pesados, como el oro o el uranio, necesitan procesos más violentos, como las explosiones de estrellas o los choques entre restos estelares. El calcio de tus huesos se forjó dentro de estrellas."}, {"t": "Riesgos y aplicaciones de la radiación", "x": "La radiación de alta energía puede dañar las células y su ADN; el riesgo depende de la dosis, que se mide en sieverts. De fuentes naturales recibimos de media unos 2,4 milisieverts al año.\nBien controlada es muy útil: trata tumores, permite hacer diagnósticos médicos y fechar restos con carbono-14. En el espacio, generadores que aprovechan el calor del plutonio-238 dan electricidad a las sondas Voyager, lanzadas en 1977, y al róver Curiosity en Marte."}]}, {"n": 11, "titulo": "Qué es una onda", "intro": "Las ondas son la forma en que la energía viaja sin que viaje la materia. Casi todo lo que sabemos del universo nos llega como ondas, así que entender sus propiedades es imprescindible.", "puntos": [{"t": "Oscilaciones y vibraciones", "x": "Una oscilación es un movimiento que se repite una y otra vez alrededor de una posición de reposo. Un columpio, un péndulo o una cuerda de guitarra oscilan; cuando el movimiento es rápido y pequeño hablamos de vibración.\nUn péndulo de 1 metro de largo tarda unos 2 segundos en ir y volver. El diapasón que usan los músicos para afinar vibra 440 veces por segundo y produce la nota la."}, {"t": "Ondas mecánicas y electromagnéticas", "x": "Una onda es una perturbación que se propaga y transporta energía, no materia: una boya sube y baja al paso de una ola, pero no avanza con ella.\nLas ondas mecánicas necesitan un medio material: el sonido viaja por el aire, el agua o las rocas. Las electromagnéticas son vibraciones de campos eléctricos y magnéticos y pueden viajar por el vacío. Por eso en el espacio no se oye nada, pero la luz del Sol sí nos alcanza."}, {"t": "Amplitud", "x": "La amplitud es lo máximo que se aparta la onda de su posición de reposo. Cuanto mayor es, más energía transporta: al doble de amplitud, cuatro veces más energía.\nEn el mar, una ola con 2 metros de diferencia entre cresta y valle tiene 1 metro de amplitud. En el sonido, la amplitud determina el volumen; en la luz, el brillo. Una estrella más brillante nos envía ondas de mayor amplitud, aunque no necesariamente de distinto color.", "d": "onda"}, {"t": "Frecuencia", "x": "La frecuencia es el número de oscilaciones completas que ocurren en un segundo. Se mide en hercios (Hz), en honor de Heinrich Hertz: 1 Hz es una oscilación por segundo.\nEl oído humano percibe sonidos entre unos 20 y 20 000 Hz. Una emisora de radio FM emite a unos 100 megahercios, cien millones de oscilaciones por segundo, y la luz visible vibra todavía unos cinco millones de veces más deprisa."}, {"t": "Longitud de onda", "x": "La longitud de onda es la distancia entre dos crestas consecutivas de una onda. Se representa con la letra griega λ (lambda).\nEl sonido de la nota la, a 440 Hz, tiene en el aire una longitud de onda de unos 78 centímetros. Las ondas de radio FM miden unos 3 metros. La luz visible, en cambio, va de unos 400 a 700 nanómetros: cien veces menos que el grosor de un cabello.", "d": "onda"}, {"t": "Periodo", "x": "El periodo es el tiempo que tarda una onda en completar una oscilación. Se representa con T y es el inverso de la frecuencia: T = 1 / f, donde f es la frecuencia.\nEl péndulo de 1 metro tiene un periodo de 2 segundos, así que su frecuencia es 0,5 Hz. El diapasón de 440 Hz completa cada vibración en poco más de dos milésimas de segundo. Cuanto mayor es la frecuencia, más corto es el periodo."}, {"t": "Velocidad de propagación", "x": "Es la rapidez con que la onda avanza, y depende del medio. El sonido recorre unos 343 metros por segundo en el aire a 20 °C, unos 1500 en el agua y casi 6000 en el acero.\nLa luz en el vacío va a casi 300 000 kilómetros por segundo. Por eso en una tormenta el relámpago se ve antes de oír el trueno: cada 3 segundos de retraso equivalen aproximadamente a 1 kilómetro de distancia."}, {"t": "Relación entre frecuencia y longitud de onda", "x": "Velocidad, frecuencia y longitud de onda están unidas por v = λ · f, donde v es la velocidad, λ la longitud de onda y f la frecuencia. Si la velocidad es fija, a más frecuencia, menor longitud de onda.\nUna emisora FM de 100 megahercios emite ondas de 300 000 000 / 100 000 000 = 3 metros. Una luz verde de 500 nanómetros vibra unas 600 billones de veces por segundo."}, {"t": "Interferencia", "x": "Cuando dos ondas coinciden en el mismo lugar se suman. Si las crestas coinciden con crestas, se refuerzan: interferencia constructiva. Si las crestas coinciden con valles, se anulan: interferencia destructiva.\nLos auriculares con cancelación de ruido emiten una onda opuesta al ruido para borrarlo, y los colores de una pompa de jabón surgen por interferencia de la luz. Los astrónomos combinan la luz de varios telescopios separados para obtener imágenes mucho más nítidas."}, {"t": "Reflexión", "x": "La reflexión ocurre cuando una onda choca contra una superficie y rebota. La onda sale con el mismo ángulo con el que llegó.\nEl eco es sonido reflejado: si una pared está a 170 metros, el sonido tarda 1 segundo en ir y volver. Los astronautas del Apolo dejaron espejos en la Luna; un pulso de láser enviado desde la Tierra vuelve unos 2,5 segundos después, y eso permite medir su distancia con precisión de centímetros."}, {"t": "Refracción", "x": "La refracción es el cambio de dirección de una onda al pasar de un medio a otro en el que viaja a distinta velocidad. Si la onda entra inclinada, uno de sus lados frena antes y la onda se tuerce.\nPor eso una cuchara parece quebrada dentro de un vaso de agua: la luz va por el agua a unos 225 000 km/s, más despacio que por el aire. Las olas también se curvan al llegar a aguas poco profundas."}, {"t": "Difracción", "x": "La difracción es la capacidad de una onda para rodear obstáculos y abrirse al cruzar una abertura. Es notable cuando el obstáculo es parecido a la longitud de onda.\nOímos a alguien detrás de una esquina, porque el sonido mide alrededor de un metro, pero no lo vemos, porque la luz mide menos de una milésima de milímetro. La difracción también limita la nitidez de un telescopio: cuanto mayor es su espejo, más finos detalles puede distinguir."}]}, {"n": 12, "titulo": "La luz visible", "intro": "La luz es el principal mensajero del universo: casi todo lo que sabemos de las estrellas lo hemos aprendido analizándola. Aquí veremos qué es y cómo se comporta al reflejarse, desviarse y formar imágenes.", "puntos": [{"t": "La luz como radiación electromagnética", "x": "La luz es una onda electromagnética: una vibración de campos eléctricos y magnéticos que se propaga por sí misma, sin necesidad de medio. James Clerk Maxwell lo dedujo hacia 1865 al unificar las leyes de la electricidad y el magnetismo.\nLa luz visible es solo la parte de esas ondas que detectan nuestros ojos, con longitudes de onda entre unos 380 y 750 nanómetros. Existen muchas otras, invisibles, que veremos en el tema siguiente."}, {"t": "Velocidad de la luz", "x": "En el vacío, la luz viaja a 299 792 458 metros por segundo, casi 300 000 km/s. Nada transporta energía ni información más rápido. En 1676, Ole Rømer obtuvo la primera estimación observando cómo se adelantaban o retrasaban los eclipses de Ío, una luna de Júpiter.\nLa luz de la Luna tarda 1,3 segundos en llegarnos y la del Sol, unos 8 minutos y 20 segundos. Vemos el Sol como era hace ocho minutos."}, {"t": "Colores", "x": "El color de la luz depende de su longitud de onda: el rojo ronda los 700 nanómetros y el violeta, los 400; entre ellos están el naranja, el amarillo, el verde y el azul. El ojo humano distingue colores gracias a tres tipos de células llamadas conos.\nUn objeto tiene el color de la luz que refleja. Una hoja es verde porque absorbe sobre todo luz roja y azul y devuelve la verde."}, {"t": "Mezcla de colores", "x": "Las luces se suman: rojo, verde y azul juntos dan blanco, y rojo más verde dan amarillo. Así funcionan las pantallas, con diminutos puntos de esos tres colores. Es la mezcla aditiva.\nLas pinturas, en cambio, restan: cada pigmento absorbe parte de la luz, y mezclar cian, magenta y amarillo da un color casi negro. Las fotos en color de los telescopios suelen componerse sumando tres imágenes tomadas con filtros distintos."}, {"t": "Luz blanca", "x": "La luz blanca no es un color puro, sino la mezcla de todos los colores visibles. Isaac Newton lo demostró hacia 1666: un prisma separaba la luz del Sol en un abanico de colores y un segundo prisma volvía a reunirlos en luz blanca.\nEl arcoíris es el mismo fenómeno: las gotas de lluvia separan los colores de la luz solar. Ese abanico de colores se llama espectro, y será una herramienta fundamental en astronomía.", "d": "espectro"}, {"t": "Sombras", "x": "En un medio uniforme la luz viaja en línea recta, así que un cuerpo opaco deja detrás una zona sin luz: la sombra. Si la fuente es extensa, como el Sol, hay una sombra total, la umbra, rodeada de una sombra parcial, la penumbra.\nLos eclipses son sombras: en uno lunar, la de la Tierra cae sobre la Luna; en uno solar total, como el del 12 de agosto de 2026 en el norte de España, la umbra lunar barre una franja estrecha."}, {"t": "Reflexión", "x": "Una superficie muy lisa, como un espejo, refleja la luz ordenadamente y forma imágenes; una rugosa, como el papel, la dispersa en todas direcciones: es la reflexión difusa, que nos permite ver los objetos.\nLa Luna no tiene luz propia: brilla porque refleja la del Sol, aunque solo devuelve en torno al 12 % de la que recibe, algo parecido al asfalto. La nieve recién caída refleja más del 80 %."}, {"t": "Refracción", "x": "La luz se desvía al cambiar de medio porque cambia su velocidad. El índice de refracción, n = c / v, indica cuánto se frena: c es la velocidad en el vacío y v la del medio. Vale 1,33 en el agua, alrededor de 1,5 en el vidrio y 2,42 en el diamante.\nLa atmósfera también refracta: cuando vemos el Sol tocando el horizonte al atardecer, en realidad ya está por debajo de él."}, {"t": "Lentes", "x": "Una lente es una pieza transparente con caras curvas que desvía la luz por refracción. Las convergentes, más gruesas en el centro, concentran los rayos paralelos en un punto llamado foco; las divergentes, más finas en el centro, los separan.\nEn 1609 Galileo apuntó al cielo un telescopio de lentes y descubrió las cuatro lunas mayores de Júpiter. El mayor telescopio de lentes que se ha construido, el de Yerkes, tiene una lente de 1,02 metros."}, {"t": "Espejos", "x": "Un espejo cóncavo, curvado hacia dentro, concentra la luz en un foco, igual que una lente convergente. Isaac Newton construyó en 1668 uno de los primeros telescopios de espejo.\nHoy todos los grandes telescopios usan espejos: pueden sostenerse por detrás, por lo que se hacen enormes, y no separan los colores como las lentes. El Gran Telescopio Canarias tiene un espejo de 10,4 metros, y el telescopio espacial James Webb, uno de 6,5 metros formado por 18 piezas."}, {"t": "Formación de imágenes", "x": "Una lente o un espejo forma una imagen al recoger la luz que sale de cada punto de un objeto y concentrarla de nuevo en un punto. Si los rayos se juntan de verdad, la imagen es real y puede proyectarse en una pantalla o un sensor.\nCuanto mayor es la superficie que recoge la luz, más objetos débiles se ven. Un espejo de 10 metros capta unos dos millones de veces más luz que la pupila humana, de unos 7 milímetros."}]}, {"n": 13, "titulo": "El espectro electromagnético", "intro": "La luz visible es solo una pequeña parte de una familia mucho más amplia de ondas electromagnéticas. Cada tipo revela fenómenos distintos del cosmos, y la astronomía moderna los observa todos.", "puntos": [{"t": "Ondas de radio", "x": "Las ondas de radio son las electromagnéticas de mayor longitud de onda: desde algo menos de un metro hasta kilómetros. Las usan la radio, la televisión y los móviles.\nEn 1932 Karl Jansky detectó por primera vez ondas de radio procedentes del centro de la Vía Láctea, nuestra galaxia. Hoy los radiotelescopios captan, por ejemplo, la emisión de 21 centímetros del hidrógeno frío, que permite cartografiar el gas de las galaxias."}, {"t": "Microondas", "x": "Las microondas tienen longitudes de onda entre aproximadamente un milímetro y unos treinta centímetros; a menudo se consideran la parte más corta de las ondas de radio. Un horno de microondas usa ondas de unos 12 centímetros que agitan las moléculas de agua de los alimentos.\nEn 1965 Arno Penzias y Robert Wilson descubrieron un débil resplandor de microondas que llega de todas direcciones: un eco del universo primitivo que estudiaremos más adelante."}, {"t": "Infrarrojo", "x": "El infrarrojo está entre la luz roja y las microondas, de unos 750 nanómetros a un milímetro. William Herschel lo descubrió en 1800 al colocar un termómetro más allá del rojo del espectro. Todo objeto templado lo emite: nuestro cuerpo, a 37 °C, brilla sobre todo en infrarrojo.\nEl telescopio James Webb, lanzado en 2021, observa en infrarrojo, que atraviesa las nubes de polvo donde nacen las estrellas."}, {"t": "Luz visible", "x": "La luz visible ocupa una franja estrechísima del espectro, de unos 380 a 750 nanómetros: la luz que más rápido vibra apenas lo hace el doble de deprisa que la más lenta. No es casualidad que la veamos: es la radiación que el Sol emite con más intensidad y la que la atmósfera deja pasar mejor.\nDurante milenios fue la única ventana de la astronomía, hasta mediados del siglo XX.", "d": "espectro"}, {"t": "Ultravioleta", "x": "El ultravioleta va de unos 10 a 380 nanómetros, justo más allá del violeta. Es el que nos broncea y nos quema la piel; por fortuna, la capa de ozono absorbe la mayor parte del que llega del Sol.\nLas estrellas jóvenes y muy calientes, con más de 10 000 grados en su superficie, emiten sobre todo ultravioleta. Para estudiarlas hacen falta telescopios espaciales, como el Hubble, que observa también en esta franja."}, {"t": "Rayos X", "x": "Los rayos X tienen longitudes de onda de entre unos 0,01 y 10 nanómetros. Wilhelm Röntgen los descubrió en 1895 y pronto se usaron para ver los huesos.\nEn el universo los emite el gas a millones de grados: la corona del Sol, que supera el millón de grados, o el gas que llena los grandes grupos de galaxias. Como la atmósfera los bloquea, se observan desde el espacio, por ejemplo con el telescopio Chandra, lanzado en 1999."}, {"t": "Rayos gamma", "x": "Los rayos gamma son la radiación de menor longitud de onda y mayor energía, por debajo de 0,01 nanómetros. En la Tierra surgen en procesos nucleares, como la radiactividad.\nEn el cosmos delatan los fenómenos más violentos, como las explosiones de estrellas. Los satélites militares Vela, lanzados en los años sesenta para vigilar pruebas nucleares, descubrieron por casualidad breves destellos de rayos gamma procedentes del espacio lejano. Hoy los estudia el telescopio espacial Fermi, lanzado en 2008."}, {"t": "Energía y frecuencia", "x": "Todas estas radiaciones son la misma cosa, ondas electromagnéticas que viajan a la velocidad de la luz; solo se diferencian en su frecuencia o, lo que es igual, en su longitud de onda.\nCuanto mayor es la frecuencia, más energía transporta cada pequeña porción de radiación. Una porción de rayos X de 1 nanómetro lleva unas 500 veces más energía que una de luz verde de 500 nanómetros. Por eso los rayos X atraviesan tejidos y las ondas de radio son inofensivas."}, {"t": "Ventanas atmosféricas", "x": "La atmósfera terrestre solo es transparente en unas pocas franjas del espectro, llamadas ventanas: la luz visible, parte del infrarrojo cercano y las ondas de radio de entre un centímetro y unos diez metros.\nBloquea los rayos gamma, los rayos X y casi todo el ultravioleta, y el vapor de agua absorbe gran parte del infrarrojo. Por eso el observatorio ALMA está a 5000 metros de altura, en el desierto de Atacama, muy seco."}, {"t": "Observatorios especializados", "x": "Cada franja del espectro exige un instrumento propio. Las ondas de radio se captan con grandes antenas en tierra, como las 66 de ALMA, en Chile. El infrarrojo se observa desde montañas altas o desde el espacio: el James Webb trabaja a 1,5 millones de kilómetros de la Tierra.\nLos rayos X y gamma solo pueden estudiarse por encima de la atmósfera, con satélites como Chandra, XMM-Newton o Fermi."}, {"t": "Por qué no basta con observar el cielo en luz visible", "x": "Cada tipo de radiación revela una parte distinta del universo: las ondas de radio muestran el gas frío; el infrarrojo, las estrellas que nacen ocultas en polvo; los rayos X, gas a millones de grados.\nEl centro de nuestra galaxia, a unos 26 000 años luz (la distancia que la luz recorre en 26 000 años), está tapado por tanto polvo que en luz visible no se ve. En infrarrojo y en rayos X, en cambio, se distinguen sus estrellas y su actividad."}]}, {"n": 14, "titulo": "Fotones y energía de la luz", "intro": "La luz no es solo una onda: también llega en pequeños paquetes de energía llamados fotones. Entender cómo se emiten, se absorben y se detectan es la base de toda observación astronómica.", "puntos": [{"t": "La luz como transporte de energía", "x": "La luz lleva energía de un lugar a otro: por eso calienta una piedra al sol o mueve una calculadora solar. El Sol emite en total unos 3,8·10²⁶ vatios.\nTras viajar unos 150 millones de kilómetros, a la Tierra, por encima de la atmósfera, llegan unos 1361 vatios por cada metro cuadrado, como trece bombillas antiguas de 100 vatios. Esa energía, viajando por el vacío, mantiene el clima y la vida de nuestro planeta."}, {"t": "Fotones", "x": "La luz se comporta como una onda, pero al interactuar con la materia lo hace como si llegara en paquetes indivisibles de energía: los fotones. No tienen masa y viajan a la velocidad de la luz.\nAlbert Einstein lo propuso en 1905 para explicar por qué la luz arranca electrones de los metales, el efecto fotoeléctrico, y por ello recibió el premio Nobel. Un ojo adaptado a la oscuridad puede notar un destello de apenas unos pocos fotones."}, {"t": "Energía de un fotón", "x": "La energía de un fotón se calcula con E = h · f, donde E es la energía, f la frecuencia de la luz y h la constante de Planck, un número diminuto: 6,63·10⁻³⁴ julios·segundo.\nUn fotón de luz verde tiene unos 3,6·10⁻¹⁹ julios. Por eso un puntero láser verde de 1 milivatio emite casi tres mil billones de fotones cada segundo: cada uno lleva una cantidad de energía minúscula."}, {"t": "Frecuencia y energía", "x": "Como E = h · f, la energía de un fotón es proporcional a su frecuencia: al doble de frecuencia, el doble de energía. Un fotón azul lleva casi el doble que uno rojo, y uno de rayos X, miles de veces más.\nPor eso la luz ultravioleta quema la piel y la roja no, por intensa que sea: lo que daña es la energía de cada fotón por separado, capaz de romper moléculas, y no la cantidad total de luz."}, {"t": "Absorción y emisión", "x": "Un átomo puede absorber un fotón y quedarse con su energía: uno de sus electrones pasa a un estado de mayor energía. Más tarde el electrón vuelve a su estado inicial y el átomo emite un fotón con esa misma energía.\nAsí brillan los letreros de neón, de color rojo anaranjado, y las antiguas farolas de sodio, con su luz amarilla de 589 nanómetros. Cada tipo de átomo emite y absorbe solo ciertos colores."}, {"t": "Cuantización de la energía", "x": "Dentro de un átomo, los electrones no pueden tener cualquier energía, sino solo ciertos valores permitidos, llamados niveles. Es como una escalera: se puede estar en un peldaño o en otro, pero no entre ambos. Por eso decimos que la energía está cuantizada.\nNiels Bohr lo explicó en 1913 para el hidrógeno. Cuando su electrón baja del tercer nivel al segundo emite luz roja de 656 nanómetros, la que tiñe muchas nebulosas.", "d": "atomo"}, {"t": "Detectores de luz", "x": "Un detector convierte los fotones que recibe en una señal que se puede medir. El ojo humano fue el primero; desde finales del siglo XIX se usaron placas fotográficas, que permitían acumular luz durante horas.\nLa gran diferencia es la eficiencia: una placa fotográfica registraba solo unos pocos fotones de cada cien que le llegaban, mientras que los sensores electrónicos actuales aprovechan más del 90 %. Es como multiplicar por veinte o más la superficie del telescopio."}, {"t": "Cámaras y sensores", "x": "Los sensores modernos, como el CCD inventado en 1969, son una cuadrícula de millones de píxeles. En cada píxel, los fotones arrancan electrones que se acumulan y luego se cuentan: cuantos más electrones, más luz llegó a ese punto.\nUn móvil tiene un sensor de decenas de megapíxeles. La cámara del Observatorio Vera Rubin, en Chile, tiene 3200 megapíxeles: es la cámara digital más grande jamás construida."}, {"t": "Ruido y señal", "x": "Los fotones llegan al azar, como gotas de lluvia, y esa irregularidad crea un ruido inevitable: si llegan unos N fotones, la incertidumbre es de aproximadamente √N, la raíz cuadrada de N. Con 100 fotones el error ronda el 10 %; con 10 000, el 1 %.\nPor eso se hacen exposiciones larguísimas. El Campo Ultraprofundo del Hubble sumó cerca de un millón de segundos, unos 11 días, mirando una pequeña zona del cielo."}]}, {"n": 15, "titulo": "Espectros y composición química", "intro": "Al descomponer la luz de un astro en sus colores aparecen huellas que revelan de qué está hecho, a qué temperatura está y cómo se mueve. Es la herramienta más poderosa de la astrofísica.", "puntos": [{"t": "Espectros continuos", "x": "Un cuerpo caliente y denso, ya sea sólido, líquido o un gas muy compacto, emite luz de todas las longitudes de onda sin saltos: su espectro es una banda continua de colores. La forma de esa banda depende solo de la temperatura.\nEl filamento de una bombilla antigua, a unos 2700 grados, da un espectro continuo con más rojo que azul. El interior denso de una estrella también emite un espectro continuo.", "d": "espectro"}, {"t": "Espectros de emisión", "x": "Un gas poco denso y caliente no emite todos los colores, sino solo algunas longitudes de onda muy concretas. Su espectro muestra líneas brillantes sobre un fondo oscuro: es un espectro de emisión.\nEl hidrógeno caliente emite, entre otras, una línea roja de 656 nanómetros, una azul verdosa de 486 y una violeta de 434. Gustav Kirchhoff y Robert Bunsen estudiaron estos espectros hacia 1860 calentando sustancias en una llama.", "d": "lineas"}, {"t": "Espectros de absorción", "x": "Si la luz de un espectro continuo atraviesa un gas más frío, ese gas absorbe precisamente las longitudes de onda que emitiría si estuviera caliente. Aparece entonces un espectro continuo cruzado por líneas oscuras: un espectro de absorción.\nEs lo que ocurre en las estrellas, cuyas capas exteriores son más frías que las interiores. En 1814 Joseph von Fraunhofer catalogó unas 570 líneas oscuras en el espectro del Sol."}, {"t": "Líneas espectrales", "x": "Cada línea espectral corresponde a una longitud de onda exacta y muy estrecha, medida con gran precisión. El sodio, por ejemplo, produce dos líneas amarillas casi pegadas, a 589,0 y 589,6 nanómetros.\nEl espectro del Sol contiene miles de líneas oscuras, cada una debida a un elemento concreto de su atmósfera. Su posición indica qué elemento las causa, y su intensidad, cuánto hay de él y en qué condiciones se encuentra."}, {"t": "Niveles de energía de los electrones", "x": "Las líneas aparecen porque los electrones de un átomo solo pueden ocupar ciertos niveles de energía. Al saltar de un nivel a otro, el átomo emite o absorbe un fotón cuya energía es justo la diferencia entre ambos niveles, y esa energía fija su longitud de onda.\nEn el hidrógeno, el salto del nivel 3 al 2 da la línea roja de 656 nanómetros, y el del nivel 4 al 2, la azul verdosa de 486."}, {"t": "Huellas químicas", "x": "Cada elemento tiene su propia escalera de niveles y, por tanto, un conjunto de líneas único, como una huella dactilar o un código de barras. Incluso un mismo elemento cambia de huella si ha perdido electrones.\nEn 1835 el filósofo Auguste Comte afirmó que nunca podríamos conocer la composición química de las estrellas. Pocas décadas después, el análisis de sus espectros empezó a hacerlo posible sin salir de la Tierra."}, {"t": "Identificación de elementos", "x": "Comparando las líneas de una estrella con las que producen los elementos en el laboratorio se sabe qué contiene. El Sol, por ejemplo, está formado en masa por un 73 % de hidrógeno y un 25 % de helio.\nEl helio se descubrió precisamente así: en 1868, durante un eclipse, apareció en el espectro solar una línea amarilla de 587,6 nanómetros que no encajaba con ningún elemento conocido. En la Tierra no se aisló hasta 1895."}, {"t": "Temperatura a partir del espectro", "x": "Un cuerpo caliente emite con más intensidad en una longitud de onda que depende de su temperatura: cuanto más caliente, más corta. La ley de Wien lo resume: λ = 2 900 000 / T, con λ en nanómetros y T en kelvin.\nEl Sol, a unos 5800 K, emite sobre todo hacia los 500 nanómetros. Betelgeuse, a unos 3500 K, es rojiza; Rigel, a más de 10 000 K, es blanco azulada."}, {"t": "Movimiento a partir del espectro", "x": "Si una estrella se mueve hacia nosotros o se aleja, todas sus líneas aparecen ligeramente desplazadas respecto a su posición en el laboratorio: hacia el azul si se acerca y hacia el rojo si se aleja. Es el efecto Doppler, que veremos en el próximo tema.\nMidiendo ese desplazamiento se sabe, por ejemplo, que la galaxia de Andrómeda se acerca al Sol a unos 300 kilómetros por segundo."}, {"t": "Límites de la información espectral", "x": "El espectro solo informa de la luz que nos llega, y esta sale de las capas exteriores. Del Sol conocemos bien la composición de su superficie, pero no la de su núcleo, donde la fusión ha acumulado mucho más helio.\nAdemás, en objetos débiles hay poca luz para separarla en colores, las líneas de varios elementos pueden solaparse y convertir líneas en datos exige modelos físicos que pueden contener errores."}]}, {"n": 16, "titulo": "El efecto Doppler", "intro": "Cuando una fuente de ondas se mueve, cambia la frecuencia que percibimos. Este efecto permite medir a qué velocidad se mueven estrellas y galaxias, y llevó a descubrir que el universo se expande.", "puntos": [{"t": "Movimiento relativo", "x": "Todo movimiento se mide respecto a algo. La Tierra gira alrededor del Sol a unos 30 km/s, de modo que una misma estrella se acerca a nosotros en una época del año y se aleja en otra.\nPara el efecto Doppler solo importa el movimiento relativo a lo largo de la línea que une la fuente con el observador: acercarse o alejarse. Un movimiento de lado, perpendicular a esa línea, apenas cambia la onda que recibimos."}, {"t": "Cambio aparente de frecuencia", "x": "Si una fuente de ondas se acerca, cada cresta sale desde un punto un poco más próximo que la anterior: las crestas llegan apretadas y percibimos más frecuencia. Si se aleja, llegan espaciadas y percibimos menos. La fuente emite igual; lo que cambia es lo que recibimos.\nLo propuso Christian Doppler en 1842. Para velocidades pequeñas: Δλ / λ = v / c, con v la velocidad de la fuente y c la de la onda.", "d": "doppler"}, {"t": "Sonido y efecto Doppler", "x": "La sirena de una ambulancia suena más aguda al acercarse y más grave al alejarse. En 1845 Christophorus Buys Ballot lo comprobó con trompetistas que tocaban una nota fija desde un tren en marcha, mientras músicos en el andén escuchaban.\nUn coche a 108 km/h, es decir, 30 m/s, que pita a 400 Hz se oye a unos 438 Hz mientras se acerca y a unos 368 Hz cuando ya se aleja."}, {"t": "Efecto Doppler en la luz", "x": "Con la luz ocurre lo mismo, pero el efecto es minúsculo salvo a velocidades enormes, porque la luz es rapidísima. Un coche a 30 m/s solo cambia el color de sus faros en una diezmillonésima.\nUna estrella que se mueve a 30 km/s desplaza su línea roja del hidrógeno, de 656,3 nanómetros, en unos 0,07 nanómetros. Es imperceptible a simple vista, pero los espectrógrafos actuales miden desplazamientos mucho menores."}, {"t": "Corrimiento al rojo", "x": "Cuando una fuente se aleja, todas sus líneas espectrales se desplazan hacia longitudes de onda mayores, hacia el rojo. No significa que el objeto se vea rojo: todo su espectro se desplaza a la vez. Se mide con z = Δλ / λ, el cambio de longitud de onda dividido entre la original.\nEn 1963 Maarten Schmidt midió en el objeto lejano 3C 273 líneas un 15,8 % más largas de lo normal: z = 0,158."}, {"t": "Corrimiento al azul", "x": "Cuando una fuente se acerca, sus líneas espectrales se desplazan hacia longitudes de onda menores, hacia el azul. Es el corrimiento al azul.\nEn 1912 Vesto Slipher midió que la galaxia de Andrómeda, nuestra gran vecina a unos 2,5 millones de años luz, se acerca al Sol a unos 300 km/s. Es una excepción: casi todas las demás galaxias muestran corrimiento al rojo, como descubrió el propio Slipher en los años siguientes."}, {"t": "Velocidad radial", "x": "La velocidad radial es la parte del movimiento de un astro dirigida hacia nosotros o en sentido contrario. Es la única que mide el efecto Doppler; la de lado requiere otros métodos.\nCon ella se descubrió en 1995 el primer planeta alrededor de una estrella como el Sol, 51 Pegasi b: su tirón hace que la estrella se acerque y se aleje periódicamente a unos 56 m/s, unos 200 km/h."}, {"t": "Movimiento de estrellas y galaxias", "x": "El efecto Doppler revela movimientos invisibles. Cuando dos estrellas giran una alrededor de la otra demasiado juntas para verlas por separado, sus líneas se desplazan alternando hacia el rojo y hacia el azul. Así se descubrió en 1889 que Mizar A, en la Osa Mayor, está formada en realidad por dos estrellas.\nEn una galaxia que gira, un lado se acerca y el otro se aleja, y eso permite medir su rotación."}, {"t": "Expansión del universo", "x": "En 1929 Edwin Hubble, apoyándose en trabajos como el de Georges Lemaître de 1927, mostró que las galaxias se alejan más deprisa cuanto más lejos están: v = H · d, con v la velocidad, d la distancia y H un valor cercano a 70 km/s por cada 3,26 millones de años luz.\nUn año luz es lo que recorre la luz en un año, unos 9,5 billones de kilómetros. No es que las galaxias huyan por el espacio: el propio espacio se estira.", "d": "expansion"}]}, {"n": 17, "titulo": "La gravedad", "intro": "La gravedad es la fuerza que da forma al cosmos: mantiene unidos los planetas, las estrellas y las galaxias. Veremos de qué depende, cómo se calcula y por qué causa las mareas.", "puntos": [{"t": "Gravedad y masa", "x": "Todos los cuerpos con masa se atraen. Esa atracción, la gravedad, es mayor cuanto más masa tienen los cuerpos. Entre dos personas de 70 kilos separadas un metro es de apenas 0,0000003 newtons, imperceptible.\nPero la Tierra tiene 5,97·10²⁴ kilos, y su atracción nos mantiene en el suelo. La gravedad es la más débil de las fuerzas fundamentales, pero siempre atrae y alcanza distancias enormes: por eso domina el universo a gran escala."}, {"t": "Masa y peso", "x": "La masa mide la cantidad de materia y no cambia de un lugar a otro; se mide en kilos. El peso es la fuerza con que la gravedad atrae esa masa: P = m · g, con m la masa y g la aceleración de la gravedad del lugar. Se mide en newtons.\nUna persona de 70 kilos pesa unos 690 newtons en la Tierra y unos 113 en la Luna, la sexta parte, pero sigue teniendo 70 kilos de masa."}, {"t": "Campo gravitatorio", "x": "Cada masa crea a su alrededor un campo gravitatorio: una propiedad del espacio por la que cualquier otra masa situada allí sufre una fuerza. Su intensidad, g, se mide en newtons por kilo, que equivale a metros por segundo al cuadrado.\nEn la superficie terrestre vale 9,8. A 400 kilómetros de altura, donde orbita la Estación Espacial Internacional, aún vale cerca de 8,7: los astronautas flotan, pero no porque allí no haya gravedad."}, {"t": "Ley de gravitación universal", "x": "Isaac Newton la publicó en 1687: F = G · M · m / d², donde F es la fuerza, M y m las masas, d la distancia entre sus centros y G una constante que vale 6,67·10⁻¹¹ en unidades del sistema internacional.\nEs universal porque la misma ley explica la caída de una manzana y el movimiento de la Luna. Entre la Tierra y la Luna la fuerza es de unos 2·10²⁰ newtons."}, {"t": "Distancia y fuerza gravitatoria", "x": "La gravedad disminuye con el cuadrado de la distancia: si la distancia se duplica, la fuerza se reduce a la cuarta parte; si se triplica, a la novena parte.\nNewton lo comprobó con la Luna, que está unas 60 veces más lejos del centro de la Tierra que nosotros. Su aceleración hacia la Tierra debía ser 60 × 60 = 3600 veces menor que en la superficie: 9,8 / 3600 = 0,0027 m/s², justo lo que se observa."}, {"t": "Aceleración gravitatoria", "x": "Sin aire, todos los cuerpos caen con la misma aceleración, sea cual sea su masa: un objeto con más masa sufre más fuerza, pero también cuesta más acelerarlo. Esa aceleración vale g = G · M / R², con M la masa del planeta y R su radio. En la Tierra es 9,8 m/s².\nEn 1971 el astronauta David Scott, del Apolo 15, dejó caer en la Luna un martillo y una pluma: llegaron al suelo a la vez."}, {"t": "Gravedad en distintos planetas", "x": "La gravedad en la superficie depende de la masa del planeta y de su radio. En la Luna es de 1,6 m/s²; en Marte y en Mercurio, de unos 3,7; en Venus, de 8,9; en Júpiter, de unos 24,8 en lo alto de sus nubes.\nUna persona de 70 kilos se sentiría en Marte como si tuviera 26. Saturno tiene 95 veces la masa de la Tierra, pero por su enorme tamaño su gravedad es parecida: unos 10,4 m/s²."}, {"t": "Velocidad de escape", "x": "La velocidad de escape es la mínima con la que hay que lanzar un objeto para que se aleje de un astro para siempre, sin más impulso. Se calcula con v = √(2 · G · M / R), con M la masa y R el radio del astro.\nEn la Tierra es de 11,2 km/s; en la Luna, de solo 2,4 km/s, una de las razones por las que no retiene atmósfera. En Júpiter es de 59,5 km/s; en el Sol, de 618."}, {"t": "Mareas", "x": "La Luna atrae con más fuerza la cara de la Tierra más cercana a ella que la opuesta. Esa diferencia estira el planeta y forma dos abultamientos en los océanos, uno a cada lado. Al girar la Tierra pasamos por ambos: hay dos pleamares cada 24 horas y 50 minutos.\nEl Sol añade un efecto algo menor que la mitad del lunar; con luna nueva o llena se suman y las mareas son mayores."}, {"t": "Fuerzas de marea", "x": "Una fuerza de marea es la diferencia de gravedad entre dos partes de un mismo cuerpo, que tiende a estirarlo. Es muy intensa cerca de un astro masivo y disminuye rápidamente co
