n la distancia.\nEn 1992 Júpiter partió el cometa Shoemaker-Levy 9 en más de veinte fragmentos, que chocaron contra el planeta en 1994. Las mareas que Júpiter provoca en su luna Ío la calientan tanto que es el cuerpo con más volcanes activos del sistema solar."}]}, {"n": 18, "titulo": "Órbitas", "intro": "Una órbita es el resultado de combinar la inercia con la gravedad. Entenderlas explica el movimiento de lunas, planetas y satélites, y permite enviar naves por el sistema solar.", "puntos": [{"t": "Inercia y gravedad", "x": "Por inercia, un cuerpo en movimiento seguiría en línea recta si nada lo desviara. La gravedad tira de él constantemente hacia el astro central y curva su trayectoria. Una órbita es el equilibrio entre ambas tendencias.\nLa Luna avanza a 1 km/s. Sin la Tierra, escaparía en línea recta; con ella, en cada segundo se desvía hacia nosotros apenas 1,4 milímetros respecto a esa recta, lo justo para dar la vuelta."}, {"t": "Caída continua", "x": "Newton imaginó un cañón en lo alto de una montaña. Cuanto más rápido dispara, más lejos cae la bala. Si fuera lo bastante rápida, el suelo se curvaría hacia abajo tan deprisa como ella cae, y nunca llegaría a tocarlo.\nJunto a la superficie terrestre, sin aire, esa velocidad es de unos 7,9 km/s. Un satélite en órbita está cayendo todo el tiempo; por eso los astronautas flotan dentro de la nave.", "d": "orbita"}, {"t": "Órbitas circulares", "x": "En una órbita circular la distancia al astro central y la velocidad no cambian. La velocidad necesaria es v = √(G · M / r), donde M es la masa del astro central y r la distancia a su centro: cuanto más cerca, más rápido hay que ir.\nLa Estación Espacial Internacional, a unos 400 kilómetros de altura, sigue una órbita casi circular a unos 7,7 km/s y da una vuelta a la Tierra cada 92 minutos."}, {"t": "Órbitas elípticas", "x": "En general las órbitas son elipses, círculos alargados, y el astro central ocupa uno de sus focos, no el centro. El punto más cercano al Sol se llama perihelio y el más lejano, afelio.\nLa órbita de la Tierra es casi circular: hacia el 3 de enero está a unos 147 millones de kilómetros del Sol y hacia el 4 de julio, a unos 152. El cometa Halley, en cambio, va desde dentro de la órbita de Venus hasta más allá de la de Neptuno."}, {"t": "Velocidad orbital", "x": "Cuanto más cerca está un planeta del Sol, más deprisa recorre su órbita, porque la gravedad allí es más intensa. Mercurio va a unos 47 km/s, la Tierra a unos 30 y Neptuno a solo 5,4.\nEn una órbita elíptica la velocidad también varía a lo largo del recorrido: la Tierra va a unos 30,3 km/s en el perihelio, en enero, y a unos 29,3 km/s en el afelio, en julio."}, {"t": "Altura y periodo orbital", "x": "El periodo orbital es el tiempo que se tarda en dar una vuelta completa. Cuanto más alta es la órbita, más largo es: el recorrido es mayor y, además, la velocidad es menor.\nLa Estación Espacial, a 400 kilómetros, da una vuelta cada 92 minutos. Los satélites GPS, a unos 20 200 kilómetros, tardan casi 12 horas. La Luna, a unos 384 000 kilómetros, tarda 27,3 días."}, {"t": "Las leyes de Kepler", "x": "Johannes Kepler las dedujo entre 1609 y 1619 a partir de las observaciones de Tycho Brahe. Primera: los planetas siguen elipses con el Sol en un foco. Segunda: la línea Sol-planeta barre áreas iguales en tiempos iguales. Tercera: T² = a³, con T el periodo en años y a el tamaño medio de la órbita en unidades astronómicas (150 millones de km).\nJúpiter está a 5,2 unidades y tarda 11,9 años.", "d": "sistema"}, {"t": "Órbitas de satélites", "x": "Desde el Sputnik 1, lanzado en 1957, se han puesto en órbita miles de satélites; hoy funcionan más de diez mil. La mayoría está en órbita baja, entre unos 300 y 2000 kilómetros: allí están la Estación Espacial y el telescopio Hubble, a algo más de 500 kilómetros.\nLos de navegación, como GPS o Galileo, van a entre 20 000 y 23 000 kilómetros. Muchos de observación terrestre usan órbitas polares, que pasan sobre toda la Tierra."}, {"t": "Órbitas geoestacionarias", "x": "A 35 786 kilómetros sobre el ecuador, un satélite tarda en dar la vuelta lo mismo que la Tierra en girar sobre sí misma, unas 23 horas y 56 minutos. Visto desde el suelo, parece inmóvil en el cielo.\nPor eso las antenas de televisión por satélite apuntan siempre al mismo punto, y los satélites meteorológicos vigilan sin pausa la misma zona. Una señal tarda casi un cuarto de segundo en subir y bajar."}, {"t": "Transferencias orbitales", "x": "Para pasar de una órbita a otra, una nave enciende sus motores en momentos precisos. El método más eficiente entre dos órbitas circulares lo propuso Walter Hohmann en 1925: un encendido inicia una elipse que toca ambas órbitas y otro, al llegar, la circulariza.\nAsí se viaja de la Tierra a Marte en unos siete a nueve meses. El róver Perseverance despegó en julio de 2020 y aterrizó en febrero de 2021."}]}, {"n": 19, "titulo": "Sistemas de varios cuerpos", "intro": "Hasta ahora hemos visto un planeta girando alrededor de una estrella. El universo real está lleno de muchos cuerpos que se atraen a la vez, y entender esos sistemas explica la forma y la historia del sistema solar.", "puntos": [{"t": "Interacción entre dos cuerpos", "x": "Cuando solo hay dos cuerpos, cada uno atrae al otro con la misma fuerza y ambos giran alrededor de un punto común. Newton demostró que este caso tiene solución exacta: las órbitas son elipses que se repiten siempre igual.\nLa Tierra y la Luna son un buen ejemplo. La Luna tiene unas 81 veces menos masa que la Tierra, así que es ella la que describe casi todo el movimiento, aunque la Tierra también se balancea un poco."}, {"t": "Interacción entre tres o más cuerpos", "x": "Con tres cuerpos o más, cada uno tira de todos los demás y las órbitas dejan de ser elipses perfectas. No existe una fórmula general que lo resuelva: hay que calcular el movimiento paso a paso con ordenadores.\nEstas pequeñas desviaciones, llamadas perturbaciones, son útiles. En 1846, Urbain Le Verrier estudió las irregularidades de la órbita de Urano, predijo dónde debía estar un planeta desconocido y Johann Galle encontró Neptuno a menos de un grado de esa posición."}, {"t": "Centro de masas", "x": "El centro de masas es el punto de equilibrio de un sistema: el lugar alrededor del cual giran realmente los cuerpos. Está más cerca del cuerpo de mayor masa, como el punto de apoyo de un balancín con un adulto y un niño.\nEl de la Tierra y la Luna está a unos 4700 km del centro terrestre, dentro de la Tierra, cuyo radio es de 6371 km. El del Sol y Júpiter queda ligeramente fuera de la superficie del Sol.", "d": "orbita"}, {"t": "Puntos de Lagrange", "x": "En un sistema de dos cuerpos grandes hay cinco lugares, llamados L1 a L5, donde un objeto pequeño puede mantenerse en la misma posición respecto a ambos, porque las atracciones y el giro se compensan.\nEl Sol y la Tierra tienen dos de ellos a 1,5 millones de km de nosotros, unas cuatro veces la distancia a la Luna. En L1, hacia el Sol, trabaja el observatorio SOHO desde 1996. En L2, en dirección contraria, está el telescopio James Webb, lanzado en diciembre de 2021."}, {"t": "Resonancias orbitales", "x": "Hay resonancia cuando los periodos orbitales de dos cuerpos guardan una proporción sencilla, como 1:2 o 2:3. Los empujones gravitatorios se repiten siempre en el mismo punto de la órbita y se van sumando, como al empujar un columpio en el momento justo.\nLas lunas de Júpiter Ío, Europa y Ganímedes están en resonancia 1:2:4: mientras Ganímedes da una vuelta, Europa da dos e Ío cuatro. Plutón da dos vueltas al Sol por cada tres de Neptuno."}, {"t": "Estabilidad orbital", "x": "Una órbita es estable si se mantiene parecida durante mucho tiempo, aunque reciba pequeñas perturbaciones. Las resonancias pueden estabilizar una órbita o, al contrario, ir deformándola hasta expulsar al cuerpo.\nEl sistema solar es estable en conjunto, pero no de forma absoluta. Las simulaciones por ordenador indican que hay en torno a un 1 % de probabilidad de que la órbita de Mercurio se vuelva muy alargada en los próximos 5000 millones de años."}, {"t": "Caos determinista", "x": "Un sistema es caótico cuando sigue leyes exactas, sin azar, pero una diferencia minúscula en el punto de partida crece hasta cambiar por completo el resultado. Por eso es determinista y, aun así, imprevisible a largo plazo.\nLas posiciones de los planetas se pueden calcular con gran precisión para miles de años, pero no más allá de unas decenas de millones de años. La luna Hiperión, de Saturno, es un caso extremo: su rotación cambia de forma caótica de una órbita a otra."}, {"t": "Asteroides troyanos", "x": "Los asteroides troyanos comparten la órbita de un planeta y se agrupan en sus puntos de Lagrange L4 y L5, situados 60 grados por delante y por detrás de él. Allí permanecen estables durante miles de millones de años.\nJúpiter tiene más de 10 000 troyanos conocidos, divididos en dos enjambres. La sonda Lucy, lanzada por la NASA en octubre de 2021, está en camino para visitar varios de ellos. La Tierra también tiene alguno, como 2010 TK7, de unos cientos de metros."}, {"t": "Sistemas planetarios complejos", "x": "Hoy conocemos miles de exoplanetas, es decir, planetas que giran alrededor de otras estrellas, y muchos sistemas son muy distintos del nuestro: planetas muy juntos, órbitas muy alargadas o varias estrellas.\nLa estrella TRAPPIST-1, a unos 40 años luz (la distancia que recorre la luz en 40 años), tiene siete planetas rocosos, todos más cerca de ella que Mercurio del Sol, encadenados en resonancias. Y el planeta Kepler-16b, descubierto en 2011, gira alrededor de dos estrellas a la vez."}]}, {"n": 20, "titulo": "Relatividad especial", "intro": "En 1905 Albert Einstein cambió nuestra idea del espacio y del tiempo. La relatividad especial explica qué ocurre cerca de la velocidad de la luz y por qué la masa es una forma de energía, la clave del brillo de las estrellas.", "puntos": [{"t": "Límites de la física clásica", "x": "La física de Newton funciona de maravilla para coches, aviones y planetas. Pero a finales del siglo XIX aparecieron problemas: en 1887, Michelson y Morley intentaron medir cómo cambiaba la velocidad de la luz con el movimiento de la Tierra y no encontraron ninguna diferencia.\nLas leyes clásicas no podían explicarlo. En 1905, Einstein propuso una nueva teoría que coincide con la de Newton a velocidades bajas, pero que la corrige cuando nos acercamos a la velocidad de la luz."}, {"t": "Relatividad del movimiento", "x": "No existe un reposo absoluto: todo movimiento se mide respecto a algo. Si viajas en un tren que avanza suave y recto, una pelota cae a tus pies igual que en la estación. Las leyes de la física son las mismas para cualquier observador que se mueva a velocidad constante.\nPor eso no notamos que la Tierra gira alrededor del Sol a unos 30 km por segundo: sin una referencia exterior, ningún experimento interior puede detectar ese movimiento uniforme."}, {"t": "Velocidad de la luz", "x": "En el vacío, la luz viaja a 299 792 km por segundo, una cantidad que se representa con la letra c. Einstein añadió una idea sorprendente: todos los observadores miden ese mismo valor, se muevan como se muevan respecto a la fuente de luz.\nAdemás, ningún objeto con masa puede alcanzarla. La luz del Sol tarda unos 8 minutos y 20 segundos en llegar a la Tierra, y la de la Luna, algo más de un segundo."}, {"t": "Simultaneidad", "x": "Dos sucesos simultáneos para un observador pueden no serlo para otro que se mueve respecto a él. Si dos rayos caen a la vez en los extremos de un tren según alguien en el andén, un pasajero que avanza hacia la parte delantera verá llegar antes la luz de ese rayo.\nNo es un engaño de la vista: el orden en el tiempo depende del observador. A velocidades de tren la diferencia es mínima, del orden de 10⁻¹³ segundos, pero es real."}, {"t": "Dilatación temporal", "x": "Un reloj que se mueve respecto a nosotros avanza más despacio que los nuestros. A velocidades cotidianas el efecto es inapreciable, pero cerca de c es enorme: al 99,5 % de la velocidad de la luz, el reloj va unas 10 veces más lento.\nLos muones son partículas que se crean a unos 15 km de altura y viven solo 2,2 millonésimas de segundo. Sin este efecto recorrerían unos 660 metros antes de desaparecer; gracias a él, muchos llegan al suelo."}, {"t": "Contracción de longitudes", "x": "Un objeto en movimiento se mide más corto en la dirección en que se mueve, en la misma proporción en que su reloj se retrasa. No es una compresión física: es el espacio medido por otro observador el que cambia.\nVolvamos a los muones. Para nosotros, su reloj va 10 veces más lento. Para el muon, en cambio, son los 15 km de atmósfera los que se acortan a solo 1,5 km, y por eso le da tiempo a cruzarlos. Ambas descripciones coinciden."}, {"t": "Masa y energía", "x": "La relatividad muestra que la masa y la energía son dos caras de la misma cosa. Cuanto más rápido va un objeto, más energía tiene y más cuesta acelerarlo un poco más; por eso nunca llega a la velocidad de la luz, por mucha energía que le demos.\nEn el acelerador LHC, en Suiza y Francia, cada protón alcanza el 99,999999 % de c y lleva una energía más de 7000 veces mayor que la que corresponde a su masa en reposo."}, {"t": "E = mc²", "x": "La fórmula más famosa de la física dice cuánta energía contiene una masa: E = m·c², donde E es la energía en julios, m la masa en kilos y c la velocidad de la luz en metros por segundo. Como c es enorme, poca masa equivale a muchísima energía.\nUn solo kilo de materia equivale a 9·10¹⁶ julios, más de lo que da una gran central eléctrica en un año. El Sol convierte en energía unos 4 millones de toneladas de su masa cada segundo.", "d": "potencias"}, {"t": "Viajes relativistas", "x": "Para quien viaja cerca de c, el tiempo transcurre más despacio. La estrella más cercana, Próxima Centauri, está a 4,24 años luz. Una nave al 90 % de la velocidad de la luz tardaría 4,7 años según los relojes de la Tierra, pero sus tripulantes solo envejecerían unos 2 años.\nHoy estamos muy lejos de eso. El objeto más rápido construido, la sonda Parker Solar Probe, llega a unos 190 km por segundo: apenas un 0,06 % de c."}, {"t": "Paradojas y experimentos mentales", "x": "Einstein razonaba con experimentos mentales: situaciones imaginadas para ver qué predice una teoría. El más conocido es la paradoja de los gemelos: uno viaja muy rápido y, al volver, es más joven que su hermano. No hay contradicción, porque el viajero frena y da la vuelta, y su situación no es simétrica.\nEn 1971, Hafele y Keating llevaron relojes atómicos en aviones alrededor del mundo y, al compararlos, midieron diferencias de decenas y cientos de milmillonésimas de segundo, como predecía la teoría."}]}, {"n": 21, "titulo": "Relatividad general", "intro": "Diez años después de la relatividad especial, Einstein dio una nueva explicación de la gravedad: la masa curva el espacio y el tiempo. Esta teoría es imprescindible para entender agujeros negros, lentes cósmicas y el propio universo.", "puntos": [{"t": "Gravedad como geometría", "x": "En 1915, Einstein propuso que la gravedad no es una fuerza que tira a distancia, sino una deformación del espacio y del tiempo producida por la masa. Los cuerpos libres siguen el camino más recto posible en ese espacio deformado: eso vemos como caída u órbita.\nUna pista: en caída libre no se nota el peso. Los astronautas de la Estación Espacial, a unos 400 km de altura, flotan aunque allí la gravedad es casi el 90 % de la del suelo."}, {"t": "Espacio-tiempo", "x": "La relatividad une espacio y tiempo en una sola entidad de cuatro dimensiones: tres para el lugar y una para el momento. Un suceso queda fijado con cuatro datos, igual que para quedar con alguien hace falta dirección, piso y hora.\nEn el espacio-tiempo, mirar lejos es mirar atrás. La supernova 1987A, una estrella que explotó en la Gran Nube de Magallanes, a unos 168 000 años luz, se vio en 1987, pero el suceso ocurrió unos 168 000 años antes."}, {"t": "Curvatura", "x": "La masa curva el espacio-tiempo, y cuanto más masa y más concentrada, mayor es la curvatura. Se compara con una bola pesada que hunde una lámina elástica y desvía las canicas cercanas.\nIncluso la luz sigue esa curvatura. La luz de una estrella que roza el Sol se desvía 1,75 segundos de arco, lo que mide una moneda de un euro vista a casi 3 km. El eclipse del 29 de mayo de 1919 permitió medirlo y confirmó la predicción de Einstein.", "d": "espaciotiempo"}, {"t": "Movimiento de los planetas", "x": "Para planetas lejanos del Sol, la relatividad general da casi lo mismo que Newton. Las diferencias aparecen donde la gravedad es más intensa, como cerca del Sol.\nLa órbita de Mercurio es una elipse que gira lentamente. Casi todo ese giro se explica por los tirones de los otros planetas, pero sobraban 43 segundos de arco por siglo que la física de Newton no podía explicar. En 1915, Einstein calculó con su teoría exactamente esa cantidad."}, {"t": "Dilatación temporal gravitatoria", "x": "El tiempo transcurre más despacio cerca de una masa grande. Un reloj en el suelo avanza un poco más lento que otro situado a gran altura, donde la gravedad es más débil.\nLos satélites GPS orbitan a unos 20 200 km. Por la menor gravedad, sus relojes se adelantan unas 45 millonésimas de segundo al día, y por su velocidad se retrasan unas 7. Si no se corrigieran esas 38 millonésimas, el error de posición crecería unos 10 km cada día."}, {"t": "Lentes gravitacionales", "x": "Una gran masa, como una galaxia, curva la luz de los objetos que hay detrás y actúa como una lente: puede amplificar su brillo, deformarlo en arcos o mostrar varias imágenes del mismo objeto.\nEn 1979 se descubrió el primer caso: el «cuásar doble» Q0957+561, dos imágenes de un mismo objeto muy lejano separadas por unos 6 segundos de arco. La luz de cada imagen recorre un camino distinto alrededor de la galaxia que hace de lente."}, {"t": "Ondas gravitacionales", "x": "Cuando grandes masas se mueven con violencia, sacuden el espacio-tiempo y generan ondas que viajan a la velocidad de la luz y estiran y encogen levemente lo que atraviesan.\nEl 14 de septiembre de 2015, los detectores LIGO captaron la primera: dos agujeros negros, objetos tan compactos que ni la luz escapa de ellos, de unas 36 y 29 masas solares, que se fusionaron a unos 1300 millones de años luz. Sus brazos de 4 km variaron menos que el tamaño de un protón.", "d": "onda"}, {"t": "Diferencias entre la descripción de Newton y la de Einstein", "x": "Para Newton, la gravedad es una fuerza que actúa al instante a cualquier distancia, en un espacio y un tiempo fijos. Para Einstein, es la geometría del espacio-tiempo, y sus cambios se propagan a la velocidad de la luz.\nSi el Sol desapareciera, según Newton la Tierra lo notaría al instante; según Einstein, a los 8 minutos y 20 segundos. Aun así, la física de Newton sigue siendo excelente cuando la gravedad es débil: con ella se calcularon las trayectorias de las misiones Apolo."}, {"t": "Límites de la relatividad", "x": "La relatividad general ha superado todas las pruebas, desde los relojes del GPS hasta la imagen del entorno del agujero negro de la galaxia M87, obtenida en 2019. Pero no es la última palabra.\nNo encaja con la física cuántica, que describe lo muy pequeño. Ambas teorías chocan donde la materia está concentrada al extremo, como en el centro de un agujero negro o en el primer instante del universo. Allí sus ecuaciones dan valores infinitos, señal de que falta una teoría más completa."}]}, {"n": 22, "titulo": "Formación del sistema solar", "intro": "El Sol, los planetas y todo lo que gira a su alrededor nacieron juntos hace unos 4600 millones de años a partir de una nube de gas y polvo. Conocer ese proceso nos ayuda a entender cómo nacen las estrellas y sus planetas en todo el universo.", "puntos": [{"t": "Nubes de gas y polvo", "x": "Entre las estrellas hay enormes nubes muy frías y poco densas, formadas sobre todo por hidrógeno y helio, con pequeños granos de polvo de silicatos, carbono y hielo. En su interior la temperatura ronda los 10 a 20 grados sobre el cero absoluto, es decir, unos 260 °C bajo cero.\nNuestro sistema solar se formó en una nube así hace unos 4600 millones de años. Hoy vemos nacer estrellas en nubes parecidas, como la nebulosa de Orión, a unos 1300 años luz."}, {"t": "Colapso gravitatorio", "x": "Si una región de la nube se vuelve lo bastante densa, su propia gravedad vence a la presión del gas y empieza a contraerse. Al encogerse, gira cada vez más rápido, como una patinadora que recoge los brazos.\nEl empujón inicial pudo venir de una supernova, la explosión de una estrella de gran masa. En algunos meteoritos hay restos de aluminio-26 y hierro-60, átomos radiactivos de vida corta que se fabrican en estrellas así y que llegaron a la nube poco antes del colapso."}, {"t": "Disco protoplanetario", "x": "Al girar y contraerse, la nube se aplana y forma un disco de gas y polvo alrededor de la estrella que nace en el centro, como una masa de pizza que se ensancha al darle vueltas. En ese disco se formarán los planetas.\nHoy los vemos alrededor de estrellas jóvenes. En 2014, el radiotelescopio ALMA fotografió el disco de HL Tauri, a unos 450 años luz, con anillos y huecos que probablemente están abriendo planetas en formación."}, {"t": "Formación del Sol", "x": "Casi toda la materia cayó hacia el centro: el Sol reúne el 99,86 % de la masa del sistema solar. Al comprimirse, el gas se calentó, igual que se calienta el aire en una bomba de bicicleta.\nDurante unas decenas de millones de años, el joven Sol brilló gracias a esa contracción. Cuando su centro alcanzó millones de grados empezó la fusión nuclear, la unión de núcleos de hidrógeno para formar helio. Hoy su núcleo está a unos 15 millones de grados.", "d": "sol"}, {"t": "Acreción", "x": "La acreción es el crecimiento de un cuerpo por acumulación de materia. En el disco, los granos de polvo, de una milésima de milímetro, chocaban suavemente y se quedaban pegados por fuerzas eléctricas, como las pelusas de polvo que se forman bajo un mueble.\nAsí se formaron agregados cada vez mayores, del tamaño de guijarros. Al alcanzar cierta masa, su propia gravedad empezó a atraer más material, y el crecimiento se aceleró."}, {"t": "Planetesimales", "x": "Los planetesimales son los ladrillos de los planetas: cuerpos de roca y hielo de entre un kilómetro y unos cientos de kilómetros, lo bastante grandes para atraerse por gravedad. Muchos se fusionaron, pero algunos han sobrevivido casi intactos.\nEl 1 de enero de 2019, la sonda New Horizons pasó junto a Arrokoth, un cuerpo helado de unos 36 km situado más allá de Neptuno. Está formado por dos lóbulos que se unieron suavemente, tal como predice este modelo."}, {"t": "Protoplanetas", "x": "Los planetesimales chocaron y se fusionaron hasta formar protoplanetas, embriones de planeta de cientos o miles de kilómetros. En las zonas interiores, unas decenas de ellos acabaron dando lugar a los planetas rocosos tras grandes choques.\nEl asteroide Vesta, de unos 525 km, es un protoplaneta superviviente que la sonda Dawn estudió en 2011 y 2012. Se cree que la Luna nació cuando un protoplaneta del tamaño de Marte chocó con la joven Tierra."}, {"t": "Migración planetaria", "x": "Los planetas no siempre se quedaron donde nacieron. Su interacción gravitatoria con el gas del disco y con miles de planetesimales pudo desplazar sus órbitas hacia dentro o hacia fuera, un proceso llamado migración.\nLos modelos indican que Neptuno se formó más cerca del Sol y se fue alejando. La resonancia 3:2 de Plutón con Neptuno sería una huella de ese viaje: Neptuno lo habría arrastrado consigo hacia fuera. Los detalles de estos modelos todavía se debaten."}, {"t": "Bombardeo inicial", "x": "Tras formarse los planetas, quedaron muchos planetesimales sueltos que chocaron contra ellos durante cientos de millones de años. La Tierra borró casi todas sus cicatrices, pero la Luna, sin agua ni viento, las conserva.\nLas rocas lunares traídas por las misiones Apolo entre 1969 y 1972 muestran que muchos impactos grandes ocurrieron hace unos 3900 millones de años. Hoy se discute si fue un pico de choques o el final de un bombardeo que fue disminuyendo."}, {"t": "Evidencias de la formación del sistema solar", "x": "Todos los planetas giran alrededor del Sol en el mismo sentido y casi en el mismo plano, como esperaríamos si nacieron de un disco. Además, vemos discos parecidos alrededor de estrellas jóvenes.\nLos meteoritos guardan los sólidos más antiguos conocidos, de hace 4567 millones de años. Y las sondas han traído muestras de asteroides: Hayabusa2, de Ryugu, en 2020, y OSIRIS-REx, de Bennu, en 2023. Su composición confirma que son restos casi intactos de aquella época."}]}, {"n": 23, "titulo": "El Sol", "intro": "El Sol es una estrella corriente, pero es la única que podemos estudiar de cerca. Entender cómo funciona es la puerta de entrada para comprender todas las demás estrellas del universo.", "puntos": [{"t": "Estructura del Sol", "x": "El Sol es una enorme esfera de plasma: gas tan caliente que los átomos han perdido sus electrones. Tiene un radio de unos 696 000 km, 109 veces el de la Tierra, y una masa 333 000 veces mayor que la terrestre.\nEstá organizado en capas. Desde dentro hacia fuera: el núcleo, donde se produce la energía; la zona radiativa y la zona convectiva, que la transportan; y la atmósfera, formada por la fotosfera, la cromosfera y la corona.", "d": "sol"}, {"t": "Núcleo", "x": "El núcleo ocupa la cuarta parte central del radio del Sol. Allí la temperatura es de unos 15 millones de grados y la densidad unas 150 veces la del agua. En esas condiciones, los núcleos de hidrógeno se fusionan para formar helio.\nCada segundo, el Sol transforma unos 600 millones de toneladas de hidrógeno. Unos 4 millones de toneladas desaparecen como masa y se convierten en energía, según E = m·c². Esa energía es la que acabará llegando a la Tierra como luz."}, {"t": "Zona radiativa", "x": "Desde el borde del núcleo hasta el 70 % del radio, la energía viaja en forma de luz. Pero el gas es tan denso que cada fotón, cada partícula de luz, choca enseguida, es absorbido y vuelve a emitirse en cualquier dirección, como alguien que intenta cruzar una multitud.\nPor eso, aunque la luz es lo más rápido que existe, la energía tarda entre decenas de miles y cientos de miles de años en atravesar esta capa, según las estimaciones."}, {"t": "Zona convectiva", "x": "En el 30 % exterior del Sol, la energía ya no avanza como luz, sino por convección: el gas caliente sube, se enfría al llegar arriba y vuelve a hundirse, igual que el agua en una olla al fuego. Esta capa tiene unos 200 000 km de grosor.\nEn la superficie se ven las cimas de esas corrientes como granos brillantes rodeados de bordes oscuros. Cada gránulo mide unos 1000 km y dura solo unos minutos antes de ser sustituido por otro."}, {"t": "Fotosfera", "x": "La fotosfera es la capa que vemos, la «superficie» del Sol, aunque no es sólida. Mide unos pocos cientos de kilómetros de grosor y está a unos 5500 °C. De ella sale casi toda la luz que nos llega, tras unos 8 minutos y 20 segundos de viaje.\nVista con filtros adecuados, se aprecia más oscura en los bordes que en el centro. Nunca debe mirarse el Sol directamente ni con prismáticos o telescopios sin un filtro solar homologado."}, {"t": "Cromosfera", "x": "Por encima de la fotosfera está la cromosfera, una capa de unos 2000 km de grosor. Su nombre significa «esfera de color», porque durante los eclipses totales aparece como un fino anillo rojizo, el color que emite el hidrógeno.\nEn ella la temperatura empieza a subir otra vez con la altura, desde unos 4000 °C hasta decenas de miles de grados. Está llena de chorros finos de gas, llamados espículas, que suben miles de kilómetros y caen en pocos minutos."}, {"t": "Corona", "x": "La corona es la atmósfera exterior del Sol y se extiende millones de kilómetros. Es muy tenue, por lo que solo se ve a simple vista en un eclipse total, como un halo blanco. Lo sorprendente es su temperatura: entre 1 y 3 millones de grados, mucho más que la superficie.\nTodavía no sabemos bien por qué está tan caliente. Para estudiarlo, la sonda Parker Solar Probe atravesó la corona en diciembre de 2024 a solo 6,1 millones de km de la superficie solar."}, {"t": "Manchas solares", "x": "Las manchas solares son zonas de la fotosfera donde campos magnéticos muy intensos frenan la convección y llega menos calor desde dentro. Están a unos 3500 °C, unos 2000 grados menos que su entorno, y por contraste parecen oscuras.\nMuchas son más grandes que la Tierra y duran de días a semanas. Galileo las observó con telescopio hacia 1610 y, siguiéndolas, comprobó que el Sol gira: en el ecuador tarda unos 25 días en dar una vuelta."}, {"t": "Erupciones y viento solar", "x": "Cuando los campos magnéticos de la corona se reorganizan, liberan energía de golpe en forma de fulguraciones, destellos de luz y partículas, y a veces lanzan al espacio miles de millones de toneladas de plasma. Además, el Sol expulsa siempre un flujo de partículas, el viento solar, a entre 400 y 800 km por segundo.\nAl llegar a la Tierra pueden causar tormentas magnéticas y auroras. En mayo de 2024 una tormenta intensa hizo visibles auroras en latitudes donde casi nunca se ven."}, {"t": "Actividad solar", "x": "La actividad del Sol sube y baja en un ciclo de unos 11 años. En el máximo hay muchas manchas y erupciones; en el mínimo, casi ninguna. En cada ciclo, el campo magnético del Sol invierte sus polos.\nEl ciclo actual, el número 25, alcanzó su máximo hacia 2024 y 2025. Entre 1645 y 1715 apenas se vieron manchas: es el llamado mínimo de Maunder, que coincidió con un periodo especialmente frío en Europa.", "d": "grafica"}, {"t": "Futuro del Sol", "x": "El Sol tiene unos 4600 millones de años y está a mitad de su vida. Su brillo aumenta despacio, alrededor de un 10 % cada 1000 millones de años, así que dentro de unos 1000 millones de años la Tierra será demasiado caliente para tener océanos.\nDentro de unos 5000 millones de años agotará el hidrógeno del núcleo y se hinchará como gigante roja, cientos de veces mayor. Al final quedará una enana blanca: un resto apagándose, del tamaño de la Tierra."}]}, {"n": 24, "titulo": "Los planetas rocosos", "intro": "Los cuatro planetas más cercanos al Sol están hechos de roca y metal. Compararlos explica por qué la Tierra es como es y cómo la distancia, el tamaño y la historia deciden el destino de un planeta.", "puntos": [{"t": "Mercurio", "x": "Mercurio es el planeta más pequeño y más cercano al Sol, a unos 58 millones de km. Su diámetro es de 4880 km, poco mayor que el de la Luna. Da una vuelta al Sol en 88 días y casi no tiene atmósfera.\nSin aire que reparta el calor, de día alcanza unos 430 °C y de noche baja a unos 180 °C bajo cero. Lo estudió la sonda MESSENGER entre 2011 y 2015, y la europea y japonesa BepiColombo partió hacia él en 2018."}, {"t": "Venus", "x": "Venus tiene casi el tamaño de la Tierra, pero es un mundo infernal. Su atmósfera de dióxido de carbono pesa tanto que la presión en el suelo es 92 veces la terrestre, y atrapa tanto calor que la superficie está a unos 465 °C, más que en Mercurio.\nSus nubes son de ácido sulfúrico. Gira al revés que casi todos los planetas y muy despacio: una rotación dura 243 días, más que su año, de 225. La sonda soviética Venera 7 aterrizó allí en 1970."}, {"t": "La Tierra", "x": "La Tierra es el mayor de los planetas rocosos, con un radio de 6371 km, y el más denso del sistema solar. Es el único mundo conocido con océanos de agua líquida en la superficie, que cubren el 71 % de ella, y con vida.\nSu interior caliente mantiene la tectónica de placas y un campo magnético que nos protege del viento solar. Tiene además una luna grande, que estabiliza la inclinación de su eje y, con ello, el clima."}, {"t": "Marte", "x": "Marte tiene la mitad del diámetro de la Tierra y un día de 24 horas y 37 minutos. Su color rojo se debe al óxido de hierro del suelo. Su atmósfera es muy tenue: la presión es menos del 1 % de la terrestre.\nTiene el mayor volcán conocido, Olympus Mons, de unos 22 km de altura, y un cañón, Valles Marineris, de unos 4000 km. Sus cauces secos revelan antiguos ríos. Hoy lo exploran róveres como Curiosity, desde 2012, y Perseverance, desde 2021."}, {"t": "Tamaño, masa y densidad", "x": "La densidad es la masa dividida por el volumen: d = m / V. Nos da pistas sobre el interior de un planeta sin poder verlo. El agua tiene 1 gramo por centímetro cúbico, una roca corriente unos 3 y el hierro casi 8.\nLa Tierra tiene 5,5; Venus, 5,2; Marte, 3,9; y Mercurio, 5,4, pese a ser mucho más pequeño. Eso indica que Mercurio tiene un núcleo de hierro enorme, que ocupa cerca del 85 % de su radio.", "d": "tabla"}, {"t": "Superficies planetarias", "x": "En las superficies rocosas se ven cráteres de impacto, volcanes, llanuras de lava y cañones. Cuantos más cráteres, más antigua es la superficie, porque nada la ha renovado.\nMercurio está cubierto de cráteres, como la Luna. En la Tierra la erosión y la tectónica los borran. Venus, oculto por nubes, fue cartografiado con radar por la sonda Magallanes entre 1990 y 1994: tiene pocos cráteres, señal de que la lava lo cubrió hace unos cientos de millones de años."}, {"t": "Atmósferas", "x": "Una atmósfera depende de la gravedad del planeta, de su temperatura y de su historia. Los planetas pequeños y calientes pierden el gas con facilidad.\nMercurio casi no tiene atmósfera. Venus tiene una densísima, con un 96 % de dióxido de carbono. La de la Tierra es 78 % nitrógeno y 21 % oxígeno. En Marte, también de dióxido de carbono, la presión es unas 160 veces menor que la nuestra. El dióxido de carbono retiene calor, lo que explica el horno de Venus."}, {"t": "Actividad geológica", "x": "Los planetas guardan calor interno de su formación y de la radiactividad de sus rocas. Ese calor mueve el interior y genera volcanes, terremotos y montañas. Los planetas pequeños se enfrían antes y se vuelven inactivos.\nLa Tierra sigue muy activa. En Marte, el sismómetro de la sonda InSight registró más de 1300 «martemotos» entre 2018 y 2022. Mercurio, al enfriarse, encogió unos 7 km de radio y se le arrugó la corteza en largos escarpes."}, {"t": "Agua y hielo", "x": "La Tierra es la única con agua líquida en superficie, pero no la única con agua. Marte tiene casquetes polares de hielo de agua y de dióxido de carbono, y mucho hielo bajo el suelo. Incluso Mercurio guarda hielo en cráteres de sus polos que nunca reciben luz solar, confirmado por MESSENGER en 2012.\nVenus probablemente tuvo agua, pero la perdió: su atmósfera conserva un proporción de hidrógeno pesado más de 100 veces mayor que la de la Tierra, huella de esa pérdida."}, {"t": "Comparación entre planetas rocosos", "x": "Los cuatro tienen un núcleo metálico, un manto de roca y una corteza. Lo que los diferencia es sobre todo su tamaño y su distancia al Sol.\nVenus y la Tierra son casi gemelos en tamaño, pero uno acabó con un efecto invernadero desbocado y el otro con océanos. Marte, con la décima parte de la masa terrestre, se enfrió pronto y perdió casi todo su aire. Mercurio, el más pequeño y cercano, es casi un núcleo de hierro con una fina capa de roca."}]}, {"n": 25, "titulo": "Los planetas gigantes", "intro": "Más allá del cinturón de asteroides están cuatro planetas enormes sin superficie sólida. Contienen casi toda la masa planetaria del sistema solar y nos enseñan cómo se forman y funcionan los planetas gigantes que vemos en otras estrellas.", "puntos": [{"t": "Júpiter", "x": "Júpiter es el planeta más grande: su radio es 11 veces el de la Tierra y su masa, 318 veces mayor, más del doble que la de todos los demás planetas juntos. Gira a unos 780 millones de km del Sol y tarda casi 12 años en dar una vuelta.\nAun así, rota muy rápido: su día dura menos de 10 horas. Está formado sobre todo por hidrógeno y helio, y desde 2016 lo estudia de cerca la sonda Juno, de la NASA."}, {"t": "Saturno", "x": "Saturno es el segundo planeta más grande, con un radio unas 9 veces el terrestre y 95 veces la masa de la Tierra. Es tan poco denso, 0,7 gramos por centímetro cúbico, que flotaría en una bañera gigante llena de agua.\nEstá a unos 1400 millones de km del Sol y es famoso por sus anillos. La sonda Cassini lo estudió desde 2004 hasta el 15 de septiembre de 2017, cuando se lanzó contra su atmósfera para no contaminar sus lunas."}, {"t": "Urano", "x": "Urano tiene unas 4 veces el diámetro de la Tierra y 14,5 veces su masa. Fue el primer planeta descubierto con telescopio, por William Herschel en 1781. Su color azul verdoso se debe al metano de su atmósfera, que absorbe la luz roja.\nSu eje está inclinado 98 grados: gira casi tumbado. Como tarda 84 años en dar la vuelta al Sol, cada polo pasa unos 42 años de luz continua y otros 42 a oscuras. Solo lo ha visitado la Voyager 2, en 1986."}, {"t": "Neptuno", "x": "Neptuno es el planeta más lejano, a unos 4500 millones de km del Sol, unas 30 veces la distancia Tierra-Sol. Su tamaño es parecido al de Urano y tiene 17 veces la masa de la Tierra. Tarda 165 años en completar una órbita.\nFue el primer planeta encontrado gracias a cálculos matemáticos, en 1846. Tiene los vientos más rápidos del sistema solar, de hasta unos 2000 km/h. La Voyager 2 lo visitó en 1989 y fotografió su gran luna Tritón."}, {"t": "Gigantes gaseosos y gigantes helados", "x": "Júpiter y Saturno son gigantes gaseosos: están hechos sobre todo de hidrógeno y helio, en proporciones parecidas a las del Sol. Urano y Neptuno son más pequeños y se llaman gigantes helados.\nEn astronomía, «hielos» son sustancias como el agua, el amoníaco y el metano, aunque dentro de estos planetas no están congeladas, sino en forma de fluidos calientes y muy comprimidos. Estos hielos forman la mayor parte de la masa de Urano y Neptuno."}, {"t": "Atmósferas profundas", "x": "Los planetas gigantes no tienen un suelo donde posarse. Al bajar, el gas se vuelve cada vez más denso y caliente hasta comportarse como un líquido. En el interior de Júpiter, a millones de veces la presión atmosférica, el hidrógeno se convierte en un fluido metálico que conduce la electricidad.\nEn diciembre de 1995, una cápsula de la sonda Galileo entró en Júpiter. Descendió casi una hora y unos 150 km por debajo de las nubes antes de sucumbir a la presión y el calor."}, {"t": "Anillos", "x": "Los cuatro planetas gigantes tienen anillos, aunque solo los de Saturno son brillantes. Están formados por innumerables trozos de hielo de agua, desde granos de polvo hasta bloques de varios metros, cada uno en su propia órbita.\nLos anillos principales de Saturno miden unos 270 000 km de diámetro, pero su grosor suele ser de apenas decenas de metros: proporcionalmente, mucho más finos que una hoja de papel. Los de Urano se descubrieron en 1977 y los de Júpiter, en 1979."}, {"t": "Tormentas", "x": "Las atmósferas de los gigantes forman tormentas enormes que pueden durar siglos, porque no hay continentes que las frenen.\nLa Gran Mancha Roja de Júpiter es un torbellino más ancho que la Tierra, observado de forma continua desde hace casi 200 años, aunque está encogiendo. En el polo norte de Saturno, una corriente forma un hexágono cuyos lados miden unos 14 500 km. En Neptuno, la Voyager 2 vio en 1989 una Gran Mancha Oscura que en 1994 ya había desaparecido."}, {"t": "Campos magnéticos", "x": "Un campo magnético planetario nace del movimiento de un fluido que conduce la electricidad. En Júpiter y Saturno es el hidrógeno metálico; en Urano y Neptuno, probablemente un océano profundo de agua muy caliente con partículas cargadas.\nEl de Júpiter es el más potente: su intensidad total es unas 20 000 veces la del terrestre y su zona de influencia alcanza millones de kilómetros. Los de Urano y Neptuno están muy inclinados respecto a su eje de giro, unos 59 y 47 grados."}, {"t": "Comparación con los planetas rocosos", "x": "Los rocosos son pequeños, densos y sólidos, con pocas lunas o ninguna. Los gigantes son enormes, poco densos, sin superficie, con muchas lunas y anillos. Júpiter tiene una densidad de 1,3 gramos por centímetro cúbico; la Tierra, de 5,5.\nLa diferencia viene del lugar donde nacieron. Más allá de la línea de hielo, a unas 3 a 5 veces la distancia Tierra-Sol, el frío permitía que el agua se congelara. Con tanto material sólido crecieron núcleos grandes que atraparon mucho gas.", "d": "sistema"}]}, {"n": 26, "titulo": "Cuerpos menores", "intro": "Además del Sol y los planetas, el sistema solar está lleno de lunas, asteroides, cometas y fragmentos más pequeños. Son restos de su formación y guardan pistas de cómo era hace 4600 millones de años.", "puntos": [{"t": "Lunas", "x": "Una luna, o satélite natural, es un cuerpo que gira alrededor de un planeta. La nuestra mide 3474 km de diámetro y está a unos 384 400 km. Mercurio y Venus no tienen lunas; Marte tiene dos pequeñas, Fobos y Deimos, y los gigantes tienen decenas cada uno.\nAlgunas son mundos enormes. Ganímedes, de Júpiter, mide 5268 km y es mayor que el planeta Mercurio. Titán, de Saturno, tiene una atmósfera más densa que la de la Tierra."}, {"t": "Asteroides", "x": "Los asteroides son cuerpos rocosos o metálicos, sin forma esférica en su mayoría, que giran alrededor del Sol. Se conocen más de un millón, desde rocas de pocos metros hasta Ceres, de unos 940 km, considerado planeta enano desde 2006.\nSon restos de planetesimales que nunca llegaron a formar un planeta. La sonda Psyche, lanzada en octubre de 2023, viaja hacia un asteroide que parece rico en metal y podría ser el núcleo desnudo de un antiguo protoplaneta."}, {"t": "Cometas", "x": "Un cometa es un bloque de hielo, polvo y roca de pocos kilómetros. Lejos del Sol es oscuro e inactivo, pero al acercarse el calor convierte el hielo en gas, que forma una nube brillante alrededor del núcleo, la coma, y largas colas que apuntan en sentido contrario al Sol.\nEl cometa Halley vuelve cada 76 años: pasó en 1986 y volverá en 2061. La sonda europea Rosetta acompañó al cometa 67P desde 2014 hasta 2016 y le envió el módulo Philae."}, {"t": "Meteoroides", "x": "Los meteoroides son fragmentos pequeños que viajan por el espacio, desde granos de polvo hasta objetos de alrededor de un metro. Por encima de ese tamaño se habla ya de asteroides.\nLa mayoría son polvo que sueltan los cometas o trozos arrancados en choques entre asteroides. Son muy abundantes: se calcula que la Tierra recibe cada día decenas de toneladas de este material, casi todo en forma de partículas diminutas que nadie nota."}, {"t": "Meteoros", "x": "Un meteoro, o «estrella fugaz», es el destello que se produce cuando un meteoroide entra en la atmósfera a entre 11 y 72 km por segundo. El choque con el aire lo calienta y lo vaporiza a unos 80 a 120 km de altura.\nCuando la Tierra cruza la estela de polvo de un cometa se produce una lluvia de meteoros. Las Perseidas, cada agosto, vienen del cometa Swift-Tuttle y en su máximo pueden verse hasta unas 100 por hora."}, {"t": "Meteoritos", "x": "Un meteorito es el fragmento que sobrevive al paso por la atmósfera y llega al suelo. Los hay rocosos, metálicos y mixtos. Los más comunes, las condritas, apenas han cambiado desde la formación del sistema solar.\nEl 15 de febrero de 2013, un objeto de unos 20 metros explotó sobre la ciudad rusa de Cheliábinsk y la onda expansiva rompió miles de ventanas. Se recogieron muchos fragmentos; el mayor, de unos 650 kg, se sacó del fondo de un lago."}, {"t": "Cinturón de asteroides", "x": "La mayoría de los asteroides giran entre Marte y Júpiter, en el cinturón de asteroides. La gravedad de Júpiter agitó esa zona e impidió que sus planetesimales se unieran en un planeta.\nAunque las ilustraciones lo muestran abarrotado, está casi vacío: entre asteroide y asteroide suele haber cientos de miles de kilómetros o más, y las sondas lo cruzan sin problema. Su masa total es solo un 3 % de la de la Luna, y Ceres reúne casi el 40 % de ella.", "d": "sistema"}, {"t": "Cinturón de Kuiper", "x": "Más allá de Neptuno, entre unas 30 y 50 veces la distancia Tierra-Sol, hay otro cinturón formado por cuerpos helados: el cinturón de Kuiper. Allí están planetas enanos como Plutón, Eris y Makemake.\nPlutón mide 2377 km de diámetro y desde 2006 se considera planeta enano. El 14 de julio de 2015, la sonda New Horizons pasó junto a él y descubrió montañas de hielo de agua y una gran llanura de nitrógeno helado con forma de corazón."}, {"t": "Nube de Oort", "x": "La nube de Oort sería una enorme esfera de cuerpos helados que rodea el sistema solar, desde unas 2000 hasta unas 100 000 veces la distancia Tierra-Sol. Nunca se ha observado directamente: su existencia se deduce de las órbitas de los cometas de periodo largo, que llegan desde todas las direcciones.\nLa propuso Jan Oort en 1950. La sonda Voyager 1, el objeto humano más lejano, tardaría unos 300 años en alcanzar su borde interior."}, {"t": "Impactos y cráteres", "x": "Cuando un cuerpo choca contra un planeta a decenas de km por segundo, libera muchísima energía y excava un cráter mucho mayor que él. Los impactos grandes son raros, pero han cambiado la historia de la Tierra.\nHace 66 millones de años, un asteroide de unos 10 km abrió el cráter de Chicxulub, de unos 180 km, ligado a la extinción de los dinosaurios. En 2022, la sonda DART chocó a propósito con el asteroide Dimorphos y acortó su órbita en 32 minutos."}]}, {"n": 27, "titulo": "Exploración espacial", "intro": "Casi todo lo que sabemos del universo llega a través de la luz, pero en el sistema solar podemos además enviar máquinas. La exploración espacial combina física, ingeniería y paciencia para llegar a donde ningún telescopio alcanza.", "puntos": [{"t": "Observación desde la Tierra", "x": "Los telescopios terrestres recogen más luz cuanto mayor es su espejo, pero la atmósfera emborrona las imágenes y absorbe parte de la radiación. Por eso los observatorios se construyen en montañas altas y secas, lejos de las luces de las ciudades.\nEn el desierto de Atacama, en Chile, se está construyendo el Extremely Large Telescope, con un espejo de 39 metros. Y en 1609, Galileo empezó a observar el cielo con un telescopio cuya lente medía unos pocos centímetros."}, {"t": "Sondas espaciales", "x": "Una sonda espacial es una nave robótica que viaja a otros cuerpos del sistema solar para estudiarlos de cerca. No lleva tripulación, así que puede viajar durante décadas y soportar condiciones que ningún ser humano resistiría.\nLa Voyager 1, lanzada en 1977, sobrevoló Júpiter y Saturno y siguió alejándose. En 2012 se convirtió en el primer objeto humano en salir de la burbuja del viento solar, y hoy está a más de 24 000 millones de km."}, {"t": "Orbitadores", "x": "Un orbitador es una sonda que entra en órbita alrededor de un planeta o una luna y lo estudia durante años, cubriendo toda su superficie. Para quedarse, debe frenar con sus motores en el momento justo al llegar.\nLa Mars Reconnaissance Orbiter observa Marte desde 2006 y su cámara distingue objetos de alrededor de un metro en el suelo. La sonda Cassini orbitó Saturno durante 13 años y descubrió chorros de agua en su luna Encélado."}, {"t": "Módulos de aterrizaje", "x": "Un módulo de aterrizaje se posa en la superficie para medir el suelo, el aire o los terremotos. Lo más difícil es frenar: en Marte, una nave entra a unos 20 000 km/h y debe detenerse en unos siete minutos con escudo térmico, paracaídas y retrocohetes, sin ayuda desde la Tierra.\nEl 14 de enero de 2005, el módulo europeo Huygens aterrizó en Titán, la luna de Saturno: es el aterrizaje más lejano realizado hasta hoy."}, {"t": "Róveres", "x": "Un róver es un vehículo robótico con ruedas que se desplaza por la superficie, con cámaras, brazos e instrumentos para analizar rocas. Permite estudiar muchos lugares distintos con una sola misión.\nEl primero en Marte fue Sojourner, en 1997. Opportunity se diseñó para 90 días y funcionó 14 años, hasta 2018, recorriendo unos 45 km. Perseverance, que llegó en 2021, guarda muestras de roca para traerlas a la Tierra en el futuro."}, {"t": "Asistencias gravitatorias", "x": "Una asistencia gravitatoria aprovecha el paso cerca de un planeta para cambiar la velocidad y la dirección de una sonda sin gastar combustible. La sonda se lleva una mínima parte del movimiento del planeta alrededor del Sol, y este se frena de forma inapreciable.\nLa Voyager 2 usó una alineación de planetas que se repite cada unos 175 años para visitar Júpiter, Saturno, Urano y Neptuno, saltando de uno a otro con su gravedad.", "d": "orbita"}, {"t": "Comunicación con sondas", "x": "Las sondas se comunican por ondas de radio. La Red de Espacio Profundo de la NASA tiene grandes antenas, de hasta 70 metros, en California, España y Australia, repartidas para que siempre haya alguna mirando hacia cada sonda mientras la Tierra gira.\nLas señales llegan debilísimas. La Voyager 1 emite con unos 20 vatios, menos que una bombilla corriente, y desde tan lejos envía datos a solo 160 bits por segundo, miles de veces más lento que una conexión doméstica."}, {"t": "Retraso de las señales", "x": "Las ondas de radio viajan a la velocidad de la luz, pero las distancias son tan grandes que siempre hay retraso. Una señal tarda 1,3 segundos en llegar a la Luna y, según la posición de los planetas, entre unos 3 y 22 minutos en llegar a Marte.\nPor eso no se puede conducir un róver en directo: recibe instrucciones y las ejecuta con cierta autonomía. A la Voyager 1, un mensaje tarda unas 23 horas en llegar, y la respuesta otras tantas."}, {"t": "Navegación espacial", "x": "Para saber dónde está una sonda se mide cuánto tarda una señal de radio en ir y volver, lo que da la distancia, y cómo cambia su frecuencia por el efecto Doppler, lo que da la velocidad. Con esos datos se corrige la trayectoria con breves encendidos del motor.\nLos errores salen caros. En 1999 se perdió la Mars Climate Orbiter porque un equipo usó unidades inglesas y otro el sistema métrico: la sonda se acercó demasiado a Marte y se destruyó."}, {"t": "Limitaciones de las misiones", "x": "Explorar el espacio es caro, lento y arriesgado. Cada kilo enviado exige mucho combustible, los viajes duran años y la radiación y el frío dañan los aparatos. Lejos del Sol los paneles solares apenas sirven, y se usan generadores que obtienen electricidad del calor del plutonio-238.\nLas estrellas siguen fuera de alcance. La Voyager 1 viaja a unos 17 km por segundo; a esa velocidad tardaría unos 75 000 años en recorrer la distancia hasta Próxima Centauri."}]}, {"n": 28, "titulo": "Nacimiento de las estrellas", "intro": "Las estrellas nacen en nubes frías de gas y polvo que se derrumban por su propia gravedad. Entender ese proceso explica de dónde salen el Sol, los planetas y casi toda la luz del universo.", "puntos": [{"t": "Medio interestelar", "x": "El espacio entre las estrellas no está vacío: contiene gas, sobre todo hidrógeno y helio, y una pequeña cantidad de polvo, granos diminutos de silicatos y carbono. El polvo supone solo alrededor del 1 % de la masa de ese material.\nEs extremadamente tenue: de media hay aproximadamente un átomo por centímetro cúbico, mientras que el aire que respiramos tiene unos 25 trillones de moléculas en ese mismo volumen. Aun así, es la materia prima de todas las estrellas nuevas."}, {"t": "Nubes moleculares", "x": "Las regiones más densas y frías del medio interestelar forman nubes moleculares, donde el hidrógeno se une en moléculas de dos átomos (H₂). Su temperatura ronda los 10-20 kelvin, unos 260 °C bajo cero, y las mayores contienen material para cientos de miles o millones de soles.\nEl polvo las vuelve opacas a la luz visible, por eso se estudian en infrarrojo y ondas de radio. La nube de Orión, a unos 1300 años luz, es la región más cercana donde se forman estrellas masivas."}, {"t": "Gravedad y colapso", "x": "Una nube está sometida a dos efectos opuestos: su gravedad tiende a juntarla y la presión del gas, debida al movimiento de sus partículas, tiende a dispersarla. Si una zona acumula suficiente masa en poco espacio y está lo bastante fría, gana la gravedad y empieza a contraerse.\nEl empujón inicial puede venir de la onda de choque que deja la explosión de una estrella cercana o del choque entre nubes. Un núcleo denso tarda unos cientos de miles de años en colapsar."}, {"t": "Fragmentación de nubes", "x": "Al contraerse, una nube grande no forma una sola estrella: se rompe en muchos fragmentos, y cada uno puede colapsar por su cuenta. Por eso las estrellas suelen nacer en grupos, llamados cúmulos.\nEn la nebulosa de Orión hay más de mil estrellas jóvenes nacidas juntas, y las Pléyades, visibles a simple vista en Tauro, son un cúmulo de más de 1000 estrellas formadas hace unos 100 millones de años. El Sol probablemente nació en un cúmulo que luego se dispersó."}, {"t": "Protoestrellas", "x": "Cada fragmento que colapsa forma en su centro una protoestrella: una bola de gas que se calienta porque, al caer y comprimirse, la materia convierte energía gravitatoria en calor. Todavía no fusiona hidrógeno; brilla solo gracias a esa contracción.\nEstá envuelta en polvo, así que se observa sobre todo en infrarrojo. Desde el inicio del colapso, una estrella como el Sol tarda unas decenas de millones de años en llegar a ser una estrella estable."}, {"t": "Discos de acreción", "x": "Las nubes giran un poco, y al encogerse giran cada vez más deprisa, como un patinador que recoge los brazos. Por eso el material no cae directamente: se aplana en un disco que rodea a la protoestrella y la va alimentando poco a poco. Por él la estrella acumula masa: es un disco de acreción.\nEn 2014, el radiotelescopio ALMA fotografió el disco de la joven estrella HL Tauri, a unos 450 años luz, con anillos y huecos donde probablemente se forman planetas."}, {"t": "Jets y chorros", "x": "Una parte del material del disco no llega a la estrella: los campos magnéticos lo canalizan y lo expulsan en dos chorros estrechos, uno por cada polo, perpendiculares al disco. Salen a cientos de kilómetros por segundo y pueden extenderse más de un año luz.\nCuando chocan con el gas que los rodea forman nubecillas brillantes llamadas objetos Herbig-Haro. Estos chorros ayudan a la estrella a librarse del exceso de giro, que de otro modo le impediría seguir creciendo."}, {"t": "Temperatura y presión", "x": "Mientras la protoestrella se contrae, su centro se comprime y se calienta. En un gas, la presión aumenta con la densidad y con la temperatura: cuanto más apretadas están las partículas y más rápido se mueven, con más fuerza empujan.\nEse aumento de presión frena el colapso, pero el gas también pierde energía al radiar luz, así que sigue encogiéndose lentamente y calentándose más. El centro pasa de unos pocos miles de grados a varios millones de grados."}, {"t": "Inicio de la fusión nuclear", "x": "Cuando el centro alcanza unos 10 millones de grados, los núcleos de hidrógeno (protones) chocan con tanta energía que vencen su repulsión eléctrica y se fusionan en helio, liberando energía. En ese momento nace una estrella de verdad.\nHace falta una masa mínima de unas 0,08 veces la del Sol, unas 80 veces la de Júpiter. Por debajo se forman enanas marrones, objetos que nunca llegan a fusionar hidrógeno de forma estable y que se van enfriando poco a poco."}, {"t": "Equilibrio hidrostático", "x": "Una estrella estable vive en equilibrio hidrostático: en cada capa, el peso del material que tiene encima, tirado hacia dentro por la gravedad, se compensa con la presión del gas caliente, que empuja hacia fuera. La energía de la fusión mantiene ese gas caliente.\nPor eso el Sol no se encoge ni se expande: lleva unos 4600 millones de años con un tamaño casi constante, con un radio de unos 696.000 km.", "d": "sol"}]}, {"n": 29, "titulo": "Propiedades de las estrellas", "intro": "Masa, tamaño, brillo, temperatura o edad: con unas pocas propiedades se puede describir cualquier estrella. Casi todas se deducen solo de la luz que nos llega, y la masa decide casi todo lo demás.", "puntos": [{"t": "Masa", "x": "La masa es la propiedad más importante de una estrella: determina su temperatura, su brillo, cuánto vive y cómo muere. Se expresa en masas solares; el Sol tiene unos 2·10³⁰ kg, unas 333.000 veces la masa de la Tierra.\nLas estrellas van desde unas 0,08 hasta más de 100 masas solares. Solo se puede medir directamente en estrellas dobles, a partir de su órbita: así se sabe que Sirio A tiene unas 2 masas solares."}, {"t": "Radio", "x": "El radio del Sol es de unos 696.000 km, 109 veces el de la Tierra, y sirve de unidad para comparar. Las más pequeñas, como Próxima Centauri, tienen una séptima parte del radio solar.\nEn el otro extremo, la supergigante roja Betelgeuse tiene un radio de varios cientos de veces el del Sol: colocada en su lugar, llegaría más allá de la órbita de Marte. El radio se mide con eclipses, interferometría o combinando luminosidad y temperatura."}, {"t": "Luminosidad", "x": "La luminosidad es la energía total que emite una estrella cada segundo, en todas direcciones y en todas las longitudes de onda. Es una potencia y se mide en vatios: la del Sol es de unos 3,8·10²⁶ W.\nSirio A emite unas 25 veces más que el Sol, mientras que Próxima Centauri emite unas 600 veces menos. La luminosidad no depende de la distancia: es una propiedad de la propia estrella."}, {"t": "Brillo aparente", "x": "El brillo aparente es cuánta luz nos llega, y depende de la luminosidad y de la distancia. La luz se reparte sobre esferas cada vez mayores, así que el brillo disminuye con el cuadrado de la distancia: b = L / (4·π·d²), donde b es el brillo, L la luminosidad y d la distancia.\nSirio, la estrella más brillante del cielo nocturno, lo es sobre todo porque está cerca, a 8,6 años luz; Rigel es mucho más luminosa, pero está unas cien veces más lejos."}, {"t": "Temperatura", "x": "Se suele dar la temperatura de la superficie visible. La del Sol es de unos 5800 kelvin; las estrellas más frías rondan los 2500-3000 K y las más calientes superan los 40.000 K.\nSe calcula a partir del espectro: un cuerpo caliente emite con más intensidad a una longitud de onda que es menor cuanto mayor es su temperatura. Aproximadamente, λ = 2.900.000 / T, con λ en nanómetros y T en kelvin; para el Sol sale unos 500 nm."}, {"t": "Color", "x": "El color de una estrella delata su temperatura, igual que el hierro al rojo está menos caliente que el hierro al blanco. Las estrellas frías se ven rojizas, las intermedias amarillentas o blancas y las más calientes, azuladas.\nEn Orión se ve muy bien: Betelgeuse, a unos 3600 K, es claramente anaranjada, y Rigel, a unos 12.000 K, es blanco azulada. La luz del Sol, a 5800 K, es en realidad blanca; la atmósfera hace que lo veamos amarillento.", "d": "espectro"}, {"t": "Composición", "x": "Las líneas del espectro revelan de qué está hecha una estrella. Casi todas son sobre todo hidrógeno y helio: el Sol tiene, en masa, un 73 % de hidrógeno, un 25 % de helio y solo un 2 % de los demás elementos, que los astrónomos llaman «metales».\nEl helio se descubrió precisamente así: en 1868 apareció en el espectro del Sol una línea amarilla que no correspondía a ningún elemento conocido. En la Tierra no se aisló hasta 1895."}, {"t": "Rotación", "x": "Las estrellas giran sobre sí mismas. El Sol no es sólido, así que no gira igual en todas partes: su ecuador da una vuelta en unos 25 días y las zonas cercanas a los polos, en unos 35. Se mide siguiendo las manchas o por efecto Doppler, porque un borde se acerca y el otro se aleja.\nLas estrellas jóvenes y las masivas giran mucho más deprisa: Vega da una vuelta en unas 12,5 horas, tan rápido que está achatada por los polos."}, {"t": "Campos magnéticos", "x": "El gas de las estrellas está formado por partículas con carga eléctrica en movimiento, y las cargas en movimiento generan campos magnéticos. La rotación y la convección los retuercen e intensifican, como en una dinamo.\nEn las manchas solares el campo es miles de veces más intenso que el de la Tierra. Se detecta porque divide algunas líneas espectrales en varias (efecto Zeeman). Las enanas rojas, estrellas pequeñas y frías como Próxima Centauri, sufren violentas fulguraciones magnéticas."}, {"t": "Edad", "x": "La edad de una estrella no se puede medir directamente: se deduce comparando sus propiedades con modelos de evolución estelar, o estudiando cúmulos, cuyas estrellas nacieron a la vez. Además, las estrellas jóvenes giran rápido y se frenan con los años, lo que también sirve de reloj.\nPara el Sol hay un dato más preciso: los meteoritos más antiguos tienen unos 4567 millones de años. Algunas estrellas muy antiguas de nuestra galaxia superan los 12.000 millones de años."}]}, {"n": 30, "titulo": "El diagrama de Hertzsprung-Russell", "intro": "El diagrama de Hertzsprung-Russell ordena las estrellas según su luminosidad y su temperatura. Es el mapa más útil de la astrofísica estelar: muestra qué tipos de estrellas existen y cómo cambian a lo largo de su vida.", "puntos": [{"t": "Luminosidad y temperatura", "x": "Hacia 1911-1913, Ejnar Hertzsprung y Henry Norris Russell tuvieron por separado la misma idea: representar cada estrella como un punto, con su luminosidad en el eje vertical y su temperatura en el horizontal. Por tradición, la temperatura aumenta hacia la izquierda.\nLos puntos no quedan repartidos al azar: se agrupan en unas pocas zonas bien definidas. Eso indica que solo ciertas combinaciones de tamaño, brillo y temperatura son posibles, y cada zona corresponde a una etapa de la vida estelar.", "d": "hr"}, {"t": "Secuencia principal", "x": "La mayoría de las estrellas, alrededor del 90 %, se sitúan en una franja diagonal llamada secuencia principal, que va de arriba a la izquierda (calientes y luminosas) a abajo a la derecha (frías y débiles). Son estrellas que fusionan hidrógeno en su núcleo.\nEl Sol está hacia el centro. Abajo están las enanas rojas, de unos 3000 K y menos de una centésima de la luminosidad solar; arriba, estrellas azules de más de 30.000 K que brillan cientos de miles de veces más."}, {"t": "Gigantes", "x": "Arriba a la derecha aparecen las gigantes: estrellas frías, rojas o anaranjadas, pero muy luminosas. Si una estrella fría brilla tanto es porque tiene una superficie enorme; la luminosidad depende tanto de la temperatura como del tamaño.\nArturo, la estrella más brillante de Boyero, es una gigante a unos 4300 K, más fría que el Sol, pero con un radio unas 25 veces mayor brilla unas 170 veces más. Las gigantes son estrellas que ya han agotado el hidrógeno de su centro."}, {"t": "Supergigantes", "x": "En la parte más alta del diagrama están las supergigantes, las estrellas más luminosas: decenas o cientos de miles de veces más que el Sol. Pueden ser rojas, como Betelgeuse, o azules, como Rigel, ambas en Orión.\nSon estrellas de más de unas 10 masas solares en una fase avanzada de su vida. Son escasas, porque esa fase dura poco: Betelgeuse tiene solo unos 10 millones de años y acabará estallando."}, {"t": "Enanas blancas", "x": "Abajo a la izquierda están las enanas blancas: muy calientes pero muy débiles, porque son diminutas. Son los restos compactos de estrellas como el Sol al final de su vida.\nSirio B, la compañera de Sirio, tiene una masa parecida a la del Sol comprimida en una esfera del tamaño de la Tierra, y su superficie está a unos 25.000 K. Su materia es tan densa que un centímetro cúbico pesaría más de una tonelada."}, {"t": "Clasificación estelar", "x": "Las estrellas se clasifican por su espectro en tipos ordenados de más caliente a más fría: O, B, A, F, G, K y M. Cada tipo se subdivide del 0 al 9. El sistema se desarrolló en el observatorio de Harvard a principios del siglo XX, con un papel destacado de Annie Jump Cannon.\nSe añade un número romano según el tamaño: V para la secuencia principal, III para las gigantes, I para las supergigantes. El Sol es una G2 V; Rigel, una B8 I."}, {"t": "Relación entre masa y luminosidad", "x": "En la secuencia principal, la posición de una estrella depende sobre todo de su masa: cuanto más masiva, más caliente y luminosa. Aproximadamente, la luminosidad es la masa elevada a 3,5, ambas medidas en unidades del Sol: una estrella con el doble de masa brilla unas 11 veces más.\nEsto tiene una consecuencia clave: las estrellas masivas gastan su combustible mucho más deprisa. El Sol vivirá unos 10.000 millones de años; una estrella de 10 masas solares, solo unos 30 millones."}, {"t": "Evolución de las estrellas en el diagrama", "x": "Una estrella no se queda quieta en el diagrama: su punto se desplaza a medida que cambia. Una protoestrella llega a la secuencia principal desde la derecha y allí pasa la mayor parte de su vida.\nCuando agota el hidrógeno de su núcleo, se hincha y se enfría, y sube hacia la zona de las gigantes. Al Sol le ocurrirá dentro de unos 5000 millones de años; después expulsará sus capas externas y su núcleo quedará como una enana blanca, abajo a la izquierda."}, {"t": "Lectura de datos estelares", "x": "El diagrama sirve para medir. Si el espectro dice que una estrella es como el Sol, conocemos su luminosidad, y al compararla con su brillo aparente obtenemos la distancia: si se ve un millón de veces más débil que otra igual situada a 10 años luz, está mil veces más lejos, a 10.000 años luz.\nEn un cúmulo, las estrellas más masivas abandonan antes la secuencia principal; el punto donde la secuencia «se dobla» indica la edad del cúmulo."}]}, {"n": 31, "titulo": "La vida de las estrellas", "intro": "Una estrella pasa la mayor parte de su vida fusionando hidrógeno en su centro. Cómo lo hace y a qué ritmo depende de su masa, que decide si vivirá unos pocos millones de años o billones.", "puntos": [{"t": "Fusión del hidrógeno", "x": "En el núcleo de una estrella, cuatro núcleos de hidrógeno acaban convertidos en uno de helio. El helio resultante tiene un 0,7 % menos de masa que los cuatro protones, y esa masa perdida se transforma en energía según E = m·c², donde m es la masa y c la velocidad de la luz.\nEl Sol fusiona unos 600 millones de toneladas de hidrógeno cada segundo y pierde así unos 4 millones de toneladas de masa por segundo, convertidas en luz y calor."}, {"t": "Cadena protón-protón", "x": "En estrellas como el Sol o más pequeñas, la fusión sigue la cadena protón-protón. Primero dos protones se unen y uno se convierte en neutrón, formando deuterio (hidrógeno pesado) y emitiendo un neutrino. Luego el deuterio captura otro protón y forma helio-3, y dos núcleos de helio-3 se unen en helio-4 y liberan dos protones.\nLos neutrinos escapan del Sol casi sin interaccionar: por cada centímetro cuadrado de nuestra piel pasan unos 65.000 millones cada segundo."}, {"t": "Ciclo CNO", "x": "En estrellas de más de unas 1,3 masas solares domina otra vía: el ciclo CNO, propuesto en 1938-1939 por Hans Bethe y Carl Friedrich von Weizsäcker. Los núcleos de carbono, nitrógeno y oxígeno actúan como intermediarios: capturan protones y, tras varios pasos, devuelven el carbono inicial y un núcleo de helio.\nEs muy sensible a la temperatura, por eso domina en núcleos más calientes. En el Sol aporta solo alrededor del 1 % de la energía; sus neutrinos se detectaron en 2020."}, {"t": "Equilibrio entre gravedad y presión", "x": "La fusión funciona como un termostato. Si en el núcleo se produce un poco más de energía, el gas se calienta, aumenta su presión y el núcleo se expande; al expandirse se enfría y la fusión se frena. Si se produce menos, la gravedad lo comprime, se calienta y la fusión se acelera.\nGracias a este equilibrio, el Sol cambia muy despacio: desde su nacimiento, hace 4600 millones de años, su luminosidad solo ha aumentado alrededor de un 30 %.", "d": "fuerzas"}, {"t": "Consumo de combustible", "x": "Una estrella no quema todo su hidrógeno, solo el de su núcleo, donde la temperatura es suficiente. En el Sol, alrededor del 10 % de su hidrógeno llegará a fusionarse durante esta etapa.\nEl tiempo de vida se puede estimar como t = combustible / ritmo de consumo. El Sol tiene combustible para unos 10.000 millones de años y ha consumido casi la mitad. Las estrellas masivas tienen más combustible, pero lo gastan a un ritmo muchísimo mayor y viven mucho menos."}, {"t": "Estrellas de baja masa", "x": "Las estrellas de menos de media masa solar son enanas rojas: frías, pequeñas y débiles. En las más pequeñas, la convección agita todo su interior, mezcla el hidrógeno y les permite aprovecharlo casi entero.\nConsumen tan despacio que pueden vivir billones de años, mucho más que la edad actual del universo, unos 13.800 millones de años: ninguna se ha apagado todavía. Son las más abundantes; Próxima Centauri, la estrella más cercana al Sol, es una de ellas."}, {"t": "Estrellas de masa intermedia", "x": "Entre media masa solar y unas 8 masas solares están las estrellas de masa intermedia, entre ellas el Sol. Viven desde unas decenas de millones hasta decenas de miles de millones de años, según su masa.\nAl agotar el hidrógeno central se convierten en gigantes rojas, fusionan helio y finalmente expulsan sus capas externas, dejando una enana blanca. Sirio A, con unas 2 masas solares, vivirá alrededor de 1000 millones de años, una décima parte que el Sol."}, {"t": "Estrellas masivas", "x": "Las estrellas de más de unas 8 masas solares son calientes, azuladas y enormemente luminosas. Su núcleo alcanza temperaturas tan altas que, tras el hidrógeno y el helio, fusionan carbono, oxígeno, silicio y otros elementos, hasta llegar al hierro.\nViven muy poco: una estrella de 20 masas solares dura unos 10 millones de años. Son raras, pero influyen muchísimo en su galaxia, porque su radiación, sus vientos y su explosión final remueven y enriquecen el gas que las rodea."}, {"t": "Evolución según la masa inicial", "x": "La masa inicial decide el destino de una estrella. Simplificando: por debajo de media masa solar, viven billones de años y acaban como enanas blancas; entre media y unas 8 masas solares, pasan por gigantes rojas y terminan también como enanas blancas; por encima, explotan como supernovas.\nTras la explosión queda una estrella de neutrones, una esfera de unos 20 km hecha casi solo de neutrones, o, si el núcleo es muy masivo, un agujero negro, del que ni la luz puede escapar."}]}, {"n": 32, "titulo": "La muerte de las estrellas", "intro": "Cuando una estrella agota su combustible, la gravedad vuelve a ganar terreno y la estrella cambia de forma drástica. Según su masa, termina como enana blanca, estrella de neutrones o agujero negro.", "puntos": [{"t": "Agotamiento del hidrógeno", "x": "Tras miles de millones de años, el núcleo de una estrella como el Sol queda convertido en helio. Sin hidrógeno que fusionar en el centro, la presión ya no basta para sostenerlo, y el núcleo se contrae y se calienta.\nEl hidrógeno sigue fusionándose en una capa que rodea al núcleo, ahora con más intensidad. La estrella se vuelve más luminosa y empieza a cambiar de aspecto. Al Sol le ocurrirá dentro de unos 5000 millones de años."}, {"t": "Gigantes rojas", "x": "La energía extra de la capa que fusiona hidrógeno empuja las capas exteriores, que se expanden enormemente y se enfrían hasta unos 3000-4000 K: la estrella se convierte en una gigante roja. Su radio puede multiplicarse por cien o más.\nCuando el Sol llegue a esta fase engullirá a Mercurio y Venus, y quizá también a la Tierra. Aldebarán, el ojo rojizo de Tauro, a unos 65 años luz, es una gigante con un radio unas 44 veces el del Sol."}, {"t": "Fusión del helio", "x": "Cuando el núcleo de helio alcanza unos 100 millones de grados, el helio empieza a fusionarse: tres núcleos de helio-4 se unen para formar uno de carbono-12, y algunos carbonos capturan otro helio y forman oxígeno-16.\nEn estrellas como el Sol, esta ignición es repentina y se llama destello del helio. Después la estrella se estabiliza y fusiona helio en su núcleo durante unos 100 millones de años, mucho menos que la etapa del hidrógeno."}, {"t": "Capas de fusión", "x": "En las estrellas masivas el proceso se repite: cuando se agota un combustible, el núcleo se contrae, se calienta y empieza a fusionar el siguiente. La estrella acaba con una estructura en capas, como una cebolla: hidrógeno fuera y, hacia dentro, helio, carbono, neón, oxígeno, silicio y un núcleo de hierro.\nCada etapa es más breve: en una estrella de 25 masas solares, el hidrógeno dura millones de años y el silicio, apenas un día. Fusionar hierro ya no libera energía."}, {"t": "Nebulosas planetarias", "x": "Al final de su fase de gigante, una estrella como el Sol expulsa suavemente sus capas externas. El núcleo al descubierto está tan caliente que su ultravioleta hace brillar ese gas, formando una nebulosa planetaria que dura unas decenas de miles de años.\nEl nombre es engañoso: con los telescopios del siglo XVIII parecían discos de planetas, pero no tienen nada que ver con ellos. La nebulosa de la Hélice, a unos 650 años luz, es una de las más cercanas."}, {"t": "Enanas blancas", "x": "El núcleo que queda es una enana blanca, hecha sobre todo de carbono y oxígeno. No fusiona nada: lo que la sostiene contra la gravedad es que sus electrones, muy apretados, se resisten a comprimirse más por un efecto cuántico.\nEse soporte tiene un límite: unas 1,4 masas solares, el límite de Chandrasekhar, calculado en 1930. El Sol dejará una enana blanca con alrededor de la mitad de su masa y del tamaño de la Tierra, que se enfriará durante miles de millones de años."}, {"t": "Supernovas", "x": "Cuando el núcleo de hierro de una estrella masiva supera ese límite, nada lo sostiene: se desploma en menos de un segundo. La materia que cae rebota y una onda de choque, impulsada por un enorme flujo de neutrinos, hace estallar la estrella: es una supernova, capaz de brillar tanto como una galaxia entera.\nEn 1987 se vio una en la Gran Nube de Magallanes, a unos 168.000 años luz, y se detectaron sus neutrinos. El Cangrejo es el resto de otra, observada en 1054."}, {"t": "Estrellas de neutrones", "x": "Si el núcleo que sobrevive a la supernova tiene entre unas 1,4 y 2 o 3 masas solares, la presión lo aplasta tanto que electrones y protones se combinan en neutrones. Queda una estrella de neutrones: más masa que el Sol en una esfera de unos 20 km de diámetro, el tamaño de una ciudad.\nSu densidad es como la de un núcleo atómico: un centímetro cúbico de su materia pesaría cientos de millones de toneladas."}, {"t": "Púlsares", "x": "Al encogerse, la estrella de neutrones conserva el giro y el campo magnético del núcleo original concentrados en muy poco espacio, así que gira muy deprisa y tiene un campo intensísimo. Emite dos haces de radiación por sus polos magnéticos y, si al girar nos barren como un faro, recibimos pulsos regulares: es un púlsar.\nEl primero lo descubrieron Jocelyn Bell Burnell y Antony Hewish en 1967, con pulsos cada 1,34 segundos. El púlsar del Cangrejo gira unas 30 veces por segundo."}, {"t": "Agujeros negros", "x": "Si el núcleo restante supera unas 2 o 3 masas solares, ni siquiera los neutrones pueden detener el colapso. La materia se comprime sin límite conocido y forma un agujero negro: una región con una gravedad tan intensa que nada, ni siquiera la luz, puede salir de ella.\nCygnus X-1, en la constelación del Cisne, a unos 7200 años luz, fue el primer objeto ampliamente aceptado como agujero negro, en los años setenta; tiene unas 21 masas solares."}]}, {"n": 33, "titulo": "El origen de los elementos", "intro": "Casi todos los átomos que nos rodean, salvo el hidrógeno y buena parte del helio, se fabricaron dentro de estrellas. Este tema explica cómo el universo pasó de tener casi solo dos elementos a tener los más de noventa que hay en la naturaleza.", "puntos": [{"t": "Hidrógeno y helio primordiales", "x": "Al principio, hace unos 13.800 millones de años, el universo era extremadamente caliente y denso. Durante sus primeros minutos funcionó como un gran horno de fusión: protones y neutrones se unieron para formar núcleos ligeros. Luego se enfrió demasiado deprisa y el proceso se detuvo.\nEl resultado fue, en masa, alrededor de un 75 % de hidrógeno, un 25 % de helio y trazas de litio. Las estrellas más antiguas conservan casi exactamente esa composición."}, {"t": "Fusión estelar", "x": "Todo lo demás se ha fabricado después, sobre todo en las estrellas. Su núcleo es un horno que transforma elementos ligeros en otros más pesados: hidrógeno en helio, helio en carbono y oxígeno y, en las estrellas masivas, estos en neón, magnesio, silicio, azufre y finalmente hierro.\nCada fusión libera energía hasta llegar al hierro, cuyos núcleos están entre los más estables. La idea se formuló con detalle en 1957, en un célebre artículo de Burbidge, Burbidge, Fowler y Hoyle."}, {"t": "Carbono, oxígeno y elementos intermedios", "x": "El carbono nace de la unión de tres núcleos de helio. En 1953, Fred Hoyle razonó que, para que hubiera tanto carbono como observamos, el núcleo de carbono debía tener un estado de energía concreto que facilitara esa reacción; poco después se encontró en el laboratorio.\nAñadiendo más núcleos de helio se forman oxígeno, neón, magnesio y silicio. El oxígeno supone alrededor del 65 % de la masa de nuestro cuerpo y casi la mitad de la corteza terrestre."}, {"t": "Supernovas", "x": "La explosión de una supernova calienta y comprime de golpe las capas de la estrella, lo que provoca nuevas reacciones nucleares en segundos. Así se forma, por ejemplo, níquel-56 radiactivo, que se desintegra en cobalto y luego en hierro.\nEsa desintegración mantiene brillando a la supernova durante meses: en la de 1987 se midió que la luz decaía al ritmo del cobalto-56, cuya vida media es de 77 días. Además, la explosión lanza al espacio todo lo fabricado."}, {"t": "Captura de neutrones", "x": "Los elementos más pesados que el hierro no se forman por fusión, porque fabricarlos consume energía. Se forman cuando un núcleo captura neutrones, que no tienen carga y no son repelidos; después, algunos neutrones se convierten en protones y el núcleo pasa a ser otro elemento.\nHay un proceso lento, en gigantes rojas, y uno rápido, en sucesos violentos. En 1952 se detectó tecnecio en gigantes rojas: no tiene isótopos estables, así que tenía que haberse fabricado allí."}, {"t": "Elementos pesados", "x": "El oro, el platino o el uranio requieren sobre todo el proceso rápido: el núcleo recibe un aluvión de neutrones en cuestión de segundos. Ocurre en entornos extremos, como la fusión de dos estrellas de neutrones.\nEl 17 de agosto de 2017 se observó una de esas fusiones a unos 130 millones de años luz. Su luz, llamada kilonova, indicó que se formaron oro y platino en cantidades de varias veces la masa de la Tierra. Parte del oro terrestre pudo nacer así."}, {"t": "Enriquecimiento del medio interestelar", "x": "Las estrellas devuelven al espacio buena parte de lo que fabrican, mediante vientos estelares, nebulosas planetarias y supernovas. Ese material se mezcla con el gas interestelar, que se enriquece en elementos pesados con cada generación de estrellas.\nPor eso las estrellas jóvenes contienen más de estos elementos que las antiguas. El Sol tiene alrededor de un 2 % en masa; algunas estrellas muy antiguas de la Vía Láctea tienen menos de una milésima parte del hierro solar."}, {"t": "Formación de nuevos sistemas planetarios", "x": "Cuando una nube enriquecida colapsa, sus estrellas nacen con esos elementos y sus discos contienen polvo de silicatos, hierro y hielos, los ladrillos de los planetas. Sin las generaciones de estrellas anteriores no habría planetas rocosos.\nLos meteoritos más antiguos guardan pruebas de ello: contienen restos de aluminio-26, radiactivo, con una vida media de unos 700.000 años, que debió fabricarse en estrellas cercanas poco antes de que se formara el sistema sola
